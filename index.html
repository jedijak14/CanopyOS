}

/* weather glyphs — drawn, not emoji */
function weatherGlyph(code, size) {
  const s = size || 22;
  const sun = (op) => `<g opacity="${op ?? 1}"><circle cx="9" cy="9" r="4.2" fill="#fcd34d"/><g stroke="#fcd34d" stroke-width="1.6" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a=>`<line x1="9" y1="2.2" x2="9" y2="4" transform="rotate(${a} 9 9)"/>`).join("")}</g></g>`;
  const cloud = (fill, op) => `<path opacity="${op ?? 1}" d="M8 19h9.5a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.5 9.6 4.3 4.3 0 0 0 8 19z" fill="${fill}"/>`;
  const rain = () => cloud("#cbd5e1") + `<g stroke="#7dd3fc" stroke-width="1.8" stroke-linecap="round"><line x1="9" y1="21" x2="8" y2="24"/><line x1="13" y1="21" x2="12" y2="24"/><line x1="17" y1="21" x2="16" y2="24"/></g>`;
  const snow = () => cloud("#e2e8f0") + `<g fill="#bae6fd"><circle cx="9" cy="22" r="1.1"/><circle cx="13.5" cy="23" r="1.1"/><circle cx="17" cy="21.6" r="1.1"/></g>`;
  const storm = () => cloud("#94a3b8") + `<path d="M13.5 20l-3 4h2.4l-1 3 4-4.6h-2.4l1.6-2.4z" fill="#fbbf24"/>`;
  let body;
  if (code === 0) body = sun();
  else if (code === 1) body = sun(0.9) + cloud("#e2e8f0", 0.85);
  else if (code === 2) body = sun(0.55) + cloud("#cbd5e1");
  else if (code === 3) body = cloud("#94a3b8") + cloud("#cbd5e1", 0.75);
  else if (code === 45 || code === 48) body = cloud("#cbd5e1") + `<g stroke="#e2e8f0" stroke-width="1.4" opacity=".7"><circle cx="7" cy="17" r="1.6" fill="none"/><circle cx="12" cy="20" r="2" fill="none"/><circle cx="17" cy="16.5" r="1.4" fill="none"/></g>`;
  else if (code >= 51 && code <= 67) body = rain();
  else if (code >= 71 && code <= 77) body = snow();
  else if (code >= 80 && code <= 82) body = rain();
  else if (code >= 95) body = storm();
  else body = cloud("#cbd5e1");
  return `<svg width="${s}" height="${s}" viewBox="0 0 26 27" aria-hidden="true">${body}</svg>`;
}

}

function isRain(code) { return (code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95; }
function weatherBackground(current) {
  if (!current) return "linear-gradient(155deg,#244761,#7899a8 60%,#c2d3ca)";
  const c = current.weather_code;
  if (isRain(c)) return "linear-gradient(155deg,#172d40,#536d7b 55%,#839ba1)";
  if (c >= 71 && c <= 77 || c >= 85 && c <= 86) return "linear-gradient(150deg,#526b85,#b2c7d4 65%,#e3e9ea)";
  if (!current.is_day) return "radial-gradient(ellipse at 75% 20%,#7d8ac2,transparent 28%),linear-gradient(150deg,#101e38,#273b68 60%,#455879)";
  if (c >= 2) return "radial-gradient(ellipse at 30% 20%,#e2ebee,transparent 40%),linear-gradient(150deg,#5284a9,#a4bbc7)";
  return "radial-gradient(circle at 75% 20%,#fff4c2,transparent 25%),linear-gradient(150deg,#3b8ab5,#91d5e4 70%,#eadfc5)";
}
function refreshWallpaper() {
  const wall = $("#bg-wall");
  if (!wall || OS.phase !== "desktop") return;
  const wp = WALLPAPERS.find(w => w.id === OS.settings.wallpaper);
  wall.style.cssText = wallpaperCSS(OS.settings.wallpaper) + ";background-size:cover;background-position:center";
  wall.classList.remove("blurred", "live", "weather-rain", "weather-snow");
  if (wp && wp.live) wall.classList.add("live");
  if (wp && wp.id === "weather" && liveWeather) {
    const c = liveWeather.weather_code;
    if (isRain(c)) wall.classList.add("weather-rain");
    else if ((c >= 71 && c <= 77) || (c >= 85 && c <= 86)) wall.classList.add("weather-snow");
  }
}
async function refreshLiveWeather() {
  const city = OS.settings.city, request = ++weatherRequest;
  liveWeather = null; refreshWallpaper();
  try {
    const data = await fetchWeather(city.lat, city.lon);
    if (request !== weatherRequest) return;
    liveWeather = data.current; refreshWallpaper();
  } catch { /* retain a neutral scene when offline */ }
}
function requestLocation() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error("Location is not supported by this browser."));
    navigator.geolocation.getCurrentPosition(pos => resolve({ name: "Current location", lat: pos.coords.latitude, lon: pos.coords.longitude, tz: Intl.DateTimeFormat().resolvedOptions().timeZone }), err => reject(new Error(err.code === 1 ? "Location permission was denied." : "Your location is unavailable.")), { enableHighAccuracy: false, timeout: 12000, maximumAge: 300000 });
  });
}
function wallpaperCSS(id) {
  if (id === "weather") return `background:${weatherBackground(liveWeather)}`;
  const w = WALLPAPERS.find((x) => x.id === id) || WALLPAPERS[0];
  return w.img ? `background-image:url('${w.img}')` : `background:${w.css}`;
}

const Users = {
  all() { return store.get("users", []); },
  save(list) { store.set("users", list); },
  byId(id) { return this.all().find((u) => u.id === id) || null; },
  create({ name, password, avatar, color }) {
    const list = this.all();
    const h = password ? hashPassword(password) : { hash: null, salt: null };
    const u = {
      id: Date.now(),
      name: String(name || "User").trim().slice(0, 32),
      avatar: avatar || "🌿",
      color: color || "#34d399",
      pwHash: h.hash,
      pwSalt: h.salt,
      settings: {},
    };
    list.push(u);
    this.save(list);
    return u;
  },
  update(id, patch) {
    const list = this.all();
    const u = list.find((x) => x.id === id);
    if (!u) return null;
    Object.assign(u, patch);
    this.save(list);
    return u;
  },
  remove(id) {
    this.save(this.all().filter((u) => u.id !== id));
    store.del("notes." + id);
    store.del("reminders." + id);
    store.del("notifications." + id);
    PhotoStore.del(id).catch(() => {});
    if (store.get("session") === id) store.del("session");
  },
  login(id, password) {
    const u = this.byId(id);
    if (!u) return { ok: false, error: "Profile not found" };
    if (u.pwHash && !verifyPassword(password || "", u.pwHash, u.pwSalt)) return { ok: false, error: "Incorrect password" };
    return { ok: true, user: u };
  },
};

  update(userId, id, patch) {
    const list = this.all(userId);
    const n = list.find((x) => x.id === id);
    if (!n) return null;
    Object.assign(n, patch, { updatedAt: new Date().toISOString() });
    list.sort((a, b) => (a.pinned === b.pinned ? b.updatedAt.localeCompare(a.updatedAt) : a.pinned ? -1 : 1));

    return n;
  },
  remove(userId, id) { this.save(userId, this.all(userId).filter((n) => n.id !== id)); },
};

/* ── genie (minimize/restore) effect ─────────────────────────────── */
function _solve8(A, b) {
  const n = 8;
  const M = A.map((r, i) => [...r, b[i]]);
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    [M[c], M[p]] = [M[p], M[c]];
    const d = M[c][c] || 1e-9;
    for (let k = c; k <= n; k++) M[c][k] /= d;
    for (let r = 0; r < n; r++) {
      if (r === c) continue;
      const f = M[r][c];
      if (!f) continue;
      for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k];
    }
  }
  return M.map((r) => r[n]);
}
function _matrixFor(W, H, dst) {
  const src = [[0, 0], [W, 0], [W, H], [0, H]];
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = src[i];
    const [u, v] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -x * u, -y * u]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -x * v, -y * v]); b.push(v);

}

const _c01 = (t) => clamp(t, 0, 1);
const _ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function runGenie(elm, target, dir, duration = 720) {
  return new Promise((resolve) => {
    const W = elm.offsetWidth, H = elm.offsetHeight;
    const left = elm.offsetLeft, top = elm.offsetTop;
    const cx0 = left + W / 2;
    const tx = target.left + target.width / 2;
    const ty = target.top + target.height * 0.55;
    const iw = Math.max(18, target.width * 0.55);
    elm.style.transformOrigin = "0 0";
    elm.style.willChange = "transform, opacity";
    const start = performance.now();
    let stopped = false;
    const frame = (now) => {
      if (stopped) return;
      const raw = _c01((now - start) / duration);
      const p = dir === "out" ? raw : 1 - raw;
      const pp = Math.min(p, 0.992);
      const eb = _ease(_c01(pp / 0.82));
      const et = _ease(_c01((pp - 0.14) / 0.86));
      const ew = _ease(_c01(pp / 0.78));
      const ewt = _ease(_c01((pp - 0.22) / 0.78));
      const bx = _lerp(cx0, tx, eb);
      const by = _lerp(top + H, ty, eb);
      const bw = _lerp(W, iw, ew);
      const tcx = _lerp(cx0, tx, et);
      const tcy = _lerp(top, ty, et);
      const tw = _lerp(W, iw, ewt);
      const byy = Math.max(by, tcy + 1);
      const quad = [
        [tcx - tw / 2 - left, tcy - top],
        [tcx + tw / 2 - left, tcy - top],
        [bx + bw / 2 - left, byy - top],
        [bx - bw / 2 - left, byy - top],
      ];
      elm.style.transform = _matrixFor(W, H, quad);
      elm.style.opacity = String(p > 0.85 ? Math.max(0, (1 - p) / 0.15) : 1);
      if (raw < 1) requestAnimationFrame(frame);
      else {
        elm.style.willChange = "";
        resolve();
      }
    };
    requestAnimationFrame(frame);
    return () => { stopped = true; };
  });
}

<script>

  const vw = window.innerWidth, vh = window.innerHeight;
  const n = OS.windows.filter((w) => !w.closing).length;
  const w = Math.max(160, Math.min(meta.w, vw - 20));
  const h = Math.max(140, Math.min(meta.h, vh - MENUBAR_H - 30));
  const off = (n % 7) * 28;
  const win = {
    id: uid(),
    app,
    title: meta.name,
    x: Math.max(10, Math.round((vw - w) / 2 - 60 + off)),
    y: Math.max(MENUBAR_H + 8, Math.round((vh - h) / 2 - 50 + off * 0.8)),
    w, h,
    z: ++OS.zTop,
    minimized: false,
    maximized: false,
    prev: null,
    props: { ...props, nonce: Date.now() },
    view: null,       // app view instance {update, destroy}
    closing: false,
  };
  if (app === "fern") { win.x = Math.max(8, vw - w - 18); win.y = MENUBAR_H + 12; }
  win.x = clamp(win.x, 0, Math.max(0, vw - win.w));
  win.y = clamp(win.y, MENUBAR_H, Math.max(MENUBAR_H, vh - win.h));
  OS.windows.push(win);
  playSound("pop");
  bus.emit("windows");
  return win.id;
}

function closeWindow(id) {
  const w = OS.windows.find((x) => x.id === id);
  if (!w || w.closing) return;
  w.closing = true;
  bus.emit("windows");
  setTimeout(() => {
    try { w.view && w.view.destroy && w.view.destroy(); } catch (e) { console.warn(e); }
    try { w._offActive && w._offActive(); } catch (e) {}
    OS.windows = OS.windows.filter((x) => x.id !== id);
    bus.emit("windows");
  }, 210);
}

function closeAll() {
  for (const w of [...OS.windows]) closeWindow(w.id);
}

function focusWindow(id) {
  const w = OS.windows.find((x) => x.id === id);
  if (!w) return;
  const wasActive = OS.activeId;
  w.z = ++OS.zTop;
  if (w.minimized) w.minimized = false;
  if (wasActive !== OS.activeId) bus.emit("active");
  bus.emit("windows");
}

function minimizeWindow(id) {
  const w = OS.windows.find((x) => x.id === id);
  if (!w || w.minimized) return;
  const elm = w.elm;
  if (!elm) { w.minimized = true; bus.emit("windows"); return; }
  const cancel = runGenie(elm, dockRectFor(w.app), "out", 720);
  setTimeout(() => { w.minimized = true; bus.emit("windows"); }, 700);
}

function restoreWindow(id) {
  const w = OS.windows.find((x) => x.id === id);
  if (!w) return;
  if (!w.minimized) { focusWindow(id); return; }
  w.minimized = false;
  w.z = ++OS.zTop;
  bus.emit("windows");
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const elm = w.elm;
    if (!elm) return;
    runGenie(elm, dockRectFor(w.app), "in", 680).then(() => {
      elm.style.transform = "";
      elm.style.opacity = "";
      elm.style.transformOrigin = "";
    }).catch(() => {});
  }));
}

function fitWindowsToViewport() {
  for (const w of OS.windows) {
    if (w.maximized) { Object.assign(w, { x:0, y:MENUBAR_H, w:window.innerWidth, h:Math.max(100, window.innerHeight - MENUBAR_H) }); }
    else {
      w.w = Math.min(w.w, Math.max(160, window.innerWidth - 16));
      w.h = Math.min(w.h, Math.max(140, window.innerHeight - MENUBAR_H - 8));
      w.x = clamp(w.x, 0, Math.max(0, window.innerWidth - w.w));
      w.y = clamp(w.y, MENUBAR_H, Math.max(MENUBAR_H, window.innerHeight - w.h));
    }
  }
  bus.emit("windows");
}
function toggleMaximize(id) {
  const w = OS.windows.find((x) => x.id === id);
  if (!w || w.closing) return;
  if (w.maximized) {
    if (w.prev) Object.assign(w, w.prev);
    w.maximized = false; w.prev = null;
  } else {
    w.prev = { x:w.x, y:w.y, w:w.w, h:w.h };
    w.maximized = true;
  }
  w.z = ++OS.zTop;
  w.anim = true;
  fitWindowsToViewport();
  setTimeout(() => { w.anim = false; rerenderWindows(); }, 480);
}
function tileWindow(id, side) {
  const w = OS.windows.find(x => x.id === id);
  if (!w) return;
  if (w.maximized && w.prev) Object.assign(w, w.prev);
  w.maximized = false; w.prev = null;
  const gap = 8, width = Math.floor((window.innerWidth - gap * 3) / 2);
  Object.assign(w, {x:side === "left" ? gap : width + gap * 2, y:MENUBAR_H + gap, w:width, h:Math.max(100, window.innerHeight - MENUBAR_H - 90), z:++OS.zTop});
  w.anim = true; bus.emit("windows");
  setTimeout(() => { w.anim = false; rerenderWindows(); }, 480);
}

function setGeometry(id, g) {
  const w = OS.windows.find((x) => x.id === id);
  if (!w) return;
  Object.assign(w, g, { maximized: false, prev: null });
  bus.emit("windows");
}
function setWindowTitle(id, title) {
  const w = OS.windows.find((x) => x.id === id);
  if (w && w.title !== title) { w.title = title; bus.emit("windows", true); }
}

/* ── Fern integration ────────────────────────────────────────────── */
function openFern(seed) {
  const id = openApp("fern", seed ? { text: seed } : {});
  return id;
}
function closeFern() {
  const w = OS.windows.find((x) => x.app === "fern" && !x.closing);
  if (w) closeWindow(w.id);
}

/* ── toasts / notifications ──────────────────────────────────────── */
function notify(t) {
  const toast = { id: uid(), ...t, time: Date.now() };
  if (OS.user) { const history = store.get("notifications." + OS.user.id, []); store.set("notifications." + OS.user.id, [toast, ...history].slice(0, 50)); }
  if (ccState.dnd) return;
  OS.toasts = [...OS.toasts.slice(-3), toast];
  playSound("notify");
  renderToasts();
  setTimeout(() => dismissToast(toast.id), 6000);
}
function dismissToast(id) {
  OS.toasts = OS.toasts.filter((x) => x.id !== id);
  renderToasts();
}
function setTimer(seconds, label) {
  setTimeout(() => notify({ title: label ? label : "Timer done", body: "The timer you set has finished.", app: "clock" }), clamp(seconds, 1, 86400) * 1000);
}

/* ── session ─────────────────────────────────────────────────────── */
function signIn(u) {
  OS.user = { id: u.id, name: u.name, avatar: u.avatar, color: u.color, hasPassword: !!u.pwHash };
  const s = { ...DEFAULT_SETTINGS, ...(u.settings || {}) };
  if (!WALLPAPERS.find((w) => w.id === s.wallpaper)) s.wallpaper = DEFAULT_SETTINGS.wallpaper;
  OS.settings = s;
  store.set("session", u.id);
  setMasterVolume(s.volume);
  applyTheme();
  bus.emit("user");
}
function resetDesktop() {
  closeAll();
  OS.user = null;
  OS.settings = { ...DEFAULT_SETTINGS };
  OS.toasts = [];
  store.del("session");
  bus.emit("user");
}
async function logout() { resetDesktop(); setPhase("login"); renderLogin(); }
async function restart() { resetDesktop(); setPhase("boot"); startBoot(); }
async function shutdown() { resetDesktop(); setPhase("off"); }

/* ═══ Boot ═════════════════════════════════════════════════════════ */
const BOOT_MSGS = ["Waking the canopy…", "Loading Liquid Glass…", "Starting Fern…", "Preparing your workspace…", "Almost there…"];
let bootTimers = [];
function startBoot() {
  const scr = $("#boot");
  scr.classList.remove("leaving");
  $$(".boot-msg", scr).forEach((m) => m.remove());
  playSound("boot");
  const msg = el("div", "boot-msg", BOOT_MSGS[0]);
  scr.appendChild(msg);
  bootTimers.forEach(clearTimeout);
  bootTimers = [
    setTimeout(() => (msg.textContent = BOOT_MSGS[1]), 900),
    setTimeout(() => (msg.textContent = BOOT_MSGS[2]), 1700),
    setTimeout(() => (msg.textContent = BOOT_MSGS[3]), 2500),
    setTimeout(() => (msg.textContent = BOOT_MSGS[4]), 3200),
    setTimeout(() => scr.classList.add("leaving"), 3900),
    setTimeout(async () => {
      // auto sign-in if a session exists
      const sid = store.get("session", null);
      const u = sid && Users.byId(sid);
      if (u) {
        signIn(u);
        setPhase("desktop");
        renderDesktop();
      } else {
        setPhase("login");
        renderLogin();
      }
    }, 4500),
  ];
}

/* ═══ Hello (macOS-style welcome) ═════════════════════════════════ */
/* "hello" written as one continuous pen stroke, in the spirit of the
   macOS Tahoe welcome animation: pure black stage, the word draws on
   left-to-right at pen speed, blooms softly, holds, then fades away. */
const HELLO_STROKES = [
  // h — ascender, down, shoulder, exit connector
  "M 92 122 C 82 170 72 260 74 308 C 75 326 80 336 90 336 C 100 334 108 306 114 280 C 122 248 134 230 148 234 C 162 238 167 258 162 280 C 157 303 147 325 142 335 C 140 340 147 341 154 336",
  // e — rise, loop, exit along the baseline
  "M 154 336 C 168 328 186 310 198 294 C 205 285 203 275 194 276 C 181 278 170 290 171 305 C 172 320 184 332 202 334 C 214 335 226 334 235 330",
  // l — tall loop closing at x-height, stem to baseline
  "M 235 330 C 252 322 264 300 274 270 C 280 250 286 222 292 200 C 297 180 300 156 306 143 C 312 131 322 135 322 150 C 321 170 300 205 288 230 C 280 247 278 300 286 330 C 289 337 296 338 304 335",
  // l
  "M 304 335 C 321 327 333 305 343 275 C 349 255 355 227 361 205 C 366 185 369 161 375 148 C 381 136 391 140 391 155 C 390 175 369 210 357 235 C 349 252 347 305 355 335 C 358 342 365 343 373 340",
  // o — diagonal rise, round bowl, folded close, sweeping tail
  "M 373 340 C 400 336 440 320 468 299 C 483 288 494 273 499 260 C 502 248 492 238 479 241 C 459 246 440 260 429 279 C 419 294 417 316 427 330 C 437 342 459 346 477 338 C 489 332 496 320 495 306 C 497 296 500 298 502 304 C 505 314 512 322 524 324 C 536 326 546 322 554 316",
];
function playHello(done) {
  const scr = $("#hello");
  scr.classList.remove("leaving", "lit");
  scr.style.display = "";
  const wrap = $("#hello-art");
  wrap.innerHTML = "";
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "40 85 550 295");
  const SPEED = 760; // pen speed, px/s — the whole word takes ~2.4s
  let t = 0.35;
  const paths = [];
  for (const d of HELLO_STROKES) {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("class", "stroke");
    svg.appendChild(path);
    paths.push(path);
  }
  wrap.appendChild(svg);
  // sequential draw-on, chained by measured path lengths
  paths.forEach((path) => {
    let len = 600;
    try { len = path.getTotalLength(); } catch {}
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    const dur = Math.max(0.12, len / SPEED);
    path.style.animation = `helloDraw ${dur}s cubic-bezier(.45,.05,.55,.95) ${t}s forwards`;
    t += dur;
  });
  const drawDone = t + 0.15;
  let finished = false;
  const timers = [
    setTimeout(() => scr.classList.add("lit"), drawDone * 1000),
    setTimeout(() => finish(), (drawDone + 1.15) * 1000),
  ];
  const kill = [on(scr, "click", finish), on(window, "keydown", function h(e) { if (e.key === "Escape" || e.key === "Enter" || e.key === " ") { finish(); } })];
  function finish() {
    if (finished) return;
    finished = true;
    kill.forEach((k) => k());
    timers.forEach((tm) => clearTimeout(tm));
    scr.classList.add("leaving");
    setTimeout(() => { scr.style.display = "none"; done && done(); }, 800);
  }
}

/* ═══ Login ════════════════════════════════════════════════════════ */
const AVATARS = ["🌿", "🦊", "🐼", "🦉", "🐙", "🦋", "🌸", "🚀", "🎧", "🍃", "🐢", "⭐"];
const COLORS = ["#34d399", "#38bdf8", "#a78bfa", "#f472b6", "#fb923c", "#facc15", "#f87171", "#94a3b8"];
let loginTimer = null;

function renderLogin() {
  const scr = $("#login");
  scr.classList.remove("leaving");
  clearInterval(loginTimer);
  const clock = $(".login-clock .d", scr);
  const timeEl = $(".login-clock .t", scr);
  const tick = () => {
    const now = new Date();
    if (clock) clock.textContent = now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
    if (timeEl) timeEl.textContent = now.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }).replace(/\s?[AP]M/i, "");
  };
  tick();
  loginTimer = setInterval(tick, 1000);

  const body = $(".login-body", scr);
  body.innerHTML = "";
  body.appendChild(el("div", "spin"));

  let users = null;
  fetchlessList();

  function fetchlessList() {
    setTimeout(() => {
      users = Users.all();
      paint();
    }, 350);
  }

  function enter(u) {
    playSound("start");
    scr.classList.add("leaving");
    setTimeout(() => {
      signIn(u);
      setPhase("desktop");
      renderDesktop();
      playHello(() => {});
    }, 520);
  }

  function doLogin(u, password) {
    const res = Users.login(u.id, password);
    if (!res.ok) {
      err.textContent = res.error;
      formWrap.style.animation = "none";
      void formWrap.offsetWidth;
      formWrap.style.animation = "shake .45s";
      playSound("error");
      return;
    }
    enter(u);
  }

  const err = el("div", "login-err");
  let formWrap = el("div");
  body.appendChild(formWrap);
  body.appendChild(err);

  function paint() {
    const sp0 = $(".spin", scr);
    if (sp0) sp0.remove();
    formWrap.innerHTML = "";
    err.textContent = "";
    if (!users.length) return paintCreate(true);
    // pick selected user
    let sel = users._sel || (users.length === 1 && users[0].pwHash ? users[0] : null);
    if (users._creating) return paintCreate(false);
    if (sel) return paintSel(sel);
    const grid = el("div", "login-users");
    for (const u of users) {
      const b = el("button", "login-user");
      b.appendChild(makeAvatar(u, 84));
      b.appendChild(el("span", "nm", esc(u.name)));
      b.onclick = () => {
        users._sel = u;
        paint();
      };
      grid.appendChild(b);
    }
    const add = el("button", "login-user");
    add.innerHTML = `<span class="login-add glass">+</span><span class="nm">Add User</span>`;
    add.onclick = () => { users._creating = true; paint(); };
    grid.appendChild(add);
    formWrap.style.animation = "popIn .5s both";
    formWrap.appendChild(grid);
    formWrap.appendChild(el("div", "login-sub", "Choose a profile to sign in"));
  }

  function paintSel(u) {
    const wrap = el("div");
    wrap.style.animation = "popIn .45s both";
    wrap.appendChild(makeAvatar(u, 104));
    wrap.appendChild(el("div", "", `<div style="margin-top:16px;font-size:24px;font-weight:600;text-shadow:0 1px 10px rgba(0,0,0,.4)">${esc(u.name)}</div>`));
    if (u.pwHash) {
      const row = el("form", "pw-row");
      row.innerHTML = `<span class="pw-pill glass"><input type="password" placeholder="Enter Password" aria-label="Password"/></span><button type="submit" class="pw-go">→</button>`;
      row.onsubmit = (e) => { e.preventDefault(); doLogin(u, $("input", row).value); };
      wrap.appendChild(row);
    } else {
      wrap.appendChild(el("div", "login-sub", "Touch to sign in"));
      const b = el("button", "btn");
      b.textContent = "Sign In";
      b.style.cssText = "margin-top:14px;background:rgba(255,255,255,.2);color:#fff;border-radius:99px;padding:8px 28px";
      b.onclick = () => doLogin(u);
      wrap.appendChild(b);
    }
    if (users.length > 1) {
      const back = el("button", "login-other", "‹ Other Users");
      back.onclick = () => { users._sel = null; paint(); };
      wrap.appendChild(back);
    }
    formWrap.appendChild(wrap);
    const inp = $("input", wrap);
    if (inp) setTimeout(() => inp.focus(), 60);
  }

  function paintCreate(first) {
    const form = { name: "", password: "", avatar: AVATARS[0], color: COLORS[0] };
    const panel = el("div", "login-panel glass glass-dark");
    panel.style.animation = "popIn .45s both";
    const avPrev = makeAvatar(form, 84);
    const avRow = el("div");
    avRow.style.cssText = "display:flex;justify-content:center";
    avRow.appendChild(avPrev);
    panel.appendChild(avRow);
    panel.appendChild(el("div", "ttl", `<div class="a1">${first ? "Welcome to CanopyOS" : "New Profile"}</div><div class="a2">${first ? "Set up your first profile to get started" : "Create a new account"}</div>`));
    const avs = el("div", "av-picker");
    AVATARS.forEach((a) => {
      const b = el("button", "", a);
      b.onclick = () => { form.avatar = a; avs.querySelectorAll("button").forEach((x) => x.classList.remove("on")); b.classList.add("on"); avPrev.textContent = a; };
      if (a === form.avatar) b.classList.add("on");
      avs.appendChild(b);
    });
    panel.appendChild(avs);
    const cols = el("div", "col-picker");
    COLORS.forEach((c) => {
      const b = el("button");
      b.style.background = c;
      b.onclick = () => { form.color = c; cols.querySelectorAll("button").forEach((x) => x.classList.remove("on")); b.classList.add("on"); avPrev.style.setProperty("--av-color", c); };
      if (c === form.color) b.classList.add("on");
      cols.appendChild(b);
    });
    panel.appendChild(cols);
    const fm = el("form", "login-form");
    fm.innerHTML = `
      <input class="lg-input" name="name" placeholder="Full Name" autocomplete="off"/>
      <input class="lg-input" name="password" type="password" placeholder="Password (optional)"/>
      <div class="login-actions">
        ${!first ? `<button type="button" class="btn cancel">Cancel</button>` : ""}
        <button type="submit" class="btn btn-primary">${first ? "Create & Sign In" : "Create"}</button>
      </div>`;
    const cerr = el("div", "login-err");
    panel.appendChild(fm);
    panel.appendChild(cerr);
    fm.onsubmit = (e) => {
      e.preventDefault();
      const name = fm.elements.namedItem("name").value.trim();
      if (!name) { cerr.textContent = "Please enter a name"; panel.style.animation = "none"; void panel.offsetWidth; panel.style.animation = "shake .45s"; return; }
      try {
        const u = Users.create({ name, password: fm.elements.namedItem("password").value, avatar: form.avatar, color: form.color });
        enter(u);
      } catch (ex) {
        cerr.textContent = "Could not create the profile";
      }
    };
    const cancel = $(".cancel", fm);
    if (cancel) cancel.onclick = () => { users._creating = false; paint(); };
    formWrap.appendChild(panel);
    setTimeout(() => $("input", fm).focus(), 60);
  }

  // power buttons
  const power = $(".login-power", scr);
  $$(".login-power button", scr)[0].onclick = () => { scr.classList.add("leaving"); setTimeout(() => { setPhase("boot"); startBoot(); }, 350); };
  $$(".login-power button", scr)[1].onclick = () => { scr.classList.add("leaving"); setTimeout(() => shutdown(), 350); };
}

/* ── window rendering ────────────────────────────────────────────── */
function rerenderWindows() {
  const layer = $("#winlayer");
  if (!layer) return;
  const active = OS.activeId;
  for (const w of OS.windows) {
    let node = $("#win-" + w.id, layer);
    if (!node) {
      node = createWindowNode(w, layer);
      w._viewNonce = w.props.nonce;
    } else if (w.view && w.view.update && w._viewNonce !== w.props.nonce) {
      // window re-opened / re-seeded (dock click, Spotlight, Alt+Space,
      // Fern seed text…) — hand the new props to the live app view
      w._viewNonce = w.props.nonce;
      try { w.view.update(w.props); } catch (e) { console.warn("view update failed:", e); }
    }
    node.className = `window ${w.maximized ? "is-full" : ""} ${w.id === active ? "" : "inactive"} ${w.anim ? "win-anim" : ""} ${w.closing ? "win-close" : node._opened ? "" : "win-open"}`;
    node.style.left = w.x + "px";
    node.style.top = w.y + "px";
    node.style.width = w.w + "px";
    node.style.height = w.h + "px";
    node.style.zIndex = w.z;
    node.style.display = w.minimized ? "none" : "flex";
  }
  // remove gone
  $$(".window", layer).forEach((n) => {
    const id = n.id.slice(4);
    if (!OS.windows.find((w) => w.id === id)) n.remove();
  });
  // The dock is hidden while the active window is full-screen.
  const desktop = $("#desktop");
  if (desktop) desktop.classList.toggle("has-fullscreen", !!OS.windows.find(w => w.id === active && w.maximized && !w.minimized && !w.closing));
  renderDock();
  if (!menubarOpen) renderMenubar();
}

function createWindowNode(w, layer) {
  const node = el("div");
  node.id = "win-" + w.id;
  node._opened = false;
  node.addEventListener("animationend", (e) => {
    if (e.target === node) node._opened = true;
    node.classList.remove("win-open");
  });
  const meta = APPS[w.app];

  // traffic lights
  const tl = el("div", "tl");
  const dot = (color, label, fn, glyph) => {
    const d = el("button", "tl-dot");
    d.style.background = color;
    d.setAttribute("aria-label", label);
    d.innerHTML = `<span class="g">${glyph}</span>`;
    d.onclick = (e) => { e.stopPropagation(); fn(); };
    return d;
  };
  tl.appendChild(dot("#ff5f57", "Close", () => closeWindow(w.id), "✕"));
  tl.appendChild(dot("#febc2e", "Minimize", () => minimizeWindow(w.id), "−"));
  tl.appendChild(dot("#28c840", "Enter or exit full screen", () => toggleMaximize(w.id), "⤢"));
  node.appendChild(tl);

  // non-unified titlebar (terminal)
  if (w.app === "terminal") {
    const tb = el("div", "app-titlebar");
    tb.dataset.drag = "1";
    tb.textContent = w.title;
    node.appendChild(tb);
  }

  const body = el("div", "win-body");
  node.appendChild(body);
  const shield = el("div", "win-inactive-shield");
  body.appendChild(shield);
  shield.style.display = "none";
  node._shield = shield;
  node._body = body;

  // resize handles
  const dirs = ["n", "s", "e", "w", "ne", "nw", "se", "sw"];
  for (const d of dirs) {
    const hnd = el("div", "rz rz-" + d);
    hnd.onpointerdown = (e) => startResize(e, node, w, d);
    node.appendChild(hnd);
  }

  node.onpointerdown = (e) => {
    if (!w.closing && OS.activeId !== w.id) focusWindow(w.id);
    if (w.closing) return;
    const t = e.target;
    if (t.closest(".rz")) return;
    startDrag(e, node, w);
  };
  node.ondblclick = (e) => {
    const t = e.target;
    if (t.closest("[data-drag]") && !t.closest("button,input,textarea,select,a")) toggleMaximize(w.id);
  };

  // mount app view
  try {
    const view = AppViews[w.app];
    if (view) w.view = view({ win: w, body });
  } catch (e) {
    console.error("app crashed on mount:", w.app, e);
    body.innerHTML = `<div class="empty-state"><div class="big">This app hit a snag</div><div class="center-note">${esc(String(e && e.message || e))}</div></div>`;
  }

  layer.appendChild(node);
  w.elm = node;
  // inactive shield toggling (subscription removed on close)
  w._offActive = bus.on("active", () => { shield.style.display = OS.activeId === w.id ? "none" : ""; });
  shield.style.display = OS.activeId === w.id ? "none" : "";
  return node;
}

function startDrag(e, node, w) {
  if (e.button !== 0 || w.maximized) return;
  const t = e.target;
  const handle = t.closest("[data-drag]");
  if (!handle || t.closest("button,input,textarea,select,a,[data-nodrag]")) return;
  const sx = e.clientX, sy = e.clientY;
  const ox = node.offsetLeft, oy = node.offsetTop;
  let moved = false;
  try { handle.setPointerCapture(e.pointerId); } catch {}
  const move = (ev) => {
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (!moved && Math.abs(dx) + Math.abs(dy) < 3) return;
    moved = true;
    node.style.left = ox + dx + "px";
    node.style.top = Math.max(MENUBAR_H - 4, oy + dy) + "px";
  };
  const up = (ev) => {
    handle.removeEventListener("pointermove", move);
    handle.removeEventListener("pointerup", up);
    handle.removeEventListener("pointercancel", up);
    try { handle.releasePointerCapture(ev.pointerId); } catch {}
    if (moved) setGeometry(w.id, { x: node.offsetLeft, y: node.offsetTop });
  };
  handle.addEventListener("pointermove", move);
  handle.addEventListener("pointerup", up);
  handle.addEventListener("pointercancel", up);
}

function startResize(e, node, w, d) {
  e.stopPropagation();
  e.preventDefault();
  const sx = e.clientX, sy = e.clientY;
  const o = { x: node.offsetLeft, y: node.offsetTop, w: node.offsetWidth, h: node.offsetHeight };
  const meta = APPS[w.app];
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
  const move = (ev) => {
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    let { x, y, w: ww, h: hh } = o;
    if (d.includes("e")) ww = Math.max(meta.minW, o.w + dx);
    if (d.includes("s")) hh = Math.max(meta.minH, o.h + dy);
    if (d.includes("w")) { ww = Math.max(meta.minW, o.w - dx); x = o.x + (o.w - ww); }
    if (d.includes("n")) { hh = Math.max(meta.minH, o.h - dy); y = Math.max(MENUBAR_H - 4, o.y + (o.h - hh)); hh = o.y + o.h - y; }
    node.style.left = x + "px"; node.style.top = y + "px";
    node.style.width = ww + "px"; node.style.height = hh + "px";
  };
  const up = (ev) => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("pointercancel", up);
    setGeometry(w.id, { x: node.offsetLeft, y: node.offsetTop, w: node.offsetWidth, h: node.offsetHeight });
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);
}

/* ── dock ────────────────────────────────────────────────────────── */
let dockApply = null;
function renderDock() {
  const dock = $("#dock");
  if (!dock) return;
  const base = OS.settings.dockSize;
  dock.style.height = base + 18 + "px";
  const entries = [...DOCK_ORDER, "trash"];
  const running = (id) => OS.windows.some((w) => w.app === id && !w.closing);
  dock.innerHTML = "";
  const items = {};
  for (const id of entries) {
    const isTrash = id === "trash";
    if (isTrash) dock.appendChild(el("div", "dock-sep"));
    const item = el("div", "dock-item" + (OS.launching === id && !isTrash && !running(id) ? " bouncing" : ""));
    item.dataset.dockApp = id;
    item.style.width = item.style.height = base + "px";
    const name = isTrash ? "Trash" : APPS[id].name;
    item.innerHTML = `<span class="tip glass-panel">${esc(name)}</span>`;
    const ic = el("div", "dock-ic");
    ic.innerHTML = appIconSVG(id, isTrash ? "trash" : null);
    item.appendChild(ic);
    if (!isTrash && running(id)) item.appendChild(el("span", "dock-dot"));
    item.onclick = () => {
      if (isTrash) openApp("finder", { path: "trash" });
      else openApp(id);
    };
    dock.appendChild(item);
    items[id] = item;
  }
  // magnification
  const centers = {};
  const measure = () => {
    for (const k of entries) {
      const r = items[k].getBoundingClientRect();
      centers[k] = r.left + r.width / 2;
    }
  };
  dockApply = (x) => {
    for (const k of entries) {
      const n = items[k];
      if (!n) continue;
      let s = 1;
      if (x != null && OS.settings.magnify) {
        const d = Math.abs(x - (centers[k] ?? x));
        s = 1 + (OS.settings.magnifyAmount - 1) * Math.exp(-Math.pow(d / (base * 1.25), 2));
      }
      n.style.transition = x == null ? "width .3s cubic-bezier(.2,.9,.3,1), height .3s cubic-bezier(.2,.9,.3,1)" : "width .06s linear, height .06s linear";
      n.style.width = n.style.height = base * s + "px";
    }
  };
  dock.onmouseenter = measure;
  dock.onmousemove = (e) => {
    const x = e.clientX;
    requestAnimationFrame(() => dockApply && dockApply(x));
  };
  dock.onmouseleave = () => dockApply && dockApply(null);
}

/* ── spotlight ───────────────────────────────────────────────────── */
let spotState = null;
function toggleSpotlight(force) {
  const want = force !== undefined ? force : !OS.spotlight;
  if (want === OS.spotlight) return;
  OS.spotlight = want;
  const root = $("#spotroot");
  if (!root) return;
  if (!want) { root.innerHTML = ""; return; }
  const node = el("div");
  node.id = "spot";
  node.innerHTML = `
    <div class="spot-panel glass glass-panel">
      <div class="spot-row1">
        <svg width="22" height="22" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".6"><circle cx="7" cy="7" r="4.8"/><path d="M10.6 10.6L14 14"/></svg>
        <input placeholder="Spotlight Search" aria-label="Spotlight Search"/>
      </div>
      <div class="spot-list"></div>
    </div>`;
  node.onmousedown = (e) => { if (e.target === node) toggleSpotlight(false); };
  root.appendChild(node);
  const input = $("input", node);
  const list = $(".spot-list", node);
  let sel = 0;
  setTimeout(() => input.focus(), 30);

  const math = (q) => {
    if (!/^[\d\s+\-*/().%^]+$/.test(q) || !/[+\-*/%^]/.test(q.replace(/^\s*-/, ""))) return null;
    try {
      const v = Function(`"use strict";return (${q.replace(/\^/g, "**")})`)();
      return typeof v === "number" && isFinite(v) ? String(Math.round(v * 1e8) / 1e8) : null;
    } catch { return null; }
  };

  function rows(q) {
    const t = q.trim();
    const out = [];
    if (!t) {
      return DOCK_ORDER.filter((a) => a !== "fern").slice(0, 6).map((a) => ({
        key: a,
        icon: `<span style="width:30px;height:30px;display:block">${appIconSVG(a)}</span>`,
        title: APPS[a].name, sub: "Application",
        run: () => openApp(a),
      }));
    }
    const m = math(t);
    if (m) out.push({ key: "math", icon: `<span class="spot-ic" style="background:#f97316">=</span>`, title: m, sub: t + " =", run: () => { try { navigator.clipboard.writeText(m); } catch {} } });
    const low = t.toLowerCase();
    if (OS.user) {
      for (const n of Notes.all(OS.user.id).filter(n => (n.title + " " + n.body).toLowerCase().includes(low)).slice(0, 4)) {
        out.push({ key:"note-"+n.id, icon:`<span class="spot-ic" style="background:#d5a91c">${icon("note", 16)}</span>`, title:n.title || "New Note", sub:"Note", run:() => openApp("notes", {noteId:n.id}) });
      }
    }
    for (const a of Object.keys(APPS)) {
      if (APPS[a].name.toLowerCase().includes(low)) out.push({ key: "app-" + a, icon: `<span style="width:30px;height:30px;display:block">${appIconSVG(a)}</span>`, title: APPS[a].name, sub: "Application", run: () => openApp(a) });
    }
    out.push({ key: "fern", icon: makeOrb(30, "idle").outerHTML, title: `Ask Fern: “${t}”`, sub: "Assistant", run: () => openFern(t) });
    out.push({ key: "web", icon: `<span class="spot-ic" style="background:#0ea5e9">${icon("search", 16)}</span>`, title: `Search the web for “${t}”`, sub: "Canopy Browser", run: () => openApp("browser", { q: t, newTab: true }) });
    out.push({ key: "yt", icon: `<span class="spot-ic" style="background:#dc2626">${icon("play", 15)}</span>`, title: `Search YouTube for “${t}”`, sub: "Canopy Browser", run: () => openApp("browser", { yt: t, newTab: true }) });
    return out;
  }

  function paint() {
    const rs = rows(input.value);
    sel = clamp(sel, 0, rs.length - 1);
    list.innerHTML = !input.value.trim() ? `<div class="spot-cap">Suggestions</div>` : "";
    rs.forEach((r, i) => {
      const b = el("button", "spot-item" + (i === sel ? " sel" : ""));
      b.innerHTML = `${r.icon}<span style="min-width:0;flex:1"><span class="tt">${esc(r.title)}</span>${r.sub ? `<span class="sb">${esc(r.sub)}</span>` : ""}</span>${i === sel ? `<span class="ret">↩</span>` : ""}`;
      b.onmouseenter = () => { sel = i; paint(); };
      b.onclick = () => { toggleSpotlight(false); r.run(); };
      list.appendChild(b);
    });
    spotState = { rows: rs, input };
    input.onkeydown = (e) => {
      if (e.key === "Escape") { e.stopPropagation(); toggleSpotlight(false); }
      else if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(rs.length - 1, sel + 1); paint(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, sel - 1); paint(); }
      else if (e.key === "Enter") { const r = rs[sel]; toggleSpotlight(false); if (r) r.run(); }
    };
  }
  input.oninput = () => { sel = 0; paint(); };
  paint();
}
function closeSpotlight() { toggleSpotlight(false); }
