<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CanopyOS Aurora</title>
<meta name="description" content="CanopyOS Aurora — a full desktop operating system experience that runs right in your browser.">
<script src="vendor/holidays.min.js"></script>
<style>
/* Desktop workspace enhancements */
#winlayer { position:absolute; inset:0; z-index:20; pointer-events:none; }
#winlayer .window { pointer-events:auto; }
.window.is-full { border-radius:0; }
.window.is-full .rz { display:none; }
#desktop.has-fullscreen #dock { opacity:0; pointer-events:none; }
#desktop.has-fullscreen #wgts { visibility:hidden; }
#launcher, #notification-center { position:fixed; z-index:95; }
#launcher { inset:30px 0 0; padding:42px 20px; background:rgba(15,22,29,.75); backdrop-filter:blur(28px); overflow:auto; color:white; }
.launch-wrap { max-width:850px; margin:auto; }
.launch-head { display:flex; align-items:center; gap:12px; margin-bottom:30px; }
.launch-head h1 { font-size:28px; margin:0; flex:1; }
.launch-head input { max-width:300px; }
.launch-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:24px; }
.launch-app { display:flex; align-items:center; flex-direction:column; gap:8px; color:white; font-size:13px; }
.launch-app span:first-child { width:72px; height:72px; transition:transform .16s; }
.launch-app:hover span:first-child { transform:scale(1.08); }
#notification-center { top:38px; right:12px; width:min(350px,calc(100vw - 24px)); max-height:calc(100vh - 55px); overflow:auto; border-radius:20px; padding:18px; }
.nc-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.nc-head strong { font-size:17px; }
.nc-item { padding:12px; border-radius:12px; background:var(--field); margin-top:8px; }
.nc-item small { color:var(--fg2); }
.nc-item p { margin:4px 0; }
.reminder-layout { display:flex; position:absolute; inset:0; }
.reminder-sidebar { width:205px; flex:none; padding:54px 12px 16px; background:var(--side); border-right:1px solid var(--line); }
.reminder-main { flex:1; min-width:0; display:flex; flex-direction:column; }
.reminder-head { padding:14px 20px; min-height:50px; border-bottom:1px solid var(--line); font-size:16px; font-weight:600; }
.reminder-content { overflow:auto; padding:24px; flex:1; }
.reminder-content h1 { font-size:28px; margin:0 0 6px; }
.reminder-sub { color:var(--fg2); margin-bottom:20px; }
.reminder-form { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
.reminder-form input[type=text] { flex:1; min-width:150px; }
.reminder-row { display:flex; gap:12px; align-items:center; border-bottom:1px solid var(--line); padding:13px 2px; }
.reminder-row input[type=checkbox] { width:19px; height:19px; accent-color:var(--accent); }
.reminder-row .rt { flex:1; min-width:0; }
.reminder-row .rt span { display:block; overflow-wrap:anywhere; }
.reminder-row small { color:var(--fg2); }
.reminder-row.done .rt span { text-decoration:line-through; color:var(--fg2); }
.monitor-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:18px 0; }
.monitor-card { padding:18px; background:var(--field); border-radius:14px; }
.monitor-card strong { display:block; font-size:21px; margin-top:7px; }
.monitor-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
@media(max-width:600px) { .reminder-sidebar { width:120px; padding-left:5px; padding-right:5px; } .reminder-content { padding:16px; } #dock { max-width:98vw; overflow-x:auto; } .mb-left .mb-btn { padding-left:5px; padding-right:5px; } }

/* Living wallpapers and atmospheric weather. */
#bg-wall.live { background-size: 140% 140% !important; animation: livingSky 28s ease-in-out infinite alternate; }
#bg-wall.live::after { content:""; position:absolute; inset:0; pointer-events:none; opacity:.34; background:radial-gradient(ellipse at 28% 18%,#ffffff40,transparent 35%), radial-gradient(ellipse at 80% 76%,#a7f3d030,transparent 40%); animation:cloudDrift 18s ease-in-out infinite alternate; }
#bg-wall.weather-rain::after { opacity:.6; background:repeating-linear-gradient(105deg,transparent 0 31px,#d5eaff70 32px 33px,transparent 34px 55px); background-size:180px 180px; animation:rainfall .8s linear infinite; }
#bg-wall.weather-snow::after { opacity:.7; background-image:radial-gradient(circle,#fff 1.5px,transparent 2px),radial-gradient(circle,#fff 2px,transparent 2.5px); background-size:80px 100px,130px 150px; animation: snowfall 5s linear infinite; }
@keyframes livingSky { from { background-position: 10% 30%; } to { background-position: 90% 70%; } }
@keyframes cloudDrift { from { transform:translateX(-4%) scale(1.1); } to { transform:translateX(4%) scale(1.1); } }
@keyframes rainfall { to { background-position:-45px 180px; } }
@keyframes snowfall { to { background-position:30px 150px, -25px 150px; } }
.weather::before { content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at 20% 22%,#ffffff40,transparent 32%),radial-gradient(ellipse at 80% 12%,#ffffff30,transparent 30%); animation: cloudDrift 15s ease-in-out infinite alternate; }
.weather.rainy::after { content:""; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(105deg,transparent 0 31px,#d5eaff55 32px 33px,transparent 34px 55px); background-size:180px 180px; animation:rainfall .8s linear infinite; }
.weather-head,.weather-scroll { position:relative; z-index:1; }
.fern-expand { position:absolute; right:15px; top:11px; z-index:50; color:#fff; padding:5px; border-radius:8px; background:#ffffff18; }
.fern-expand:hover { background:#ffffff33; }
.holiday-settings { margin: 8px 0 12px; }
.holiday-settings select { width:100%; margin-top:5px; }
.holiday-selected { font-size:11px; line-height:1.6; color:var(--fg2); margin-top:5px; }
.holiday-selected button { color:var(--accent); margin-right:7px; }
@media (prefers-reduced-motion: reduce) { #bg-wall.live, #bg-wall.live::after, .weather::before, .weather::after { animation:none !important; } }

/* ════════════════════════════════════════════════════════════════════
   CanopyOS Aurora — handcrafted stylesheet (single-file build)
   Visual language: liquid glass, soft depth, calm Apple-like palette.
   ════════════════════════════════════════════════════════════════════ */

:root {
  --accent: #0a84ff;
  --fg: #1d1d1f;
  --fg2: rgba(0, 0, 0, 0.55);
  --win: #ffffff;
  --win2: #f3f3f6;
  --side: rgba(238, 238, 244, 0.82);
  --line: rgba(0, 0, 0, 0.1);
  --field: rgba(0, 0, 0, 0.055);
  --menubar: rgba(255, 255, 255, 0.28);
  --shadow-win: 0 24px 70px rgba(0, 0, 0, 0.30), 0 6px 18px rgba(0, 0, 0, 0.18);
  color-scheme: light;
}
[data-theme="dark"] {
  --fg: #f5f5f7;
  --fg2: rgba(255, 255, 255, 0.58);
  --win: #1e1e21;
  --win2: #29292d;
  --side: rgba(44, 44, 50, 0.82);
  --line: rgba(255, 255, 255, 0.1);
  --field: rgba(255, 255, 255, 0.09);
  --menubar: rgba(20, 20, 24, 0.32);
  color-scheme: dark;
}

* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html, body {
  height: 100%; margin: 0; overflow: hidden; background: #000;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
  font-size: 14px; color: var(--fg);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overscroll-behavior: none;
}
body { user-select: none; -webkit-user-select: none; cursor: default; }
.selectable { user-select: text; -webkit-user-select: text; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
input, textarea, select { font: inherit; color: inherit; }
svg { display: block; }
.mono { font-family: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }

/* thin scrollbars */
.thin-scroll { scrollbar-width: thin; scrollbar-color: rgba(128,128,128,.4) transparent; }
.thin-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
.thin-scroll::-webkit-scrollbar-thumb { background: rgba(128,128,128,.4); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
.no-scroll { scrollbar-width: none; }
.no-scroll::-webkit-scrollbar { display: none; }

/* ── Liquid glass ─────────────────────────────────────────────────── */
.glass {
  background: linear-gradient(135deg, rgba(255,255,255,.30), rgba(255,255,255,.06) 55%, rgba(255,255,255,.14)), rgba(255,255,255,.055);
  -webkit-backdrop-filter: blur(26px) saturate(170%) brightness(1.05);
  backdrop-filter: blur(26px) saturate(170%) brightness(1.05);
  border: 1px solid rgba(255,255,255,.24);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.10),
    0 14px 40px rgba(0,0,0,.26), 0 2px 6px rgba(0,0,0,.12);
  color: #fff;
}
.glass-dark {
  background: linear-gradient(135deg, rgba(255,255,255,.13), rgba(255,255,255,.02) 55%, rgba(255,255,255,.07)), rgba(18,18,24,.40);
  border-color: rgba(255,255,255,.14);
}
.glass-panel {
  background: linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,.25)), rgba(245,245,250,.35);
  color: #1d1d1f;
}
[data-theme="dark"] .glass-panel {
  background: linear-gradient(135deg, rgba(255,255,255,.15), rgba(255,255,255,.04)), rgba(24,24,30,.62);
  color: #f5f5f7;
}
[data-theme="dark"] .glass { background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.02) 55%, rgba(255,255,255,.08)), rgba(18,18,24,.40); border-color: rgba(255,255,255,.15); }
.glass-sheen { position: relative; overflow: hidden; }
.glass-sheen::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.22) 48%, transparent 66%);
  background-size: 250% 100%; background-position: 130% 0; opacity: 0;
  animation: sheen 7s ease-in-out infinite;
}

/* ── Controls ─────────────────────────────────────────────────────── */
.field {
  height: 28px; border-radius: 8px; background: var(--field); border: 0; outline: none;
  padding: 0 10px; font-size: 13px; width: 100%;
}
.field:focus { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent); }
textarea.field { height: auto; padding: 8px 10px; resize: none; }
.btn {
  border-radius: 8px; padding: 5px 12px; background: var(--field); font-size: 13px;
  transition: background .15s, transform .1s; white-space: nowrap;
}
.btn:hover { background: rgba(128,128,128,.22); }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent); filter: brightness(1.1); }
.btn-danger { background: #ff453a; color: #fff; }
.btn-danger:hover { background: #ff453a; filter: brightness(1.1); }
.switch {
  width: 40px; height: 24px; border-radius: 20px; background: rgba(128,128,128,.4);
  position: relative; transition: background .25s; flex: none; display: inline-block;
}
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35);
  transition: transform .25s cubic-bezier(.3,1.4,.5,1);
}
.switch[data-on="true"] { background: var(--accent); }
.switch[data-on="true"]::after { transform: translateX(16px); }
input[type="range"] {
  -webkit-appearance: none; appearance: none; height: 6px; border-radius: 6px;
  background: rgba(128,128,128,.35); outline: none; width: 100%;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); cursor: default;
}
.menu-item { display: block; width: 100%; text-align: left; border-radius: 6px; padding: 3px 10px; }
.menu-item:hover { background: var(--accent); color: #fff; }
.menu-item:disabled { opacity: .4; }
.menu-item:disabled:hover { background: none; color: inherit; }

/* ── Screens ──────────────────────────────────────────────────────── */
.screen { position: fixed; inset: 0; }
#bg-wall {
  position: absolute; inset: 0; background-size: cover; background-position: center;
  transition: filter 1s ease, transform 1.2s cubic-bezier(.2,.8,.2,1);
}
#bg-wall.blurred { filter: blur(28px) brightness(.65) saturate(1.2); transform: scale(1.12); }

/* boot */
#boot { z-index: 60; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.boot-glow {
  position: absolute; left: 50%; top: 50%; width: 520px; height: 520px; margin: -260px 0 0 -260px;
  border-radius: 50%; background: radial-gradient(circle, rgba(52,211,153,.18), transparent 65%);
  animation: breathe 3s ease-in-out infinite; pointer-events: none;
}
.boot-title { margin-top: 24px; text-align: center; animation: fadeIn 1.2s .6s both; }
.boot-title .t1 { font-size: 26px; font-weight: 600; letter-spacing: .18em; color: #fff; }
.boot-title .t2 { margin-top: 4px; font-size: 12px; letter-spacing: .5em; color: rgba(110,231,183,.7); }
.boot-bar { margin-top: 56px; height: 4px; width: 210px; border-radius: 99px; background: rgba(255,255,255,.15); overflow: hidden; animation: fadeIn .6s 1s both; }
.boot-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #6ee7b7, #7dd3fc, #c4b5fd); animation: bootFill 3.7s cubic-bezier(.45,.05,.3,1) .2s both; }
.boot-msg { margin-top: 16px; height: 16px; font-size: 11px; letter-spacing: .04em; color: rgba(255,255,255,.45); animation: fadeIn .4s both; }
#boot.leaving { opacity: 0; transition: opacity .6s ease; }

/* hello — macOS-style welcome, word written as one pen stroke */
#hello {
  z-index: 70; background: #000; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: opacity .8s ease;
}
#hello::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 72vw; height: 52vh; max-width: 900px;
  transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, rgba(120,130,160,.13), transparent 75%);
}
#hello.leaving { opacity: 0; }
#hello svg { width: min(620px, 74vw); overflow: visible; position: relative; }
#hello .stroke {
  fill: none; stroke: #f5f5f7; stroke-width: 13; stroke-linecap: round; stroke-linejoin: round;
}
#hello.lit .stroke {
  animation: helloBloom 1.15s ease both;
}
#hello-hint { position: absolute; bottom: 34px; font-size: 11px; letter-spacing: .28em; color: rgba(255,255,255,.24); animation: fadeIn 1.4s 1.2s both; }

/* login */
#login {
  z-index: 50; display: flex; flex-direction: column; align-items: center; color: #fff;
  transition: opacity .5s ease, transform .5s ease, filter .5s ease;
}
#login.leaving { opacity: 0; transform: scale(1.06); filter: blur(10px); pointer-events: none; }
.login-clock { margin-top: 7vh; text-align: center; text-shadow: 0 2px 30px rgba(0,0,0,.35); }
.login-clock .d { font-size: 22px; font-weight: 500; opacity: .9; }
.login-clock .t { font-size: 104px; font-weight: 600; line-height: 1; letter-spacing: -.01em; }
.login-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 96px; }
.avatar {
  display: flex; align-items: center; justify-content: center; border-radius: 50%;
  box-shadow: inset 0 1px 1px rgba(255,255,255,.7), 0 8px 30px rgba(0,0,0,.35);
  background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.4), transparent 55%), var(--av-color, #34d399);
}
.login-users { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: center; gap: 32px; }
.login-user { display: flex; flex-direction: column; align-items: center; gap: 12px; transition: transform .3s; }
.login-user:hover { transform: scale(1.1); }
.login-user .nm { font-size: 15px; font-weight: 500; text-shadow: 0 1px 8px rgba(0,0,0,.4); }
.login-add { display: flex; align-items: center; justify-content: center; width: 84px; height: 84px; border-radius: 50%; font-size: 40px; font-weight: 300; }
.login-sub { margin-top: 32px; font-size: 13.5px; color: rgba(255,255,255,.7); }
.pw-row { margin-top: 20px; display: flex; align-items: center; }
.pw-pill { display: flex; align-items: center; width: 250px; height: 40px; border-radius: 99px; padding: 0 16px; }
.pw-pill input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 15px; color: #fff; }
.pw-pill input::placeholder { color: rgba(255,255,255,.6); }
.pw-go { margin-left: 8px; width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.25); font-size: 13px; display: flex; align-items: center; justify-content: center; }
.pw-go:hover { background: rgba(255,255,255,.4); }
.login-err { margin-top: 12px; height: 20px; font-size: 13.5px; color: #fca5a5; }
.login-other { margin-top: 8px; font-size: 13.5px; color: rgba(255,255,255,.7); }
.login-other:hover { color: #fff; }
.login-panel { width: 400px; border-radius: 24px; padding: 28px; }
.login-panel .ttl { text-align: center; }
.login-panel .ttl .a1 { font-size: 20px; font-weight: 600; margin-top: 12px; }
.login-panel .ttl .a2 { font-size: 12px; color: rgba(255,255,255,.6); }
.av-picker { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 16px; }
.av-picker button { width: 36px; height: 36px; border-radius: 50%; font-size: 18px; transition: .15s; }
.av-picker button:hover { background: rgba(255,255,255,.2); }
.av-picker button.on { background: rgba(255,255,255,.35); transform: scale(1.1); }
.col-picker { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
.col-picker button { width: 24px; height: 24px; border-radius: 50%; transition: .15s; }
.col-picker button.on { transform: scale(1.25); box-shadow: 0 0 0 2px #fff; }
.login-form { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.lg-input { height: 40px; border-radius: 12px; background: rgba(255,255,255,.15); border: 0; outline: none; padding: 0 16px; font-size: 15px; color: #fff; width: 100%; }
.lg-input::placeholder { color: rgba(255,255,255,.55); }
.lg-input:focus { background: rgba(255,255,255,.25); }
.login-actions { display: flex; gap: 10px; }
.login-actions .btn { flex: 1; height: 40px; border-radius: 12px; color: #fff; background: rgba(255,255,255,.15); }
.login-actions .btn:hover { background: rgba(255,255,255,.25); }
.login-actions .btn-primary { background: #0a84ff; }
.login-power { position: absolute; bottom: 28px; display: flex; gap: 40px; font-size: 12px; color: rgba(255,255,255,.85); }
.login-power button { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.login-power .ic { width: 44px; height: 44px; border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; }
.login-brand { position: absolute; bottom: 12px; font-size: 10px; letter-spacing: .2em; color: rgba(255,255,255,.4); }
.spin { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; animation: spin .8s linear infinite; }
.spin.dark { border-color: var(--field); border-top-color: var(--fg2); }

/* off */
#off { z-index: 60; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.off-btn {
  width: 80px; height: 80px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.7);
  display: flex; align-items: center; justify-content: center; transition: .2s;
}
.off-btn:hover { transform: scale(1.1); border-color: rgba(110,231,183,.6); color: #a7f3d0; }
.off-label { margin-top: 20px; font-size: 12px; letter-spacing: .3em; color: rgba(255,255,255,.35); }
.off-logo { position: absolute; bottom: 32px; opacity: .3; color: #fff; }

/* desktop */
#desktop { position: absolute; inset: 0; animation: zoomInDesktop 1s cubic-bezier(.2,.8,.2,1) both; }
#desk-hit { position: absolute; inset: 0; }
#ctxmenu {
  position: fixed; z-index: 90; width: 210px; border-radius: 12px; padding: 6px; font-size: 13px;
}
#dim { position: fixed; inset: 0; z-index: 99; background: #000; pointer-events: none; transition: opacity .2s; opacity: 0; }

/* menu bar */
#menubar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 80; height: 30px;
  display: flex; align-items: center; justify-content: space-between; padding: 0 8px;
  background: var(--menubar);
  -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  box-shadow: inset 0 -0.5px 0 rgba(255,255,255,.18);
  animation: menubarDrop .7s cubic-bezier(.2,.9,.2,1) both;
  font-size: 13px;
}
#menubar.light { color: #111; }
#menubar.light .mb-btn:hover { background: rgba(0,0,0,.08); }
#menubar.light .mb-btn.on { background: rgba(0,0,0,.14); }
#menubar.light .mb-ico:hover { background: rgba(0,0,0,.08); }
#menubar.light .mb-ico.on { background: rgba(0,0,0,.14); }
.mb-left, .mb-right { display: flex; align-items: center; }
.mb-right { gap: 2px; font-weight: 500; }
.mb-btn { border-radius: 6px; padding: 2px 10px; font-size: 13px; font-weight: 500; transition: background .12s; position: relative; }
.mb-btn:hover { background: rgba(255,255,255,.15); }
.mb-btn.on { background: rgba(255,255,255,.25); }
.mb-btn.bold { font-weight: 700; }
.mb-dd {
  position: absolute; left: 0; top: calc(100% + 4px); min-width: 230px; border-radius: 12px;
  padding: 6px; font-size: 13px; z-index: 90; text-align: left;
}
.mb-dd .sep { height: 1px; margin: 4px 8px; background: currentColor; opacity: .15; }
.mb-dd .row { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.mb-dd .sc { opacity: .5; margin-left: auto; }
.mb-batt { display: flex; align-items: center; gap: 4px; padding: 0 8px; font-size: 12px; }
.mb-batt .case { position: relative; display: inline-block; width: 20px; height: 10px; border-radius: 3px; border: 1px solid currentColor; opacity: .9; }
.mb-batt .lvl { position: absolute; inset: 1.5px; border-radius: 1.5px; background: currentColor; transform-origin: left; }
.mb-batt .nub { position: absolute; right: -3px; top: 2px; width: 2px; height: 4px; border-radius: 0 2px 2px 0; background: currentColor; }
.mb-clock { padding: 0 8px; }
.mb-clock .tm { margin-left: 6px; }
.mb-ico { padding: 2px 8px; border-radius: 6px; display: flex; align-items: center; }
.mb-ico:hover { background: rgba(255,255,255,.15); }
.mb-ico.on { background: rgba(255,255,255,.25); }

/* dropdown generic (menus, city search) */
.pop {
  border-radius: 12px; padding: 6px; font-size: 13px; z-index: 90;
  animation: popIn .16s ease both;
}

/* dock */
#dock {
  position: fixed; bottom: 10px; left: 50%; z-index: 82; transform: translateX(-50%);
  display: flex; align-items: flex-end; gap: 6px; padding: 0 10px 8px; border-radius: 26px;
  animation: dockRise .9s cubic-bezier(.2,.9,.2,1) .15s both;
}
.dock-item { position: relative; flex: none; }
.dock-item .tip {
  position: absolute; left: 50%; top: -40px; transform: translateX(-50%); white-space: nowrap;
  border-radius: 8px; padding: 4px 12px; font-size: 12.5px; font-weight: 500; opacity: 0;
  transition: opacity .15s; z-index: 10; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.25);
}
.dock-item:hover .tip { opacity: 1; }
.dock-ic { width: 100%; height: 100%; transition: transform .1s; }
.dock-ic:active { transform: scale(.9); filter: brightness(.75); }
.dock-item.bouncing .dock-ic { animation: bounce .55s ease 2; }
.dock-dot {
  position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
  width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,.9);
  box-shadow: 0 0 4px rgba(255,255,255,.9);
}
.dock-sep { width: 1px; height: 78%; align-self: center; margin: 0 4px 4px; background: rgba(255,255,255,.3); }

/* windows */
.window {
  position: absolute; border-radius: 14px; background: var(--win); color: var(--fg);
  box-shadow: 0 0 0 0.5px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.18), var(--shadow-win);
  overflow: hidden; display: flex; flex-direction: column; transform-origin: 50% 50%;
}
.window.inactive { box-shadow: 0 0 0 0.5px rgba(0,0,0,.3), 0 14px 40px rgba(0,0,0,.22), 0 3px 10px rgba(0,0,0,.14); }
.window.inactive .tl-dot { background: rgba(128,128,128,.45) !important; }
.window.win-anim { transition: left .42s cubic-bezier(.22,1,.36,1), top .42s cubic-bezier(.22,1,.36,1), width .42s cubic-bezier(.22,1,.36,1), height .42s cubic-bezier(.22,1,.36,1); }
.window.win-open { animation: winOpen .46s cubic-bezier(.18,1.1,.3,1) both; }
.window.win-close { animation: winClose .2s cubic-bezier(.4,0,1,1) both; pointer-events: none; }
.tl { position: absolute; left: 14px; top: 13px; z-index: 60; display: flex; gap: 8px; }
.tl-dot { width: 12px; height: 12px; border-radius: 50%; position: relative; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,.25), inset 0 1px 1px rgba(255,255,255,.35); }
.tl-dot .g { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 900; line-height: 1; color: rgba(0,0,0,.6); opacity: 0; transition: opacity .15s; }
.tl:hover .g { opacity: 1; }
.win-body { position: relative; flex: 1; min-height: 0; }
.win-inactive-shield { position: absolute; inset: 48px 0 0 0; z-index: 55; }
.rz { position: absolute; z-index: 70; }
.rz-n { left: 12px; right: 12px; top: 0; height: 5px; cursor: ns-resize; }
.rz-s { left: 12px; right: 12px; bottom: 0; height: 5px; cursor: ns-resize; }
.rz-e { top: 12px; bottom: 12px; right: 0; width: 5px; cursor: ew-resize; }
.rz-w { top: 12px; bottom: 12px; left: 0; width: 5px; cursor: ew-resize; }
.rz-ne { right: 0; top: 0; width: 12px; height: 12px; cursor: nesw-resize; }
.rz-nw { left: 0; top: 0; width: 12px; height: 12px; cursor: nwse-resize; }
.rz-se { right: 0; bottom: 0; width: 12px; height: 12px; cursor: nwse-resize; }
.rz-sw { left: 0; bottom: 0; width: 12px; height: 12px; cursor: nesw-resize; }
.app-titlebar {
  height: 38px; flex: none; display: flex; align-items: center; justify-content: center;
  border-bottom: 1px solid var(--line); background: var(--win2); font-size: 13px; font-weight: 600; color: var(--fg2);
  position: relative;
}
.app-flex { position: absolute; inset: 0; display: flex; }
.app-col { position: absolute; inset: 0; display: flex; flex-direction: column; }
.side {
  width: 190px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line);
  background: var(--side); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  padding-top: 44px;
}
.side.right { border-right: 0; border-left: 1px solid var(--line); }
.side-head { padding: 0 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); }
.side-item {
  display: flex; align-items: center; gap: 10px; border-radius: 8px; padding: 6px 10px;
  font-size: 13px; text-align: left; width: 100%; margin: 1px 0;
}
.side-item:hover { background: var(--field); }
.side-item.on { background: var(--accent); color: #fff; }
.side-item .cnt { margin-left: auto; font-size: 11px; opacity: .6; }
.side-item .ic { width: 20px; display: flex; justify-content: center; color: var(--accent); }
.side-item.on .ic { color: #fff; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.main-head {
  height: 48px; flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; border-bottom: 1px solid var(--line); font-size: 14.5px; font-weight: 600; gap: 12px;
}
.main-scroll { flex: 1; min-height: 0; overflow: auto; }
.empty-state { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--fg2); text-align: center; }
.empty-state .big { font-size: 15px; font-weight: 600; color: var(--fg); }
.empty-state .ic { opacity: .8; color: var(--fg2); }
.row-card { border-radius: 16px; background: var(--win2); padding: 0 16px; }
.row-line { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row-line:last-child { border-bottom: 0; }
.row-line .lb { font-size: 13.5px; font-weight: 500; }
.row-line .sub { margin-top: 2px; max-width: 360px; font-size: 12px; line-height: 1.4; color: var(--fg2); }
.hint-card { border-radius: 16px; background: var(--win2); padding: 16px; font-size: 12.5px; line-height: 1.55; color: var(--fg2); }
.hint-card code { border-radius: 4px; background: var(--field); padding: 1px 5px; font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 11.5px; }

/* toasts */
#toasts { position: fixed; right: 12px; z-index: 95; width: 330px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 12px; border-radius: 22px; padding: 12px; text-align: left; pointer-events: auto; animation: toastIn .5s cubic-bezier(.2,1,.3,1) both; }
.toast .t { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast .b { font-size: 12px; opacity: .7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast .aic { width: 36px; height: 36px; flex: none; }
.toast .aic.plain { border-radius: 8px; background: #34d399; }

/* spotlight */
#spot { position: fixed; inset: 0; z-index: 92; }
.spot-panel {
  position: absolute; left: 50%; top: 18vh; transform: translateX(-50%); width: min(660px, 92vw);
  border-radius: 24px; overflow: hidden; animation: popIn .22s cubic-bezier(.2,1,.3,1) both;
}
.spot-row1 { display: flex; align-items: center; gap: 12px; padding: 14px 20px; }
.spot-row1 input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 24px; font-weight: 300; }
.spot-row1 input::placeholder { opacity: .45; }
.spot-list { border-top: 1px solid rgba(128,128,128,.2); padding: 8px; }
.spot-cap { padding: 4px 12px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .5; }
.spot-item { display: flex; width: 100%; align-items: center; gap: 12px; border-radius: 12px; padding: 8px 12px; text-align: left; }
.spot-item.sel { background: var(--accent); color: #fff; }
.spot-item .tt { display: block; font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spot-item .sb { display: block; font-size: 12px; opacity: .6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spot-item .ret { margin-left: auto; font-size: 12px; opacity: .8; }
.spot-ic { width: 30px; height: 30px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #fff; }

/* control center */
#cc { position: fixed; right: 8px; z-index: 90; width: 320px; border-radius: 24px; padding: 12px; animation: popIn .22s cubic-bezier(.2,1,.3,1) both; }
.cc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cc-tile { display: flex; align-items: center; gap: 10px; border-radius: 16px; padding: 10px; text-align: left; background: rgba(128,128,128,.12); transition: background .15s; }
.cc-tile:hover { background: rgba(128,128,128,.2); }
.cc-tile .bulb { width: 36px; height: 36px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; background: rgba(128,128,128,.4); transition: background .2s; }
.cc-tile.on .bulb { background: var(--accent); }
.cc-tile .l1 { display: block; font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cc-tile .l2 { display: block; font-size: 11px; opacity: .6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cc-slider { margin-top: 8px; border-radius: 16px; background: rgba(128,128,128,.12); padding: 12px; }
.cc-slider .cap { font-size: 12px; font-weight: 600; margin-bottom: 6px; }
.cc-actions { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cc-act { display: flex; align-items: center; gap: 8px; border-radius: 16px; padding: 10px; background: rgba(128,128,128,.12); font-size: 12.5px; font-weight: 600; text-align: left; }
.cc-act:hover { background: rgba(128,128,128,.2); }
.cc-act .aic { width: 32px; height: 32px; flex: none; }

/* desktop widgets */
#wgts { position: absolute; right: 16px; display: flex; flex-direction: column; gap: 12px; width: 168px; animation: fadeIn 1s .6s both; }
.wgt { border-radius: 22px; padding: 14px; text-align: left; color: #fff; }
.wgt .wd { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #f87171; }
.wgt .dn { font-size: 44px; font-weight: 300; line-height: 1; }
.wgt .ev { margin-top: 6px; font-size: 11.5px; color: rgba(255,255,255,.7); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wgt .wrow { display: flex; align-items: flex-start; justify-content: space-between; }
.wgt .wn { font-size: 12px; font-weight: 600; }
.wgt .wt { font-size: 34px; font-weight: 300; line-height: 1.1; }
.wgt .wi { font-size: 26px; display: flex; }
.wgt .wl { font-size: 11.5px; color: rgba(255,255,255,.7); }

/* orb (Fern) */
.orb {
  position: relative; border-radius: 50%; background: #0b0b14; overflow: hidden; flex: none; display: block;
  box-shadow: 0 0 16px rgba(124,92,255,.38), inset 0 0 12px rgba(255,255,255,.22);
}
.orb i { position: absolute; width: 70%; height: 70%; border-radius: 50%; filter: blur(6px); mix-blend-mode: screen; animation: morph 5s ease-in-out infinite, drift 6s ease-in-out infinite; }
.orb[data-state="thinking"] i { animation-duration: 1.4s, 1.8s; }
.orb[data-state="listening"] i { animation-duration: 2.2s, 2.6s; }

/* ── Fern app window ──────────────────────────────────────────────── */
.fern-app {
  position: absolute; inset: 0; display: flex; flex-direction: column; color: #fff;
  background:
    radial-gradient(120% 90% at 85% -10%, rgba(56,189,248,.14), transparent 55%),
    radial-gradient(120% 90% at 0% 110%, rgba(124,92,255,.16), transparent 55%),
    linear-gradient(180deg, #17171d, #101014 60%, #0c0c10);
}
.fern-drag { position: absolute; top: 0; left: 0; right: 0; height: 46px; z-index: 40; }
.fern-title { position: absolute; top: 0; left: 0; right: 0; height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px; z-index: 30; pointer-events: none; }
.fern-title .nm { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.85); letter-spacing: .01em; }
.fern-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 56px 18px 10px; display: flex; flex-direction: column; gap: 12px; mask-image: linear-gradient(transparent, #000 26px); -webkit-mask-image: linear-gradient(transparent, #000 26px); }
.fern-user { align-self: flex-end; max-width: 82%; font-size: 15px; color: rgba(255,255,255,.65); text-align: right; animation: slideUp .35s both; }
.fern-bot { max-width: 94%; animation: slideUp .4s both; }
.fern-bot .txt { font-size: 19px; font-weight: 600; line-height: 1.35; letter-spacing: -.01em; text-shadow: 0 2px 20px rgba(0,0,0,.45); }
.fern-word { display: inline-block; animation: wordIn .45s ease both; }
.fern-card { margin-top: 10px; display: inline-flex; align-items: center; gap: 14px; min-width: 240px; max-width: 100%; border-radius: 22px; padding: 14px 18px; animation: popIn .5s .25s both; }
.fern-card .ce { width: 34px; height: 34px; flex: none; color: #a5b4fc; display: flex; align-items: center; justify-content: center; }
.fern-card .ct { font-size: 11px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: rgba(255,255,255,.6); }
.fern-card .cb { font-size: 26px; font-weight: 600; line-height: 1.15; }
.fern-card .cs { max-width: 320px; font-size: 12.5px; color: rgba(255,255,255,.75); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fern-chips { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
.fern-chip { border-radius: 99px; padding: 6px 14px; font-size: 13px; font-weight: 500; transition: transform .15s; animation: popIn .4s both; }
.fern-chip:hover { transform: scale(1.05); }
.fern-inputbar { margin: 10px 14px 6px; flex: none; display: flex; align-items: center; gap: 10px; height: 54px; border-radius: 99px; padding: 0 10px 0 12px; }
.fern-inputbar input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none; font-size: 16px; color: #fff; }
.fern-inputbar input::placeholder { color: rgba(255,255,255,.55); }
.fern-round { width: 38px; height: 38px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; transition: .15s; }
.fern-round.mic { background: rgba(255,255,255,.15); color: #fff; }
.fern-round.mic:hover { background: rgba(255,255,255,.25); }
.fern-round.mic.live { background: #fff; color: #000; }
.fern-round.send { background: #0a84ff; color: #fff; animation: popIn .25s both; }
.fern-status { display: flex; align-items: center; gap: 6px; padding: 4px 2px; }
.fern-status .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.8); animation: breathe .9s ease-in-out infinite; }
.fern-heard { font-size: 19px; font-weight: 500; color: rgba(255,255,255,.9); }
.fern-foot { flex: none; text-align: center; font-size: 11px; color: rgba(255,255,255,.45); padding: 0 0 8px; }
.vubar { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
.vubar span { width: 3px; height: 100%; border-radius: 2px; background: rgba(255,255,255,.9); animation: bar .7s ease-in-out infinite; }

/* ── Notes ────────────────────────────────────────────────────────── */
.notes-side { width: 250px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--side); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.notes-top { height: 48px; flex: none; display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 12px 6px; }
.notes-new { border-radius: 6px; padding: 4px 8px; font-size: 17px; line-height: 1; }
.notes-new:hover { background: var(--field); }
.note-item { display: block; width: 100%; text-align: left; border-radius: 10px; padding: 8px 12px; margin-bottom: 2px; }
.note-item:hover { background: var(--field); }
.note-item.on { background: #ffd60a; color: #000; }
.note-item .t1 { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-item .t2 { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg2); }
.note-item.on .t2 { color: rgba(0,0,0,.6); }
.notes-count { border-top: 1px solid var(--line); padding: 6px 0; text-align: center; font-size: 11px; color: var(--fg2); }
.note-editor { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.note-meta { height: 48px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 12px; color: var(--fg2); }
.note-meta .mbtns { display: flex; gap: 4px; }
.note-meta button { border-radius: 6px; padding: 4px 8px; }
.note-meta button:hover { background: var(--field); }
.note-paper { flex: 1; min-height: 0; overflow: auto; padding: 0 32px 24px; }
.note-title { width: 100%; background: none; border: 0; outline: none; font-size: 26px; font-weight: 700; }
.note-title::placeholder { opacity: .3; }
.note-body { margin-top: 8px; width: 100%; min-height: 200px; height: calc(100% - 52px); resize: none; background: none; border: 0; outline: none; font-size: 15px; line-height: 1.65; }
.note-body::placeholder { opacity: .3; }

/* ── Calculator ───────────────────────────────────────────────────── */
.calc { position: absolute; inset: 0; display: flex; flex-direction: column; background: #1c1c1e; color: #fff; padding: 0 12px 12px; outline: none; }
.calc-disp { flex: 1; display: flex; align-items: flex-end; justify-content: flex-end; overflow: hidden; padding: 0 8px 8px; font-weight: 300; letter-spacing: -.02em; }
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.calc-key { height: 58px; border-radius: 99px; font-size: 24px; transition: filter .1s, transform .05s; }
.calc-key:active { transform: scale(.95); }
.calc-key.op { background: #ff9f0a; color: #fff; }
.calc-key.op.active { background: #fff; color: #ff9f0a; }
.calc-key.top { background: #a5a5a5; color: #000; }
.calc-key.num { background: #333336; color: #fff; }
.calc-key.zero { grid-column: span 2; text-align: left; padding-left: 24px; }

/* ── Calendar ─────────────────────────────────────────────────────── */
.cal-head { height: 54px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 88px; }
.cal-title { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.cal-title .yr { font-weight: 300; color: var(--fg2); }
.cal-nav { display: flex; gap: 4px; }
.cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); }
.cal-dow div { padding: 6px 0; }
.cal-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 1fr); }
.cal-cell { display: flex; flex-direction: column; align-items: stretch; overflow: hidden; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px; text-align: left; min-height: 0; }
.cal-cell:hover { background: var(--field); }
.cal-cell.sel { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.cal-cell .dnum { margin: 0 0 2px auto; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 12.5px; }
.cal-cell .dnum.today { background: #ff3b30; color: #fff; font-weight: 600; }
.cal-cell .dnum.other { color: var(--fg2); opacity: .6; }
.cal-cell.sel .dnum:not(.today) { box-shadow: 0 0 0 2px var(--accent); }
.cal-ev { border-radius: 4px; padding: 0 4px; margin-bottom: 2px; font-size: 10.5px; font-weight: 500; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-more { font-size: 10px; color: var(--fg2); }
.cal-side { width: 240px; flex: none; border-left: 1px solid var(--line); background: var(--side); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); padding: 48px 16px 16px; display: flex; flex-direction: column; }
.cal-side .cap { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); }
.cal-side .sel-date { margin-bottom: 12px; font-size: 17px; font-weight: 600; }
.cal-ev-list { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
.cal-ev-item { display: flex; align-items: center; gap: 8px; border-radius: 8px; background: var(--field); padding: 6px 10px; font-size: 13px; }
.cal-ev-item .bar { width: 4px; height: 20px; border-radius: 99px; flex: none; }
.cal-ev-item .x { opacity: 0; }
.cal-ev-item:hover .x { opacity: .7; }
.cal-add { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.cal-colors { display: flex; gap: 6px; }
.cal-colors button { width: 16px; height: 16px; border-radius: 50%; }
.cal-colors button.on { box-shadow: 0 0 0 2px rgba(255,255,255,.8), 0 0 0 3px rgba(0,0,0,.2); }

/* ── Clock ────────────────────────────────────────────────────────── */
.clock-tabs-wrap { height: 52px; flex: none; display: flex; align-items: center; justify-content: center; padding-left: 64px; }
.clock-tabs { display: flex; border-radius: 10px; background: var(--field); padding: 2px; font-size: 13px; }
.clock-tabs button { border-radius: 8px; padding: 4px 16px; text-transform: capitalize; color: var(--fg2); }
.clock-tabs button.on { background: var(--win); box-shadow: 0 1px 4px rgba(0,0,0,.15); color: var(--fg); }
.world-hero { display: flex; align-items: center; justify-content: space-between; border-radius: 18px; background: color-mix(in srgb, var(--accent) 10%, transparent); padding: 16px 20px; margin-bottom: 20px; }
.world-hero .cap { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.world-hero .dt { font-size: 13px; color: var(--fg2); }
.world-hero .tm { font-size: 44px; font-weight: 200; font-variant-numeric: tabular-nums; }
.world-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
.world-row .nm { font-size: 17px; font-weight: 500; }
.world-row .dd { font-size: 12px; color: var(--fg2); }
.world-row .tm { font-size: 34px; font-weight: 200; font-variant-numeric: tabular-nums; }
.world-row .x { opacity: 0; }
.world-row:hover .x { opacity: .6; }
.sw-disp { font-size: 72px; font-weight: 200; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.clock-round { width: 64px; height: 64px; border-radius: 50%; background: var(--field); font-size: 14px; }
.clock-round.go { background: #30d158; color: #fff; font-weight: 500; }
.clock-round.stop { background: #ff453a; color: #fff; font-weight: 500; }
.lap-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; font-variant-numeric: tabular-nums; }
.tm-wrap { position: relative; width: 230px; height: 230px; display: flex; align-items: center; justify-content: center; }
.tm-disp { font-size: 48px; font-weight: 200; font-variant-numeric: tabular-nums; }
.tm-inputs { display: flex; align-items: center; font-size: 34px; font-weight: 200; }
.tm-inputs input { width: 52px; background: none; border: 0; outline: none; text-align: center; font-size: 34px; font-weight: 200; font-variant-numeric: tabular-nums; }
.tm-start { width: 96px; height: 56px; border-radius: 99px; background: #30d158; color: #fff; font-size: 14px; }
.tm-cancel { width: 96px; height: 56px; border-radius: 99px; background: #ff453a; color: #fff; font-size: 14px; }
.city-anchor { position: relative; }

/* ── Weather ──────────────────────────────────────────────────────── */
.weather { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; color: #fff; transition: background 1s; }
.weather-head { height: 52px; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 0 16px 0 80px; }
.weather-scroll { flex: 1; min-height: 0; overflow: auto; padding: 0 32px 24px; }
.weather .hero { text-align: center; }
.weather .hero .cn { font-size: 26px; font-weight: 500; }
.weather .hero .tp { font-size: 84px; font-weight: 200; line-height: 1; }
.weather .hero .ds { margin-top: 4px; font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.weather .hero .hl { font-size: 15px; color: rgba(255,255,255,.8); }
.wcard { margin-top: 20px; border-radius: 18px; padding: 16px; }
.wcard .cap { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.6); margin-bottom: 8px; }
.hourly { display: flex; gap: 20px; overflow-x: auto; }
.hcell { flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; }
.hcell .h { color: rgba(255,255,255,.75); }
.hcell .tp { font-weight: 500; }
.wday { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,.1); font-size: 14px; }
.wday .nm { width: 48px; font-weight: 500; }
.wday .ic { width: 28px; }
.wday .lo { width: 32px; text-align: right; color: rgba(255,255,255,.65); }
.wday .bar { position: relative; flex: 1; height: 6px; border-radius: 99px; background: rgba(255,255,255,.2); }
.wday .bar i { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(90deg, #7dd3fc, #fcd34d); }
.wday .hi { width: 32px; font-weight: 500; }
.wstats { margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: center; font-size: 13px; }
.wstat { border-radius: 18px; padding: 12px; }
.wstat .k { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.6); }
.wstat .v { margin-top: 2px; font-size: 24px; font-weight: 300; }
.weather-anchor { position: relative; }
.weather-anchor .pop { position: absolute; right: 0; top: 36px; width: 280px; }

/* ── Terminal ─────────────────────────────────────────────────────── */
.term { position: absolute; inset: 0; display: flex; flex-direction: column; background: rgba(16,16,20,.96); color: #e6e6ea; font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
.term-scroll { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
.term-scroll pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: inherit; }
.term-cmd { color: #6ee7b7; }
.term-prompt { color: #6ee7b7; white-space: pre; }
.term-in { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: #e6e6ea; font-family: inherit; font-size: 13px; }

/* ── Settings ─────────────────────────────────────────────────────── */
.set-avatar-row { display: flex; align-items: center; gap: 20px; border-radius: 16px; background: var(--win2); padding: 20px; }
.set-name { width: 100%; border-radius: 8px; background: var(--field); border: 0; outline: none; padding: 6px 12px; font-size: 18px; font-weight: 600; }
.set-name:focus { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent); }
.set-avs { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.set-avs button { width: 32px; height: 32px; border-radius: 50%; font-size: 16px; }
.set-avs button:hover { background: var(--field); }
.set-avs button.on { background: color-mix(in srgb, var(--accent) 30%, transparent); box-shadow: 0 0 0 2px var(--accent); }
.set-colors { margin-top: 8px; display: flex; gap: 8px; }
.set-colors button { width: 20px; height: 20px; border-radius: 50%; }
.set-colors button.on { outline: 2px solid var(--accent); outline-offset: 2px; }
.theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.theme-opt { border-radius: 16px; border: 2px solid transparent; padding: 8px; text-align: center; transition: .15s; }
.theme-opt:hover { background: var(--field); }
.theme-opt.on { border-color: var(--accent); }
.theme-opt .prev { height: 72px; border-radius: 12px; margin-bottom: 6px; overflow: hidden; }
.theme-opt .prev i { display: block; margin: 12px auto 0; height: 40px; width: 70%; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
.theme-opt .nm { font-size: 12.5px; font-weight: 500; }
.wall-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.wall-opt { overflow: hidden; border-radius: 16px; border: 2px solid transparent; padding: 4px; text-align: left; transition: .15s; }
.wall-opt:hover { background: var(--field); }
.wall-opt.on { border-color: var(--accent); }
.wall-opt .thumb { aspect-ratio: 16/10; border-radius: 12px; background-size: cover; background-position: center; }
.wall-opt .nm { padding: 4px 6px; font-size: 12.5px; font-weight: 500; }
.perm-pill { border-radius: 99px; padding: 4px 12px; font-size: 12px; font-weight: 500; background: var(--field); color: var(--fg2); }
.perm-pill.ok { background: rgba(52,211,153,.2); color: #34d399; }
.perm-pill.bad { background: rgba(255,69,58,.2); color: #ff453a; }
.about-hero { display: flex; flex-direction: column; align-items: center; padding: 16px 0; text-align: center; }
.about-hero .nm { margin-top: 12px; font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
.about-hero .nm .au { background: linear-gradient(90deg, #6ee7b7, #38bdf8); -webkit-background-clip: text; background-clip: text; color: transparent; }
.about-hero .ver { font-size: 13px; color: var(--fg2); }
.pill-btns { display: flex; gap: 8px; }
.danger-txt { color: #ff453a; }

/* ── Finder ───────────────────────────────────────────────────────── */
.finder-grid { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; padding: 16px; }
.fitem { width: 96px; display: flex; flex-direction: column; align-items: center; gap: 6px; border-radius: 12px; padding: 8px 2px; text-align: center; }
.fitem .ic { width: 56px; height: 56px; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.fitem.sel .ic { box-shadow: 0 0 0 2px var(--accent); }
.fitem .lb { font-size: 12px; line-height: 1.2; border-radius: 6px; padding: 1px 6px; max-width: 92px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.fitem.sel .lb { background: var(--accent); color: #fff; }
.finder-status { height: 28px; flex: none; display: flex; align-items: center; border-top: 1px solid var(--line); padding: 0 16px; font-size: 11px; color: var(--fg2); }
.fthumb { width: 100%; height: 100%; object-fit: cover; }

/* ── Photos ───────────────────────────────────────────────────────── */
.ph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.ph-cell { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--field); cursor: default; animation: popIn .35s both; }
.ph-cell img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
.ph-cell:hover img { transform: scale(1.05); }
.ph-fav { position: absolute; bottom: 6px; left: 6px; font-size: 17px; opacity: 0; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
.ph-cell:hover .ph-fav, .ph-fav.on { opacity: 1; }
.ph-viewer { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; background: rgba(0,0,0,.9); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); color: #fff; animation: fadeIn .25s both; }
.ph-viewer .vhead { height: 50px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
.ph-viewer .vhead button, .ph-viewer .vhead a { border-radius: 8px; background: rgba(255,255,255,.15); padding: 5px 12px; font-size: 13px; text-decoration: none; color: #fff; }
.ph-viewer .vhead button:hover, .ph-viewer .vhead a:hover { background: rgba(255,255,255,.25); }
.ph-viewer .vhead .del { background: rgba(255,69,58,.8); }
.ph-stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
.ph-stage img { max-width: 100%; max-height: 100%; border-radius: 8px; object-fit: contain; box-shadow: 0 20px 60px rgba(0,0,0,.5); animation: popIn .3s both; }
.ph-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.15); font-size: 20px; display: flex; align-items: center; justify-content: center; }
.ph-nav:hover { background: rgba(255,255,255,.3); }
.ph-nav.l { left: 16px; }
.ph-nav.r { right: 16px; }
.cam { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; background: #000; color: #fff; }
.cam-stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.cam-stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); transition: opacity .6s, filter .3s; }
.cam-msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 40px; text-align: center; font-size: 14px; line-height: 1.6; color: rgba(255,255,255,.8); }
.cam-count { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 160px; font-weight: 200; text-shadow: 0 0 50px rgba(0,0,0,.6); animation: popIn .9s both; pointer-events: none; }
.cam-flash { position: absolute; inset: 0; background: #fff; animation: flash .5s ease-out both; pointer-events: none; }
.cam-last { position: absolute; bottom: 16px; left: 16px; width: 64px; height: 64px; border-radius: 12px; overflow: hidden; border: 2px solid rgba(255,255,255,.7); box-shadow: 0 8px 24px rgba(0,0,0,.4); transition: transform .15s; animation: popIn .5s both; }
.cam-last:hover { transform: scale(1.1); }
.cam-last img { width: 100%; height: 100%; object-fit: cover; }
.cam-dev { position: absolute; right: 16px; top: 16px; max-width: 200px; border-radius: 8px; background: rgba(0,0,0,.5); color: #fff; border: 0; padding: 5px 8px; font-size: 12px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.cam-bar { flex: none; display: flex; flex-direction: column; align-items: center; gap: 12px; border-top: 1px solid rgba(255,255,255,.1); background: #111; padding: 12px 16px 16px; }
.cam-filters { display: flex; gap: 8px; max-width: 100%; overflow-x: auto; }
.cam-flt { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; border-radius: 12px; padding: 6px; font-size: 10.5px; }
.cam-flt:hover { background: rgba(255,255,255,.1); }
.cam-flt.on { background: rgba(255,255,255,.2); }
.cam-flt .sw { width: 36px; height: 36px; border-radius: 10px; display: block; }
.cam-controls { display: flex; width: 100%; align-items: center; justify-content: center; gap: 32px; }
.cam-mode { width: 64px; height: 40px; border-radius: 99px; background: rgba(255,255,255,.15); font-size: 13px; }
.cam-mode.on { background: #facc15; color: #000; }
.cam-shutter { width: 62px; height: 62px; border-radius: 50%; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; }
.cam-shutter i { width: 50px; height: 50px; border-radius: 50%; background: #fff; transition: transform .1s; display: block; }
.cam-shutter:active i { transform: scale(.9); }
.cam-shutter:disabled { opacity: .4; }
.cam-lib { width: 64px; height: 40px; border-radius: 99px; background: rgba(255,255,255,.15); font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 4px; }

/* ── Browser ──────────────────────────────────────────────────────── */
.brw { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--win); }
.brw-bar { height: 50px; flex: none; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); background: var(--win2); padding: 0 12px 0 84px; position: relative; }
.brw-nav { display: flex; align-items: center; gap: 2px; color: var(--fg); }
.brw-nav button { border-radius: 6px; padding: 6px; display: flex; }
.brw-nav button:hover { background: var(--field); }
.brw-nav button:disabled { opacity: .3; }
.brw-addr { position: relative; margin: 0 auto; width: 100%; max-width: 680px; }
.brw-addr .pill { display: flex; align-items: center; gap: 8px; height: 32px; border-radius: 10px; background: var(--field); padding: 0 12px; font-size: 13px; transition: box-shadow .15s; }
.brw-addr .pill:focus-within { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 70%, transparent); }
.brw-addr input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 13px; text-align: center; }
.brw-addr input:focus { text-align: left; }
.brw-addr .lk { font-size: 11px; opacity: .6; display: flex; }
.brw-addr .act { display: flex; align-items: center; gap: 2px; }
.brw-addr .act button { display: flex; padding: 3px; border-radius: 5px; opacity: .6; }
.brw-addr .act button:hover { opacity: 1; }
.brw-addr .act button.on { color: #facc15; opacity: 1; }
.brw-sugg { position: absolute; left: 0; right: 0; top: 38px; overflow: hidden; border-radius: 12px; padding: 6px; font-size: 13px; z-index: 80; animation: popIn .15s both; }
.brw-sugg .row { display: flex; width: 100%; align-items: center; gap: 10px; border-radius: 8px; padding: 6px 10px; text-align: left; }
.brw-sugg .row:hover { background: rgba(128,128,128,.15); }
.brw-sugg .row.sel { background: var(--accent); color: #fff; }
.brw-tabs { height: 34px; flex: none; display: flex; align-items: flex-end; gap: 4px; border-bottom: 1px solid var(--line); background: var(--win2); padding: 0 8px; }
.brw-tab { display: flex; align-items: center; gap: 8px; height: 28px; min-width: 0; max-width: 220px; flex: 1; border-radius: 8px 8px 0 0; padding: 0 10px; font-size: 12px; color: var(--fg2); }
.brw-tab.on { background: var(--win); color: var(--fg); box-shadow: 0 -1px 0 var(--line) inset; }
.brw-tab:hover:not(.on) { background: var(--field); }
.brw-tab .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brw-tab .x { width: 16px; height: 16px; flex: none; border-radius: 4px; font-size: 10px; display: flex; align-items: center; justify-content: center; opacity: 0; }
.brw-tab:hover .x { opacity: 1; }
.brw-tab .x:hover { background: var(--field); }
.brw-newtab { margin-bottom: 3px; width: 22px; height: 22px; flex: none; border-radius: 6px; color: var(--fg2); font-size: 15px; }
.brw-newtab:hover { background: var(--field); }
.brw-load { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; }
.brw-load i { display: block; height: 100%; width: 33%; border-radius: 2px; background: var(--accent); animation: loadbar 1.1s ease-in-out infinite; }
.brw-stage { position: relative; flex: 1; min-height: 0; }
.brw-page { position: absolute; inset: 0; overflow: auto; background: var(--win); }
.brw-frame { width: 100%; height: 100%; border: 0; background: #fff; }
.brw-frame-note { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 10px; border-radius: 99px; padding: 7px 8px 7px 14px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.25); white-space: nowrap; }
.brw-frame-note button { border-radius: 99px; background: var(--accent); color: #fff; padding: 4px 10px; font-size: 12px; }
/* start page */
.start-bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: blur(40px) brightness(.55) saturate(1.2); transform: scale(1.2); }
.start-wrap { position: relative; min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: 9vh 24px 40px; color: #fff; }
.start-greet { font-size: 15px; font-weight: 500; color: rgba(255,255,255,.7); animation: slideUp .6s both; }
.start-h { margin: 2px 0 22px; font-size: 38px; font-weight: 600; letter-spacing: -.01em; animation: slideUp .6s .05s both; }
.start-form { display: flex; height: 52px; width: min(600px, 100%); align-items: center; gap: 12px; border-radius: 99px; padding: 0 20px; animation: slideUp .6s .1s both; }
.start-form input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 16px; color: #fff; }
.start-form input::placeholder { color: rgba(255,255,255,.55); }
.start-fern { flex: none; border-radius: 99px; background: rgba(255,255,255,.15); padding: 5px 12px; font-size: 12px; font-weight: 500; }
.start-fern:hover { background: rgba(255,255,255,.25); }
.start-sec { margin-top: 44px; width: min(720px, 100%); }
.start-sec .cap { margin-bottom: 12px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.55); }
.fav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 16px; }
.fav-item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.fav-item .tile { display: flex; align-items: center; justify-content: center; width: 68px; height: 68px; border-radius: 18px; transition: transform .3s; }
.fav-item:hover .tile { transform: scale(1.1) translateY(-2px); }
.fav-item .nm { max-width: 88px; font-size: 12px; color: rgba(255,255,255,.85); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.recent-item { display: flex; align-items: center; gap: 12px; border-radius: 16px; padding: 10px 14px; text-align: left; transition: transform .15s; }
.recent-item:hover { transform: scale(1.02); }
.recent-item .t { display: block; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent-item .u { display: block; font-size: 11px; color: rgba(255,255,255,.55); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* search page */
.srch-head { position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--win) 88%, transparent); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); padding: 16px 24px 0; }
.srch-row { display: flex; align-items: center; gap: 16px; }
.srch-brand { display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.srch-brand .leaf { color: #34d399; display: flex; }
.srch-tabs { margin-top: 12px; display: flex; gap: 20px; font-size: 13px; }
.srch-tabs button { padding-bottom: 8px; border-bottom: 2px solid transparent; font-weight: 500; color: var(--fg2); }
.srch-tabs button.on { border-color: var(--accent); color: var(--accent); }
.srch-tabs button:hover:not(.on) { color: var(--fg); }
.srch-body { max-width: 760px; margin: 0 auto; padding: 24px; font-size: 14px; }
.srch-count { font-size: 12px; color: var(--fg2); margin-bottom: 20px; }
.sres { margin-bottom: 22px; animation: slideUp .4s both; }
.sres .host { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--fg2); margin-bottom: 2px; }
.sres .go { display: block; text-align: left; font-size: 19px; font-weight: 500; line-height: 1.3; color: #4c8dff; }
.sres .go:hover { text-decoration: underline; }
.sres .sn { margin-top: 4px; font-size: 14px; line-height: 1.55; color: var(--fg); opacity: .8; }
.skel { margin-bottom: 24px; }
.skel i { display: block; border-radius: 6px; background: var(--field); animation: pulse 1.4s ease-in-out infinite; }
.skel .a { height: 12px; width: 160px; margin-bottom: 8px; }
.skel .b { height: 20px; width: 75%; margin-bottom: 8px; animation-delay: .1s; }
.skel .c { height: 12px; width: 100%; animation-delay: .2s; }
.extrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.pill-search { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; max-width: 560px; height: 40px; border-radius: 99px; background: var(--field); padding: 0 16px; }
.pill-search:focus-within { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 70%, transparent); }
.pill-search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 14px; text-align: left; }
.pill-search button { display: flex; opacity: .6; }
/* video grid */
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1100px; }
.vcard { text-align: left; }
.vcard .th { position: relative; overflow: hidden; border-radius: 12px; background: var(--field); aspect-ratio: 16/9; }
.vcard .th img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
.vcard:hover .th img { transform: scale(1.05); }
.vcard .du { position: absolute; bottom: 6px; right: 6px; border-radius: 5px; background: rgba(0,0,0,.8); color: #fff; padding: 1px 6px; font-size: 11px; font-weight: 500; }
.vcard .vt { margin-top: 8px; font-size: 13.5px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vcard .vc { margin-top: 2px; font-size: 12px; color: var(--fg2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vcard .vm { font-size: 12px; color: var(--fg2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vrow { display: flex; gap: 12px; text-align: left; width: 100%; }
.vrow .th { width: 168px; flex: none; }
.yt-head { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--win) 88%, transparent); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); padding: 10px 20px; }
.yt-brand { display: flex; align-items: center; gap: 6px; flex: none; }
.yt-brand .badge { display: flex; align-items: center; justify-content: center; width: 32px; height: 24px; border-radius: 6px; background: #ff0033; }
.yt-brand .nm { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.yt-body { padding: 20px; }
.yt-watch { display: flex; gap: 20px; max-width: 1280px; margin: 0 auto; flex-wrap: wrap; }
.yt-main { flex: 1; min-width: 300px; }
.yt-player { overflow: hidden; border-radius: 16px; background: #000; aspect-ratio: 16/9; box-shadow: 0 16px 40px rgba(0,0,0,.3); }
.yt-player iframe { width: 100%; height: 100%; border: 0; }
.yt-side { width: 380px; flex: none; }
.yt-side .cap { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); margin-bottom: 12px; }
.yt-side .vrow { margin-bottom: 12px; }
.yt-grid-title { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
.yt-meta { margin-top: 10px; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--fg2); flex-wrap: wrap; }
.yt-meta a { color: var(--accent); text-decoration: none; margin-left: auto; }
.yt-meta a:hover { text-decoration: underline; }

/* misc */
.icon-btn { display: flex; align-items: center; justify-content: center; border-radius: 6px; padding: 5px; color: inherit; }
.icon-btn:hover { background: var(--field); }
.center-note { text-align: center; color: var(--fg2); }
.link { color: var(--accent); }

@keyframes winOpen { from { opacity: 0; transform: scale(.82) translateY(16px); filter: blur(6px); } to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); } }
@keyframes winClose { to { opacity: 0; transform: scale(.9); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: scale(.94) translateY(-6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@keyframes dockRise { from { opacity: 0; transform: translate(-50%, 90px) scale(.9); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
@keyframes menubarDrop { from { transform: translateY(-100%); } to { transform: translateY(0); } }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-22px); } 55% { transform: translateY(0); } 72% { transform: translateY(-9px); } 88% { transform: translateY(0); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-12px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-7px); } 80% { transform: translateX(5px); } }
@keyframes sheen { 0% { opacity: 0; background-position: 130% 0; } 12% { opacity: 1; } 35% { opacity: 0; background-position: -40% 0; } 100% { opacity: 0; background-position: -40% 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bootLogo { 0% { opacity: 0; transform: scale(.8); filter: blur(14px); } 60% { opacity: 1; filter: blur(0); } 100% { opacity: 1; transform: scale(1); filter: blur(0); } }
@keyframes breathe { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.06); opacity: 1; } }
@keyframes bootFill { from { width: 0%; } to { width: 100%; } }
@keyframes zoomInDesktop { from { opacity: 0; transform: scale(1.08); filter: blur(8px); } to { opacity: 1; transform: scale(1); filter: blur(0); } }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px) scale(.96); } to { opacity: 1; transform: translateX(0) scale(1); } }
@keyframes morph { 0%, 100% { border-radius: 60% 40% 55% 45% / 55% 60% 40% 45%; } 33% { border-radius: 40% 60% 45% 55% / 60% 40% 60% 40%; } 66% { border-radius: 55% 45% 60% 40% / 45% 55% 45% 55%; } }
@keyframes drift { 0% { transform: translate3d(0,0,0) scale(1); } 50% { transform: translate3d(4%,-3%,0) scale(1.08); } 100% { transform: translate3d(0,0,0) scale(1); } }
@keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
@keyframes loadbar { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
@keyframes wordIn { from { opacity: 0; filter: blur(6px); transform: translateY(4px); } to { opacity: 1; filter: blur(0); transform: translateY(0); } }
@keyframes bar { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@keyframes helloDraw { to { stroke-dashoffset: 0; } }
@keyframes helloBloom {
  0% { filter: drop-shadow(0 0 0 rgba(245,245,247,0)); }
  55% { filter: drop-shadow(0 0 18px rgba(245,245,247,.38)); }
  100% { filter: drop-shadow(0 0 10px rgba(245,245,247,.16)); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; }
}

</style>

"use strict";

/* ── tiny DOM + misc helpers ─────────────────────────────────────── */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html !== undefined) n.innerHTML = html;
  return n;
}
function on(node, ev, fn, opts) { node.addEventListener(ev, fn, opts); return () => node.removeEventListener(ev, fn, opts); }
function debounce(fn, ms) { let t = null; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

/* fetch with timeout + JSON helper — every network call goes through this */
async function fetchT(url, opts = {}, ms = 9000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try {
    return await fetch(url, { ...opts, signal: opts.signal || ctl.signal });
  } finally {
    clearTimeout(t);
  }
}
async function fetchJSON(url, opts, ms) {
  const r = await fetchT(url, opts, ms);
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}

/* simple event bus */
const bus = {
  _m: new Map(),
  on(ev, fn) {
    if (!this._m.has(ev)) this._m.set(ev, new Set());
    this._m.get(ev).add(fn);
    return () => this._m.get(ev)?.delete(fn);
  },
  emit(ev, data) {
    const s = this._m.get(ev);
    if (s) for (const fn of Array.from(s)) { try { fn(data); } catch (e) { console.warn("bus handler failed for", ev, e); } }
  },
};

/* ── safe localStorage ───────────────────────────────────────────── */
const store = {
  get(k, dflt) {
    try {
      const raw = localStorage.getItem("canopyos." + k);
      return raw == null ? dflt : JSON.parse(raw);
    } catch { return dflt; }
  },
  set(k, v) {
    try { localStorage.setItem("canopyos." + k, JSON.stringify(v)); return true; }
    catch (e) { console.warn("storage full or blocked:", k); return false; }
  },
  del(k) { try { localStorage.removeItem("canopyos." + k); } catch {} },
};

/* ── compact sha-256 (for local demo passwords; sync, no crypto.subtle dependency) ── */
function sha256(ascii) {
  function rightRotate(v, a) { return (v >>> a) | (v << (32 - a)); }
  const mathPow = Math.pow, maxWord = mathPow(2, 32);
  let result = "";
  const words = [], asciiBitLength = ascii.length * 8;
  let hash = [], k = [], primeCounter = 0;
  const isComposite = {};
  for (let candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += "\x80";
  while (ascii.length % 64 - 56) ascii += "\x00";
  for (let i = 0; i < ascii.length; i++) {
    const j = ascii.charCodeAt(i);
    if (j >> 8) return "";
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = (asciiBitLength / maxWord) | 0;
  words[words.length] = asciiBitLength;
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16);
    const oldHash = hash.slice(0);
    hash = hash.slice(0, 8);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2];
      const a = hash[0], e = hash[4];
      const temp1 = hash[7]
        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i]
        + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) | 0);
      const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (let i = 0; i < 8; i++)
    for (let j = 3; j + 1; j--) {
      const b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? 0 : "") + b.toString(16);
    }
  return result;
}
function hashPassword(pw, salt) {
  salt = salt || Math.random().toString(36).slice(2, 18);
  return { hash: sha256(salt + "::" + pw), salt };
}
function verifyPassword(pw, hash, salt) {
  if (!hash || !salt) return true; // no password set
  return hashPassword(pw, salt).hash === hash;
}

/* ── photo store (IndexedDB with localStorage fallback) ──────────── */
const PhotoStore = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((resolve) => {
      try {
        if (!("indexedDB" in window)) return resolve(null);
        const req = indexedDB.open("canopyos", 1);
        req.onupgradeneeded = () => { try { req.result.createObjectStore("photos", { keyPath: "id" }); } catch {} };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
        setTimeout(() => resolve(dbp === null ? null : dbp), 2500);
      } catch { resolve(null); }
    }).then((db) => { dbp = db ? Promise.resolve(db) : Promise.resolve(null); return db; });
    return dbp;
  }
  async function tx(mode, fn) {
    const db = await open();
    if (!db) return null;
    return new Promise((resolve) => {
      try {
        const t = db.transaction("photos", mode);
        const st = t.objectStore("photos");
        const out = fn(st);
        t.oncomplete = () => resolve(out && out.result !== undefined ? out.result : true);
        t.onerror = () => resolve(null);
        t.onabort = () => resolve(null);
      } catch { resolve(null); }
    });
  }
  return {
    async all(userId) {
      const db = await open();
      if (!db) return store.get("photos." + userId, []);
      return new Promise((resolve) => {
        try {
          const st = db.transaction("photos", "readonly").objectStore("photos");
          const req = st.getAll();
          req.onsuccess = () => resolve((req.result || []).filter((p) => p.userId === userId).sort((a, b) => b.createdAt - a.createdAt));
          req.onerror = () => resolve([]);
        } catch { resolve([]); }
      });
    },
    async put(photo) {
      const db = await open();
      if (!db) {
        const k = "photos." + photo.userId;
        const list = store.get(k, []);
        list.unshift(photo);
        if (!store.set(k, list)) throw new Error("quota");
        return photo;
      }
      const ok = await tx("readwrite", (st) => st.put(photo));
      if (!ok) throw new Error("quota");
      return photo;
    },
    async del(id) {
      const db = await open();
      if (!db) return;
      await tx("readwrite", (st) => st.delete(id));
    },
  };
})();

function icon(name, size, strokeW) {

}
