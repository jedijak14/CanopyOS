        e.preventDefault();
        const n = Math.min(hist.length - 1, hi + 1);
        if (hist[hist.length - 1 - n] !== undefined) { hi = n; input = hist[hist.length - 1 - n]; inputEl.value = input; }
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        const n = hi - 1;
        hi = n;
        input = n >= 0 ? hist[hist.length - 1 - n] : "";
        inputEl.value = input;
      } else if (e.key === "l" && e.ctrlKey) {
        e.preventDefault();
        lines = [];
        paint();
      }
    };
    row.appendChild(promptSpan);
    row.appendChild(inputEl);
    scroller.appendChild(row);
    scroller.scrollTop = scroller.scrollHeight;
    setTimeout(() => inputEl.focus(), 30);
  }
  scroller.onclick = () => inputEl && inputEl.focus();
  paint();
  return { update() { inputEl && inputEl.focus(); }, destroy() {} };
}

/* ═══ System Settings ══════════════════════════════════════════════ */
function SettingsApp({ win, body }) {
  const SECTIONS = [
    { id: "profile", icon: "user", label: "Profile" },
    { id: "appearance", icon: "palette", label: "Appearance" },
    { id: "wallpaper", icon: "image", label: "Wallpaper" },
    { id: "dock", icon: "dock", label: "Dock" },
    { id: "fern", icon: "spark", label: "Fern" },
    { id: "display", icon: "display", label: "Display & Sound" },
    { id: "location", icon: "pin", label: "Location" },
    { id: "privacy", icon: "shield", label: "Privacy" },
    { id: "about", icon: "info", label: "About" },
  ];
  const ACCENTS = ["#0a84ff", "#bf5af2", "#ff375f", "#ff9f0a", "#30d158", "#64d2ff", "#8e8e93"];
  let section = win.props.section || "profile";
  let msg = "";
  let cityQ = "";
  let cities = [];
  let camPerm = "unknown";
  let confirmDel = false;
  let alive = true;

  body.innerHTML = `<div class="app-flex">
    <div class="side" data-drag="1" style="width:210px">
      <div class="set-prof" style="display:flex;align-items:center;gap:10px;margin:0 8px 12px;padding:6px 8px;border-radius:12px"></div>
      <div id="s-nav" style="padding:0 10px"></div>
    </div>
    <div class="main">
      <div class="main-head" data-drag="1" id="s-title" style="font-size:17px"></div>
      <div class="main-scroll thin-scroll" id="s-body" style="padding:16px 28px 32px"></div>
    </div>
  </div>`;

  try {
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: "camera" }).then((p) => { camPerm = p.state; paint(); }).catch(() => {});
    }
  } catch {}

  const navEl = $("#s-nav", body);
  const profEl = $(".set-prof", body);
  const titleEl = $("#s-title", body);
  const mainEl = $("#s-body", body);

  async function saveProfile(patch) {
    if (!OS.user) return false;
    const u = Users.update(OS.user.id, patch);
    if (u) {
      OS.user = { ...OS.user, id: u.id, name: u.name, avatar: u.avatar, color: u.color, hasPassword: !!u.pwHash };
      store.set("session", u.id);
      bus.emit("user");
    }
    return !!u;
  }

  function Row(label, sub, controlHTML) {
    return `<div class="row-line"><div><div class="lb">${esc(label)}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div><div style="flex:none">${controlHTML}</div></div>`;
  }

  async function paint() {
    const s = OS.settings;
    profEl.innerHTML = "";
    if (OS.user) {
      profEl.appendChild(makeAvatar(OS.user, 38));
      profEl.appendChild(el("div", "", `<div style="font-size:13px;font-weight:600">${esc(OS.user.name)}</div><div style="font-size:11px;color:var(--fg2)">CanopyOS Account</div>`));
    }
    navEl.innerHTML = "";
    for (const x of SECTIONS) {
      const b = el("button", "side-item" + (section === x.id ? " on" : ""));
      b.innerHTML = `<span class="ic">${icon(x.icon, 15)}</span>${esc(x.label)}`;
      b.onclick = () => { section = x.id; paint(); };
      navEl.appendChild(b);
    }
    titleEl.textContent = SECTIONS.find((x) => x.id === section).label;
    mainEl.style.animation = "none";
    void mainEl.offsetWidth;
    mainEl.style.animation = "fadeIn .25s both";
    mainEl.innerHTML = "";

    if (section === "profile") {
      const box = el("div", "set-avatar-row");
      box.appendChild(makeAvatar(OS.user, 84));
      const right = el("div");
      right.style.flex = "1";
      const nameIn = el("input", "set-name");
      nameIn.value = OS.user.name;
      nameIn.onchange = async () => { if (nameIn.value.trim() && nameIn.value !== OS.user.name) await saveProfile({ name: nameIn.value.trim().slice(0, 32) }); };
      right.appendChild(nameIn);
      const avs = el("div", "set-avs");
      for (const a of AVATARS) {
        const b = el("button", OS.user.avatar === a ? "on" : "", a);
        b.onclick = async () => { await saveProfile({ avatar: a }); paint(); };
        avs.appendChild(b);
      }
      right.appendChild(avs);
      const cols = el("div", "set-colors");
      for (const c of COLORS) {
        const b = el("button", OS.user.color === c ? "on" : "");
        b.style.background = c;
        b.onclick = async () => { await saveProfile({ color: c }); paint(); };
        cols.appendChild(b);
      }
      right.appendChild(cols);
      box.appendChild(right);
      mainEl.appendChild(box);

      const pwCard = el("div", "row-card");
      pwCard.style.marginTop = "16px";
      const pwIn = el("input", "field");
      pwIn.type = "password";
      pwIn.style.width = "150px";
      pwIn.placeholder = OS.user.hasPassword ? "New password" : "Set password";
      const saveB = el("button", "btn btn-primary", "Save");
      saveB.disabled = !pwIn.value;
      pwIn.oninput = () => { saveB.disabled = !pwIn.value; };
      saveB.onclick = async () => {
        const h = hashPassword(pwIn.value);
        await saveProfile({ pwHash: h.hash, pwSalt: h.salt });
        pwIn.value = "";
        msg = "Password updated";
        saveB.disabled = true;
        paint();
        setTimeout(() => { msg = ""; paint(); }, 2500);
      };
      const rmB = OS.user.hasPassword ? el("button", "btn", "Remove") : null;
      if (rmB) rmB.onclick = async () => { await saveProfile({ pwHash: null, pwSalt: null }); msg = "Password removed"; paint(); setTimeout(() => { msg = ""; paint(); }, 2500); };
      pwCard.innerHTML = Row("Password", OS.user.hasPassword ? "Your profile is protected with a password." : "No password — anyone can sign in to this profile.", "");
      const ctl = $(".row-line > div:last-child", pwCard);
      ctl.appendChild(pwIn);
      ctl.appendChild(saveB);
      if (rmB) ctl.appendChild(rmB);
      if (msg) pwCard.appendChild(el("div", "", `<div style="padding:0 0 12px;font-size:12px;color:#34d399">${esc(msg)}</div>`));
      mainEl.appendChild(pwCard);

      const sessCard = el("div", "row-card");
      sessCard.style.marginTop = "16px";
      sessCard.innerHTML = Row("Sign out", "Return to the login screen and switch profiles.", `<button class="btn" id="s-out">Sign Out…</button>`);
      sessCard.innerHTML += Row("Delete this profile", "Permanently removes your profile, notes and photos from this browser.", confirmDel
        ? `<span class="pill-btns"><button class="btn" id="s-cx">Cancel</button><button class="btn btn-danger" id="s-del">Confirm Delete</button></span>`
        : `<button class="btn danger-txt" id="s-dd">Delete…</button>`);
      mainEl.appendChild(sessCard);
      $("#s-out", sessCard).onclick = () => logout();
      if (confirmDel) {
        $("#s-cx", sessCard).onclick = () => { confirmDel = false; paint(); };
        $("#s-del", sessCard).onclick = async () => { Users.remove(OS.user.id); logout(); };
      } else {
        const dd = $("#s-dd", sessCard);
        if (dd) dd.onclick = () => { confirmDel = true; paint(); };
      }
    }

    if (section === "appearance") {
      const grid = el("div", "theme-grid");
      for (const t of ["light", "dark", "auto"]) {
        const b = el("button", "theme-opt" + (s.theme === t ? " on" : ""));
        const prevBg = t === "light" ? "#f2f2f7" : t === "dark" ? "#1c1c1e" : "linear-gradient(135deg,#f2f2f7 50%,#1c1c1e 50%)";
        const winBg = t === "light" ? "#fff" : t === "dark" ? "#2c2c2e" : "linear-gradient(135deg,#fff 50%,#2c2c2e 50%)";
        b.innerHTML = `<div class="prev" style="background:${prevBg}"><i style="background:${winBg}"></i></div><span class="nm">${t[0].toUpperCase() + t.slice(1)}</span>`;
        b.onclick = () => { updateSettings({ theme: t }); paint(); };
        grid.appendChild(b);
      }
      mainEl.appendChild(grid);
      const accCard = el("div", "row-card");
      accCard.style.marginTop = "16px";
      accCard.innerHTML = Row("Accent color", "", `<div class="set-colors" style="margin:0"></div>`);
      const acc = $(".set-colors", accCard);
      for (const c of ACCENTS) {
        const b = el("button", s.accent === c ? "on" : "");
        b.style.background = c;
        b.onclick = () => { updateSettings({ accent: c }); paint(); };
        acc.appendChild(b);
      }
      mainEl.appendChild(accCard);
    }

    if (section === "wallpaper") {
      const grid = el("div", "wall-grid");
      for (const wp of WALLPAPERS) {
        const b = el("button", "wall-opt" + (s.wallpaper === wp.id ? " on" : ""));
        b.innerHTML = `<div class="thumb" style="${wallpaperCSS(wp.id)}"></div><div class="nm">${esc(wp.name)}</div>`;
        b.onclick = () => { updateSettings({ wallpaper: wp.id }); paint(); };
        grid.appendChild(b);
      }
      mainEl.appendChild(grid);
    }

    if (section === "dock") {
      const card = el("div", "row-card");
      card.innerHTML = Row("Size", "", `<input type="range" min="40" max="80" value="${s.dockSize}" style="width:200px" data-k="dockSize"/>`);
      card.innerHTML += Row("Magnification", "Icons grow as your pointer moves over them.", `<button class="switch" data-on="${s.magnify}" id="s-mag"></button>`);
      if (s.magnify) card.innerHTML += Row("Magnification amount", "", `<input type="range" min="1.2" max="2.4" step="0.05" value="${s.magnifyAmount}" style="width:200px" data-k="magnifyAmount"/>`);
      mainEl.appendChild(card);
      $$('input[type="range"]', card).forEach((r) => {
        r.oninput = () => { updateSettings({ [r.dataset.k]: Number(r.value) }); };
      });
      $("#s-mag", card).onclick = () => { updateSettings({ magnify: !s.magnify }); paint(); };
    }

    if (section === "fern") {
      const hero = el("div", "set-avatar-row");
      hero.innerHTML = `<div style="width:56px;height:56px">${appIconSVG("fern")}</div>
        <div><div style="font-size:16px;font-weight:600">Fern</div>
        <div style="font-size:12.5px;color:var(--fg2)">Your built-in assistant. Press ⌥Space anywhere, click the orb in the menu bar, or ask from Spotlight.</div></div>`;
      mainEl.appendChild(hero);
      const card = el("div", "row-card");
      card.style.marginTop = "16px";
      card.innerHTML = Row("Speak responses after voice requests", "Fern talks back when you use the microphone.", `<button class="switch" data-on="${s.voiceReplies}" id="s-voice"></button>`);
      card.innerHTML += Row("Try Fern", "", `<button class="btn btn-primary" id="s-open">Open Fern</button>`);
      mainEl.appendChild(card);
      $("#s-voice", card).onclick = () => { updateSettings({ voiceReplies: !s.voiceReplies }); paint(); };
      $("#s-open", card).onclick = () => openFern();
      const hint = el("div", "hint-card");
      hint.style.marginTop = "16px";
      hint.innerHTML = `Fern understands commands locally (open apps, timers, notes, weather, YouTube, photos, math, themes) and uses a built-in online model for open-ended questions when the network is available. Nothing you say leaves the app except what you type or say to Fern.`;
      mainEl.appendChild(hint);
    }

    if (section === "display") {
      const card = el("div", "row-card");
      card.innerHTML = Row("Brightness", "", `<input type="range" min="30" max="100" value="${s.brightness}" style="width:200px" data-k="brightness"/>`);
      card.innerHTML += Row("Volume", "Controls system sounds and notification chimes.", `<input type="range" min="0" max="100" value="${s.volume}" style="width:200px" data-k="volume"/>`);
      mainEl.appendChild(card);
      $$('input[type="range"]', card).forEach((r) => {
        r.oninput = () => { updateSettings({ [r.dataset.k]: Number(r.value) }); };
      });
    }

    if (section === "location") {
      const card = el("div", "row-card");
      card.innerHTML = Row("Weather location", esc(s.city.name), `<input class="field" style="width:200px" placeholder="Search city…" id="s-cityq"/>`);
      card.innerHTML += Row("Current location", "Only used after you grant browser permission. Updates Weather and the live Weather wallpaper.", `<button class="btn" id="s-locate">Use current location</button>`);
      mainEl.appendChild(card);
      $("#s-locate", card).onclick = async () => {
        try { const city = await requestLocation(); updateSettings({ city }); notify({ title: "Location updated", body: "Weather now uses your current location." }); paint(); }
        catch (e) { notify({ title: "Location unavailable", body: e.message }); }
      };
      const q = $("#s-cityq", card);
      q.value = cityQ;
      q.oninput = () => {
        cityQ = q.value;
        clearTimeout(paint._t);
        paint._t = setTimeout(async () => {
          if (cityQ.trim().length < 2) { cities = []; paint(); return; }
          try { cities = await geocode(cityQ); } catch { cities = []; }
          paint();
        }, 250);
      };
      if (cities.length) {
        const lst = el("div", "row-card");
        lst.style.marginTop = "12px";
        lst.style.padding = "6px";
        for (const c of cities) {
          const b = el("button", "menu-item", esc(c.name));
          b.style.padding = "8px 12px";
          b.onclick = () => { updateSettings({ city: c }); cityQ = ""; cities = []; paint(); };
          lst.appendChild(b);
        }
        mainEl.appendChild(lst);
      }
    }

    if (section === "privacy") {
      const card = el("div", "row-card");
      const camPill = `<span class="perm-pill ${camPerm === "granted" ? "ok" : camPerm === "denied" ? "bad" : ""}">${camPerm === "granted" ? "Allowed" : camPerm === "denied" ? "Blocked" : "Ask"}</span>`;
      card.innerHTML = Row("Camera", "Used by the Photos app to take pictures. Photos stay in this browser.", camPill);
      card.innerHTML += Row("Microphone", "Used by Fern for voice requests when you tap the mic.", `<span class="perm-pill">On request</span>`);
      card.innerHTML += Row("Browser data", "Clear your Canopy Browser history.", `<button class="btn" id="s-ch">Clear History</button>`);
      mainEl.appendChild(card);
      $("#s-ch", card).onclick = () => { updateSettings({ history: [] }); notify({ title: "History cleared" }); };
    }

    if (section === "about") {
      const hero = el("div", "about-hero");
      hero.appendChild(makeLogo(96, false, true));
      hero.appendChild(el("div", "nm", `CanopyOS <span class="au">Aurora</span>`));
      hero.appendChild(el("div", "ver", "Version 1.0 · Liquid Glass"));
      mainEl.appendChild(hero);
      const card = el("div", "row-card");
      card.innerHTML = Row("Assistant", "", `<span style="font-size:13px;color:var(--fg2)">Fern 3.0</span>`);
      card.innerHTML += Row("Signed in as", "", `<span style="font-size:13px;color:var(--fg2)">${esc(OS.user ? OS.user.name : "—")}</span>`);
      card.innerHTML += Row("Processor", "", `<span style="font-size:13px;color:var(--fg2)">${navigator.hardwareConcurrency || "—"} cores</span>`);
      card.innerHTML += Row("Display", "", `<span style="font-size:13px;color:var(--fg2)">${window.innerWidth} × ${window.innerHeight}</span>`);
      card.innerHTML += Row("Software Update", "CanopyOS Aurora is up to date.", `<button class="btn" id="s-upd">Check Now</button>`);
      mainEl.appendChild(card);
      $("#s-upd", card).onclick = () => notify({ title: "CanopyOS is up to date", body: "You have the latest version: Aurora 1.0", app: "settings" });
    }
  }

  paint();
  return {
    update(props) { if (props.section) { section = props.section; paint(); } },
    destroy() { alive = false; clearTimeout(paint._t); },
  };
}

/* ═══ Photos ═══════════════════════════════════════════════════════ */
const PHOTO_FILTERS = [
  { id: "none", name: "Original", css: "none", swatch: "linear-gradient(135deg,#9ad,#fda)" },
  { id: "vivid", name: "Vivid", css: "saturate(1.7) contrast(1.1)", swatch: "linear-gradient(135deg,#f0f,#0ff)" },
  { id: "warm", name: "Warm", css: "sepia(.35) saturate(1.35) hue-rotate(-10deg) brightness(1.03)", swatch: "linear-gradient(135deg,#f93,#fc6)" },
  { id: "cool", name: "Cool", css: "hue-rotate(15deg) saturate(1.2) brightness(1.05)", swatch: "linear-gradient(135deg,#39f,#9ef)" },
  { id: "mono", name: "Mono", css: "grayscale(1) contrast(1.1)", swatch: "linear-gradient(135deg,#888,#ddd)" },
  { id: "noir", name: "Noir", css: "grayscale(1) contrast(1.6) brightness(.85)", swatch: "linear-gradient(135deg,#000,#777)" },
  { id: "fade", name: "Fade", css: "contrast(.85) brightness(1.1) saturate(.8)", swatch: "linear-gradient(135deg,#cbd,#edc)" },
  { id: "sepia", name: "Sepia", css: "sepia(1)", swatch: "linear-gradient(135deg,#7a5230,#e0b988)" },
  { id: "dream", name: "Dream", css: "blur(.7px) saturate(1.5) brightness(1.1) contrast(.95)", swatch: "linear-gradient(135deg,#f9c,#9cf)" },
];
const cssOf = (id) => (PHOTO_FILTERS.find((f) => f.id === id) || {}).css || "none";

function PhotosApp({ win, body }) {
  let view = win.props.capture ? "camera" : "library";
  let wantCapture = !!win.props.capture;
  let photos = [];
  let loaded = false;
  let openId = null;
  let alive = true;
  let lastPhoto = null;

  body.innerHTML = `<div class="app-flex">
    <div class="side" data-drag="1">
      <div class="side-head">Photos</div>
      <div id="p-nav" style="padding:0 10px"></div>
      <div style="margin-top:auto;padding:0 12px 12px;font-size:11px;line-height:1.45;color:var(--fg2)">Photos are stored privately in your browser.</div>
    </div>
    <div class="main" id="p-main"></div>
  </div>`;
  const navEl = $("#p-nav", body);
  const mainEl = $("#p-main", body);

  async function load() {
    photos = OS.user ? await PhotoStore.all(OS.user.id).catch(() => []) : [];
    loaded = true;
    paint();
  }

  function dayLabel(d) {
    const t = new Date();
    const y = new Date();
    y.setDate(t.getDate() - 1);
    if (d.toDateString() === t.toDateString()) return "Today";
    if (d.toDateString() === y.toDateString()) return "Yesterday";
    return d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: d.getFullYear() !== t.getFullYear() ? "numeric" : undefined });
  }

  function navPaint() {
    navEl.innerHTML = "";
    const mk = (id, ic, label, count) => {
      const b = el("button", "side-item" + (view === id ? " on" : ""));
      b.innerHTML = `<span class="ic">${icon(ic, 15)}</span><span style="flex:1">${esc(label)}</span>${count !== undefined ? `<span class="cnt">${count}</span>` : ""}`;
      b.onclick = () => { view = id; paint(); };
      navEl.appendChild(b);
    };
    mk("library", "image", "Library", photos.length);
    mk("favorites", "heart", "Favorites", photos.filter((p) => p.favorite).length);
    navEl.appendChild(el("div", "side-head", "Capture")).style.marginTop = "16px";
    mk("camera", "camera", "Camera");
  }

  async function toggleFav(p) {
    p.favorite = !p.favorite;
    await PhotoStore.put(p).catch(() => {});
    paint();
  }
  async function del(p) {
    openId = null;
    photos = photos.filter((x) => x.id !== p.id);
    await PhotoStore.del(p.id).catch(() => {});
    paint();
  }

  function paintLibrary() {
    const list = view === "favorites" ? photos.filter((p) => p.favorite) : photos;
    const groups = [];
    for (const p of list) {
      const l = dayLabel(new Date(p.createdAt));
      const g = groups.find((x) => x[0] === l);
      if (g) g[1].push(p);
      else groups.push([l, [p]]);
    }
    mainEl.innerHTML = "";
    const head = el("div", "main-head");
    head.dataset.drag = "1";
    head.innerHTML = `<div>${view === "library" ? "Library" : "Favorites"}</div>`;
    const take = el("button", "btn btn-primary");
    take.innerHTML = `<span style="display:inline-flex;vertical-align:-3px;margin-right:6px">${icon("camera", 14)}</span>Take Photo`;
    take.onclick = () => { view = "camera"; paint(); };
    head.appendChild(take);
    mainEl.appendChild(head);

    const scroll = el("div", "main-scroll thin-scroll");
    scroll.style.padding = "16px";
    if (loaded && list.length === 0) {
      const d = el("div", "empty-state");
      d.innerHTML = `<span class="ic">${icon(view === "favorites" ? "heart" : "camera", 44)}</span>
        <div class="big">${view === "favorites" ? "No favorites yet" : "No photos yet"}</div>
        <div style="max-width:280px;font-size:13px">${view === "favorites" ? "Tap the heart on a photo to add it here." : "Take your first photo with the camera — it'll show up here."}</div>`;
      if (view !== "favorites") {
        const b = el("button", "btn btn-primary", "Open Camera");
        b.style.marginTop = "4px";
        b.onclick = () => { view = "camera"; paint(); };
        d.appendChild(b);
      }
      scroll.appendChild(d);
    }
    for (const [label, ps] of groups) {
      const sec = el("div");
      sec.style.marginBottom = "24px";
      sec.appendChild(el("div", "", `<div style="font-size:15px;font-weight:600;margin-bottom:8px">${esc(label)}</div>`));
      const grid = el("div", "ph-grid");
      ps.forEach((p, i) => {
        const cell = el("div", "ph-cell");
        cell.style.animationDelay = Math.min(i, 10) * 0.03 + "s";
        cell.innerHTML = `<img src="${p.data}" alt="" loading="lazy" style="filter:${cssOf(p.filter)}"/>`;
        const fav = el("button", "ph-fav" + (p.favorite ? " on" : ""), p.favorite ? "❤️" : "🤍");
        fav.onclick = (e) => { e.stopPropagation(); toggleFav(p); };
        cell.appendChild(fav);
        cell.onclick = () => { openId = p.id; paint(); };
        grid.appendChild(cell);
      });
      sec.appendChild(grid);
      scroll.appendChild(sec);
    }
    mainEl.appendChild(scroll);

    // viewer
    const idx = openId !== null ? list.findIndex((p) => p.id === openId) : -1;
    const cur = idx >= 0 ? list[idx] : null;
    if (cur) {
      const v = el("div", "ph-viewer");
      v.innerHTML = `<div class="vhead" data-drag="1">
          <button id="pv-back">‹ Back</button>
          <div style="font-size:13px;color:rgba(255,255,255,.7)">${esc(new Date(cur.createdAt).toLocaleString())}</div>
          <div style="display:flex;gap:8px">
            <button id="pv-fav">${cur.favorite ? "❤️" : "🤍"}</button>
            <a id="pv-save" download="CanopyOS.jpg">⬇︎ Save</a>
            <button class="del" id="pv-del">🗑 Delete</button>
          </div></div>
        <div class="ph-stage">
          <img src="${cur.data}" style="filter:${cssOf(cur.filter)}" alt=""/>
          ${idx > 0 ? `<button class="ph-nav l">‹</button>` : ""}
          ${idx < list.length - 1 ? `<button class="ph-nav r">›</button>` : ""}
        </div>`;
      mainEl.appendChild(v);
      $("#pv-back", v).onclick = () => { openId = null; paint(); };
      $("#pv-fav", v).onclick = () => toggleFav(cur).then(() => { openId = cur.id; paint(); });
      $("#pv-save", v).href = cur.data;
      $("#pv-del", v).onclick = () => del(cur);
      const l = $(".ph-nav.l", v), r = $(".ph-nav.r", v);
      if (l) l.onclick = () => { openId = list[idx - 1].id; paint(); };
      if (r) r.onclick = () => { openId = list[idx + 1].id; paint(); };
    }
  }

  function paintCamera() {
    mainEl.innerHTML = `<div class="cam"></div>`;
    const cam = $(".cam", mainEl);
    const stage = el("div", "cam-stage");
    const video = el("video");
    video.playsInline = true;
    video.muted = true;
    stage.appendChild(video);
    const bar = el("div", "cam-bar");
    cam.appendChild(stage);
    cam.appendChild(bar);

    let filter = "none";
    let timer = 0;
    let count = null;
    let saving = false;
    let devices = [];
    let deviceId;
    let stream = null;
    let countIv = null;

    const stop = () => { try { stream && stream.getTracks().forEach((t) => t.stop()); } catch {} stream = null; };
    const start = async () => {
      stop();
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        paintErr("Camera access isn't available in this browser context.");
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false,
        });
        video.srcObject = stream;
        try { await video.play(); } catch {}
        video.style.opacity = 1;
        const oldMsg = $(".cam-msg", stage);
        if (oldMsg) oldMsg.remove();
        barPaint();
        navigator.mediaDevices.enumerateDevices().then((d) => { devices = d.filter((x) => x.kind === "videoinput"); paintDevs(); }).catch(() => {});
      } catch (e) {
        paintErr(
          e && e.name === "NotAllowedError" ? "Camera access was blocked. Allow camera permission for this file/site in your browser, then try again."
          : e && e.name === "NotFoundError" ? "No camera was found on this device."
          : e && e.name === "NotReadableError" ? "Your camera is in use by another app."
          : `Couldn't start the camera${e && e.name ? " (" + e.name + ")" : ""}.`,
        );
      }
    };
    function paintErr(msg) {
      const old = $(".cam-msg", stage);
      if (old) old.remove();
      const m = el("div", "cam-msg");
      m.innerHTML = `<span style="display:flex">${icon("camera", 44)}</span><div style="max-width:420px">${esc(msg)}</div>`;
      const b = el("button", "btn btn-primary", "Try Again");
      b.onclick = start;
      m.appendChild(b);
      stage.appendChild(m);
      video.style.opacity = 0;
    }
    function paintDevs() {
      const old = $(".cam-dev", stage);
      if (old) old.remove();
      if (devices.length > 1) {
        const sel = el("select", "cam-dev");
        sel.setAttribute("aria-label", "Camera");
        devices.forEach((d, i) => {
          const o = el("option", "", esc(d.label || `Camera ${i + 1}`));
          o.value = d.deviceId;
          sel.appendChild(o);
        });
        sel.value = deviceId || "";
        sel.onchange = () => { deviceId = sel.value || undefined; start(); };
        stage.appendChild(sel);
      }
    }
    async function shoot() {
      if (!video.videoWidth || saving) return;
      saving = true;
      const c = document.createElement("canvas");
      const maxDim = 1280;
      let vw = video.videoWidth, vh = video.videoHeight;
      const scale = Math.min(1, maxDim / Math.max(vw, vh));
      c.width = Math.round(vw * scale);
      c.height = Math.round(vh * scale);
      const ctx = c.getContext("2d");
      if (ctx.filter !== undefined) ctx.filter = cssOf(filter);
      ctx.translate(c.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, c.width, c.height);
      playSound("shutter");
      const flash = el("div", "cam-flash");
      stage.appendChild(flash);
      setTimeout(() => flash.remove(), 550);
      const dataUrl = c.toDataURL("image/jpeg", 0.82);
      try {
        const p = { id: Date.now(), userId: OS.user.id, data: dataUrl, mime: "image/jpeg", filter: "none", favorite: false, createdAt: Date.now() };
        await PhotoStore.put(p);
        photos = await PhotoStore.all(OS.user.id).catch(() => photos);
        lastPhoto = p;
      } catch {
        notify({ title: "Couldn't save photo", body: "Browser storage is full. Delete some photos and try again.", app: "photos" });
      }
      saving = false;
      barPaint();
    }
    function trigger(seconds) {
      if (!stream || count !== null) return;
      if (!seconds) { shoot(); return; }
      let n = seconds;
      count = n;
      playSound("pop");
      paintCount();
      countIv = setInterval(() => {
        n -= 1;
        if (n <= 0) {
          clearInterval(countIv);
          count = null;
          const cc = $(".cam-count", stage);
          if (cc) cc.remove();
          shoot();
        } else { count = n; paintCount(); playSound("pop"); }
      }, 1000);
    }
    function paintCount() {
      const old = $(".cam-count", stage);
      if (old) old.remove();
      if (count !== null) stage.appendChild(el("div", "cam-count", String(count)));
    }
    function barPaint() {
      bar.innerHTML = "";
      const fl = el("div", "cam-filters no-scroll");
      for (const f of PHOTO_FILTERS) {
        const b = el("button", "cam-flt" + (filter === f.id ? " on" : ""));
        b.innerHTML = `<span class="sw" style="background:${f.swatch};filter:${f.css === "none" ? "" : f.css}"></span>${f.name}`;
        b.onclick = () => { filter = f.id; video.style.filter = cssOf(filter); barPaint(); };
        fl.appendChild(b);
      }
      bar.appendChild(fl);
      const ctr = el("div", "cam-controls");
      const mode = el("button", "cam-mode" + (timer ? " on" : ""), timer ? `⏱ ${timer}s` : "⏱ Off");
      mode.onclick = () => { timer = timer === 0 ? 3 : timer === 3 ? 10 : 0; barPaint(); };
      const shut = el("button", "cam-shutter");
      shut.appendChild(el("i"));
      shut.disabled = !stream || saving;
      shut.onclick = () => trigger(timer);
      const lib = el("button", "cam-lib", `${icon("image", 14)} Library`);
      lib.onclick = () => { view = "library"; paint(); };
      ctr.appendChild(mode);
      ctr.appendChild(shut);
      ctr.appendChild(lib);
      bar.appendChild(ctr);
      if (lastPhoto && !$(".cam-last", stage)) {
        const b = el("button", "cam-last");
        b.innerHTML = `<img src="${lastPhoto.data}"/>`;
        b.onclick = () => { view = "library"; paint(); };
        stage.appendChild(b);
      }
    }

    start();
    barPaint();
    if (wantCapture) {
      wantCapture = false;
      setTimeout(() => trigger(3), 600);
    }
    return { stop };
  }

  load();
  let camClean = null;
  function paint() {
    if (camClean) { camClean(); camClean = null; }
    navPaint();
    if (view === "camera") camClean = paintCamera().stop;
    else paintLibrary();
  }
  paint();
  return {
    update(props) { if (props.capture) { view = "camera"; wantCapture = true; paint(); } },
    destroy() { alive = false; if (camClean) camClean(); },
  };
}

</script>
<script>
/* ════════════════════════════════════════════════════════════════════
   apps2.js — Canopy Browser (fully client-side)
   Start page · search (Wikipedia-backed, CORS-safe) · YouTube
   (embedded player + best-effort search) · web pages in a frame with
   honest fallbacks for sites that refuse to be embedded.
   ════════════════════════════════════════════════════════════════════ */

const YT_HOST = /^(www\.|m\.|music\.)?(youtube\.com|youtube-nocookie\.com)$|^youtu\.be$/i;

function parseYouTube(t) {
  if (/^youtube(\.com)?$/i.test(t)) return { kind: "youtube" };
  if (!/^(https?:\/\/)?[\w.-]*(youtube|youtu\.be)/i.test(t)) return null;
  try {
    const u = new URL(/^https?:/i.test(t) ? t : `https://${t}`);
    if (!YT_HOST.test(u.hostname)) return null;
    if (u.hostname === "youtu.be") return { kind: "youtube", v: u.pathname.slice(1) };
    const v = u.searchParams.get("v");
    if (v) return { kind: "youtube", v };
    const m = /^\/(shorts|embed|live|v)\/([\w-]{6,})/.exec(u.pathname);
    if (m) return { kind: "youtube", v: m[2] };
    const q = u.searchParams.get("search_query");
    if (q) return { kind: "youtube", q };
    return { kind: "youtube" };
  } catch { return null; }
}

function resolveInput(raw) {
  const t = String(raw || "").trim();
  if (!t) return { kind: "start" };
  const sm = /^canopy:\/\/search\?q=(.*)$/.exec(t);
  if (sm) return { kind: "search", q: decodeURIComponent(sm[1]) };
  if (/^canopy:\/\/start/.test(t)) return { kind: "start" };
  const yt = parseYouTube(t);
  if (yt) return yt;
  if (/^(https?|file):\/\//i.test(t)) return { kind: "web", url: t };
  if (!/\s/.test(t) && /^(localhost|(\d{1,3}\.){3}\d{1,3}|[\w-]+(\.[\w-]+)+)(:\d+)?([/?#]\S*)?$/i.test(t)) return { kind: "web", url: `https://${t}` };
  return { kind: "search", q: t };
}
function hostOf(url) {
  try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return url; }
}
function pageTitle(p) {
  switch (p.kind) {
    case "start": return "Start Page";
    case "search": return `${p.q} – Search`;
    case "youtube": return p.v ? "YouTube – Now Playing" : p.q ? `${p.q} – YouTube` : "YouTube";
    case "web": return hostOf(p.url);
  }
}
function pageAddress(p) {
  switch (p.kind) {
    case "start": return "";
    case "search": return `canopy://search?q=${encodeURIComponent(p.q)}`;
    case "youtube": return p.v ? `https://www.youtube.com/watch?v=${p.v}` : p.q ? `https://www.youtube.com/results?search_query=${encodeURIComponent(p.q)}` : "https://www.youtube.com";
    case "web": return p.url;
  }
}
function pageDisplay(p) {
  switch (p.kind) {
    case "start": return "";
    case "search": return p.q;
    case "youtube": return p.v ? "youtube.com/watch" : "youtube.com";
    case "web": {
      try {
        const u = new URL(p.url);
        return u.hostname.replace(/^www\./, "") + (u.pathname !== "/" ? u.pathname : "");
      } catch { return p.url; }
    }
  }
}

/* Wikipedia-backed search (CORS enabled with origin=*) */
async function webSearch(q) {
  const j = await fetchJSON(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&format=json&srlimit=10&origin=*`, {}, 8000);
  return (j.query && j.query.search || []).map((r) => ({
    title: `${r.title} – Wikipedia`,
    url: `https://en.wikipedia.org/wiki/${encodeURIComponent(r.title.replace(/ /g, "_"))}`,
    snippet: String(r.snippet || "").replace(/<[^>]+>/g, ""),
    host: "en.wikipedia.org",
  }));
}
async function searchSuggest(q) {
  const j = await fetchJSON(`https://en.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(q)}&limit=8&format=json&origin=*`, {}, 4000);
  return Array.isArray(j) && j[1] ? j[1] : [];
}

/* Best-effort YouTube search across public instances; falls back cleanly */
const PIPED_APIS = ["https://pipedapi.kavin.rocks", "https://pipedapi.adminforge.de", "https://api.piped.private.coffee"];
const INVIDIOUS_APIS = ["https://inv.nadeko.net", "https://invidious.nerdvpn.de"];
async function ytSearch(q) {
  if (q) {
    for (const base of PIPED_APIS) {
      try {
        const j = await fetchJSON(`${base}/search?q=${encodeURIComponent(q)}&filter=videos`, {}, 5000);
        const items = (j.items || []).filter((x) => x.url && x.url.includes("watch?v=")).slice(0, 20);
        if (items.length) return items.map((x) => ({
          id: x.url.split("watch?v=")[1].split("&")[0],
          title: x.title || "",
          channel: (x.uploaderName || "").replace(/^\//, ""),
          duration: x.duration > 0 ? fmtYtDur(x.duration) : "",
          views: x.views > 0 ? shortNum(x.views) + " views" : "",
          published: x.uploadedDate || "",
          thumb: `https://i.ytimg.com/vi/${x.url.split("watch?v=")[1].split("&")[0]}/hqdefault.jpg`,
        }));
      } catch {}
    }
    for (const base of INVIDIOUS_APIS) {
      try {
        const j = await fetchJSON(`${base}/api/v1/search?q=${encodeURIComponent(q)}&type=video`, {}, 5000);
        const items = (Array.isArray(j) ? j : []).filter((x) => x.videoId).slice(0, 20);
        if (items.length) return items.map((x) => ({
          id: x.videoId,
          title: x.title || "",
          channel: x.author || "",
          duration: x.lengthSeconds ? fmtYtDur(x.lengthSeconds) : "",
          views: x.viewCount ? shortNum(x.viewCount) + " views" : "",
          published: x.publishedText || "",
          thumb: `https://i.ytimg.com/vi/${x.videoId}/hqdefault.jpg`,
        }));
      } catch {}
    }
  }
  return null; // signal "couldn't search" (distinct from no results)
}
function fmtYtDur(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.round(s % 60);
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}` : `${m}:${String(sec).padStart(2, "0")}`;
}
function shortNum(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, "") + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
}
function faviconHTML(host, size) {
  const s = size || 16;
  if (!host) return `<span class="lk" style="width:${s}px;height:${s}px;align-items:center;justify-content:center;border-radius:4px;background:rgba(128,128,128,.4);font-size:${Math.max(8, s * 0.55)}px;font-weight:700">•</span>`;
  return `<img class="lk" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=64" alt="" style="width:${s}px;height:${s}px;border-radius:4px" onerror="this.outerHTML='<span class=\\'lk\\' style=\\'width:${s}px;height:${s}px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:rgba(128,128,128,.4);font-size:${Math.max(8, s * 0.55)}px;font-weight:700\\'>${esc((host[0] || "?").toUpperCase())}</span>'"/>`;
}

/* ═══ Browser app ══════════════════════════════════════════════════ */
function BrowserApp({ win, body }) {
  const mkTab = (p) => ({ id: uid(), history: [p], index: 0, title: pageTitle(p), loading: p.kind === "web", reloadKey: 0 });
  const initial = win.props.url ? resolveInput(win.props.url) : win.props.q ? { kind: "search", q: win.props.q } : win.props.yt !== undefined ? (win.props.yt ? { kind: "youtube", q: win.props.yt, autoplay: !!win.props.autoplay } : { kind: "youtube" }) : null;
  let tabs = [mkTab(initial || { kind: "start" })];
  let active = tabs[0].id;
  let editing = false;
  let addr = "";
  let sugg = [];
  let sel = -1;

  body.innerHTML = `<div class="brw">
    <div class="brw-bar" data-drag="1">
      <div class="brw-nav">
        <button data-a="back" aria-label="Back">${icon("back", 18)}</button>
        <button data-a="fwd" aria-label="Forward">${icon("fwd", 18)}</button>
        <button data-a="home" aria-label="Home">${icon("home", 17)}</button>
      </div>
      <div class="brw-addr">
        <div class="pill">
          <span class="lk" id="b-lock"></span>
          <input spellcheck="false" placeholder="Search or enter website name" aria-label="Address bar"/>
          <span class="act">
            <button data-a="star" title="Add to Favorites">${icon("star", 15)}</button>
            <button data-a="reload" title="Reload">${icon("reload", 15)}</button>
          </span>
        </div>
        <div class="brw-sugg glass glass-panel" style="display:none"></div>
      </div>
      <div class="brw-nav">
        <button data-a="ext" title="Open in your system browser">${icon("ext", 17)}</button>
        <button data-a="newtab" aria-label="New Tab">${icon("plus", 18)}</button>
      </div>
      <div class="brw-load" style="display:none"><i></i></div>
    </div>
    <div class="brw-tabs" id="b-tabs"></div>
    <div class="brw-stage" id="b-stage"></div>
  </div>`;

  const addrInput = $("input", body);
  const lockEl = $("#b-lock", body);
  const suggEl = $(".brw-sugg", body);
  const tabsEl = $("#b-tabs", body);
  const stageEl = $("#b-stage", body);
  const loadBar = $(".brw-load", body);
  const btn = (a) => $(`[data-a="${a}"]`, body);

  const tab = () => tabs.find((t) => t.id === active) || tabs[0];
  const page = () => tab().history[tab().index];
  const bookmarks = () => OS.settings.bookmarks;
  const isBookmarked = () => {
    const p = page();
    return (p.kind === "web" || p.kind === "youtube") && bookmarks().some((b) => b.url === pageAddress(p));
  };

  function record(p) {
    if (p.kind === "start") return;
    const url = pageAddress(p);
    const list = [{ title: pageTitle(p), url, at: Date.now() }, ...OS.settings.history.filter((h) => h.url !== url)].slice(0, 40);
    updateSettings({ history: list });
  }
  function navigate(id, p, replace) {
    tabs = tabs.map((t) => {
      if (t.id !== id) return t;
      const history = replace ? [...t.history.slice(0, t.index), p] : [...t.history.slice(0, t.index + 1), p];
      return { ...t, history, index: history.length - 1, title: pageTitle(p), loading: p.kind === "web" };
    });
    if (!replace) record(p);
    paintChrome();
    paintStage();
  }
  function newTab(p) {
    const t = mkTab(p || { kind: "start" });
    tabs = [...tabs, t];
    active = t.id;
    if (t.history[0].kind !== "start") record(t.history[0]);
    paintChrome();
    paintStage();
    if (!p) setTimeout(() => addrInput.focus(), 80);
  }
  function closeTab(id) {
    if (tabs.length === 1) { closeWindow(win.id); return; }
    const i = tabs.findIndex((t) => t.id === id);
    tabs = tabs.filter((t) => t.id !== id);
    if (active === id) active = tabs[Math.min(i, tabs.length - 1)].id;
    paintChrome();
    paintStage();
  }
  const back = () => { const t = tab(); if (t.index > 0) { t.index--; t.title = pageTitle(t.history[t.index]); t.loading = t.history[t.index].kind === "web"; paintChrome(); paintStage(); } };
  const fwd = () => { const t = tab(); if (t.index < t.history.length - 1) { t.index++; t.title = pageTitle(t.history[t.index]); t.loading = t.history[t.index].kind === "web"; paintChrome(); paintStage(); } };
  const reload = () => { const t = tab(); t.reloadKey++; t.loading = page().kind === "web"; paintChrome(); paintStage(); };
  const goHome = () => navigate(tab().id, { kind: "start" });
  function toggleBookmark() {
    const p = page();
    if (!(p.kind === "web" || p.kind === "youtube")) return;
    const url = pageAddress(p);
    if (isBookmarked()) updateSettings({ bookmarks: bookmarks().filter((b) => b.url !== url) });
    else updateSettings({ bookmarks: [...bookmarks(), { title: tab().title.slice(0, 28), url }] });
    notify({ title: isBookmarked() ? "Removed from Favorites" : "Added to Favorites", body: tab().title });
    paintChrome();
  }

  btn("back").onclick = back;
  btn("fwd").onclick = fwd;
  btn("home").onclick = goHome;
  btn("reload").onclick = reload;
  btn("star").onclick = toggleBookmark;
  btn("newtab").onclick = () => newTab();
  btn("ext").onclick = () => {
    const p = page();
    if (p.kind === "web" || p.kind === "youtube") window.open(pageAddress(p), "_blank", "noopener");
  };

  function submitAddr(text) {
    editing = false;
    sugg = [];
    addrInput.blur();
    navigate(tab().id, resolveInput(text));
  }
  addrInput.onfocus = () => {
    editing = true;
    const p = page();
    addr = p.kind === "web" ? p.url : p.kind === "search" ? p.q : p.kind === "youtube" ? pageAddress(p) : "";
    addrInput.value = addr;
    sel = -1;
    setTimeout(() => addrInput.select(), 0);
    paintSugg();
  };
  addrInput.onblur = () => setTimeout(() => { editing = false; paintSugg(); paintChrome(); }, 140);
  addrInput.oninput = () => {
    addr = addrInput.value;
    sel = -1;
    paintSugg();
    clearTimeout(addrInput._t);
    addrInput._t = setTimeout(async () => {
      const q = addr.trim();
      if (!q || !editing) { sugg = []; paintSugg(); return; }
      try { sugg = (await searchSuggest(q)).slice(0, 6); } catch { sugg = []; }
      paintSugg();
    }, 180);
  };
  addrInput.onkeydown = (e) => {
    const rows = suggRows();
    if (e.key === "Enter") {
      if (sel >= 0 && rows[sel]) rows[sel].run();
      else submitAddr(addr);
    } else if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(rows.length - 1, sel + 1); paintSugg(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(-1, sel - 1); paintSugg(); }
    else if (e.key === "Escape") { editing = false; addrInput.blur(); }
  };

  function suggRows() {
    const rows = [];
    if (!editing || !addr.trim()) return rows;
    const r = resolveInput(addr);
    rows.push({ label: r.kind === "search" ? `Search for “${addr.trim()}”` : `Go to ${addr.trim()}`, icon: icon("search", 14), run: () => submitAddr(addr) });
    sugg.forEach((s) => rows.push({ label: s, icon: icon("search", 14), run: () => submitAddr(s) }));
    bookmarks()
      .filter((b) => b.title.toLowerCase().includes(addr.toLowerCase()) || b.url.includes(addr.toLowerCase()))
      .slice(0, 3)
      .forEach((b) => rows.push({ label: `${b.title} — ${hostOf(b.url)}`, icon: iconFill("star", 13), run: () => submitAddr(b.url) }));
    return rows;
  }
  function paintSugg() {
    const rows = suggRows();
    if (!rows.length) { suggEl.style.display = "none"; return; }
    suggEl.style.display = "";
    suggEl.innerHTML = "";
    rows.forEach((r, i) => {
      const b = el("button", "row" + (i === sel ? " sel" : ""));
      b.innerHTML = `<span style="width:16px;display:flex;justify-content:center;opacity:.7">${r.icon}</span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.label)}</span>`;
      b.onmousedown = (e) => { e.preventDefault(); r.run(); };
      suggEl.appendChild(b);
    });
  }

  /* chrome */
  function paintChrome() {
    const t = tab();
    const p = page();
    tabsEl.innerHTML = "";
    for (const tt of tabs) {
      const tp = tt.history[tt.index];
      const b = el("div", "brw-tab" + (tt.id === active ? " on" : ""));
      b.style.animation = "popIn .25s both";
      b.innerHTML = `${tp.kind === "web" ? faviconHTML(hostOf(tp.url), 14) : tp.kind === "youtube" ? `<span style="display:flex">${icon("play", 12)}</span>` : tp.kind === "search" ? `<span style="display:flex">${icon("search", 13)}</span>` : `<span style="display:flex;color:#34d399">${icon("leaf", 13)}</span>`}
        <span class="tt">${esc(tt.title)}</span><button class="x" aria-label="Close tab">✕</button>`;
      b.onclick = () => { active = tt.id; paintChrome(); paintStage(); };
      $(".x", b).onclick = (e) => { e.stopPropagation(); closeTab(tt.id); };
      tabsEl.appendChild(b);
    }
    const plus = el("button", "brw-newtab", "+");
    plus.onclick = () => newTab();
    tabsEl.appendChild(plus);

    addrInput.value = editing ? addr : pageDisplay(p);
    lockEl.innerHTML = p.kind === "web" ? icon("lock", 13) : icon("search", 13);
    btn("back").disabled = t.index === 0;
    btn("fwd").disabled = t.index >= t.history.length - 1;
    btn("ext").disabled = !(p.kind === "web" || p.kind === "youtube");
    btn("ext").style.opacity = btn("ext").disabled ? .3 : "";
    btn("star").classList.toggle("on", isBookmarked());
    loadBar.style.display = t.loading ? "" : "none";
  }

  /* stage pages */
  function paintStage() {
    const t = tab();
    const p = page();
    stageEl.innerHTML = "";
    const holder = el("div", "brw-page");
    stageEl.appendChild(holder);

    if (p.kind === "start") return paintStart(holder);
    if (p.kind === "search") return paintSearch(holder, t, p);
    if (p.kind === "youtube") return paintYouTube(holder, t, p);
    if (p.kind === "web") return paintWeb(holder, t, p);
  }

  function paintStart(root) {
    const h = new Date().getHours();
    const greet = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    root.innerHTML = `
      <div class="start-bg" style="${wallpaperCSS(OS.settings.wallpaper)}"></div>
      <div class="start-wrap">
        <div class="start-greet">${esc(greet)}, ${esc(OS.user ? OS.user.name.split(" ")[0] : "there")}</div>
        <div class="start-h">Where to?</div>
        <form class="start-form glass glass-dark glass-sheen">
          <span style="opacity:.7;display:flex"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.8"/><path d="M10.6 10.6L14 14"/></svg></span>
          <input placeholder="Search the web or enter a website"/>
          <button type="button" class="start-fern">Ask Fern</button>
        </form>
        <div class="start-sec"><div class="cap">Favorites</div><div class="fav-grid" id="st-favs"></div></div>
        <div class="start-sec" id="st-recent-sec"><div class="cap">Recently visited</div><div class="recent-grid" id="st-recent"></div></div>
      </div>`;
    const input = $("input", root);
    $("form", root).onsubmit = (e) => { e.preventDefault(); if (input.value.trim()) navigate(tab().id, resolveInput(input.value)); };
    $(".start-fern", root).onclick = () => openFern(input.value || undefined);
    const favs = $("#st-favs", root);
    bookmarks().forEach((b, i) => {
      const f = el("button", "fav-item");
      f.style.animation = `slideUp .5s ${0.15 + i * 0.04}s both`;
      f.innerHTML = `<span class="tile glass glass-dark">${faviconHTML(hostOf(b.url), 34)}</span><span class="nm">${esc(b.title)}</span>`;
      f.onclick = () => navigate(tab().id, resolveInput(b.url));
      favs.appendChild(f);
    });
    const rec = $("#st-recent", root);
    const recent = OS.settings.history.slice(0, 6);
    if (!recent.length) $("#st-recent-sec", root).style.display = "none";
    for (const r of recent) {
      const b = el("button", "recent-item glass glass-dark");
      b.innerHTML = `${faviconHTML(r.url.startsWith("canopy") ? "" : hostOf(r.url), 20)}<span style="min-width:0"><span class="t">${esc(r.title)}</span><span class="u">${esc(r.url.startsWith("canopy") ? "Canopy Search" : hostOf(r.url))}</span></span>`;
      b.onclick = () => navigate(tab().id, resolveInput(r.url));
      rec.appendChild(b);
    }
  }

  function skel(root, n) {
    root.innerHTML = Array.from({ length: n }, () => `<div class="skel"><i class="a"></i><i class="b"></i><i class="c"></i></div>`).join("");
  }

  function paintSearch(root, t, p) {
    const q = p.q;
    const videos = p.tab === "videos";
    root.innerHTML = `
      <div class="srch-head">
        <div class="srch-row">
          <div class="srch-brand"><span class="leaf">${icon("leaf", 18)}</span>Canopy</div>
          <form class="pill-search">
            <input value="${esc(q)}"/>
            <button type="submit" style="display:flex;opacity:.6">${icon("search", 15)}</button>
          </form>
          <button class="btn" id="sp-fern">Ask Fern</button>
        </div>
        <div class="srch-tabs">
          <button type="button" id="sp-web">Search the web ↗</button>
          <button data-t="all" class="${!videos ? "on" : ""}">All</button>
          <button data-t="videos" class="${videos ? "on" : ""}">Videos</button>
        </div>
      </div>
      <div class="srch-body selectable" id="sp-body"></div>`;
    $("form", root).onsubmit = (e) => { e.preventDefault(); navigate(tab().id, { kind: "search", q: $("input", root).value.trim(), tab: videos ? "videos" : "all" }); };
    $("#sp-fern", root).onclick = () => openFern(q);
    $("#sp-web", root).onclick = () => window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, "_blank", "noopener");
    $$(".srch-tabs button[data-t]", root).forEach((b) => {
      b.onclick = () => navigate(tab().id, { kind: "search", q, tab: b.dataset.t }, true);
    });
    const out = $("#sp-body", root);
    if (!videos) {
      skel(out, 5);
      webSearch(q).then((results) => {
        if (t.id !== active || page().q !== q) return;
        if (!results.length) {
          out.innerHTML = `<div class="center-note" style="padding:60px 0"><span style="display:inline-flex">${icon("globe", 40)}</span>
            <div style="font-size:17px;font-weight:600;margin-top:12px;color:var(--fg)">No results for “${esc(q)}”</div>
            <div style="margin-top:4px">Check your spelling or try different keywords.</div>
            <div class="extrow" style="justify-content:center">
              <button class="btn" id="sp-g">Search Google instead</button>
              <button class="btn" id="sp-y">Search YouTube instead</button>
            </div></div>`;
          $("#sp-g", out).onclick = () => window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, "_blank", "noopener");
          $("#sp-y", out).onclick = () => navigate(tab().id, { kind: "youtube", q });
          return;
        }
        out.innerHTML = `<div class="srch-count">${results.length} results · from Wikipedia</div>` + results.map((r, i) => `
          <div class="sres" style="animation-delay:${Math.min(i, 8) * 0.04}s">
            <div class="host">${faviconHTML(r.host, 16)}<span>${esc(r.host)}</span></div>
            <button class="go">${esc(r.title)}</button>
            ${r.snippet ? `<div class="sn">${esc(r.snippet)}</div>` : ""}
          </div>`).join("") + `
          <div class="extrow"><span style="font-size:12px;color:var(--fg2);align-self:center">Canopy search uses Wikipedia on this device. Need more?</span>
            <button class="btn" id="sp-g2">Search Google ↗</button></div>`;
        $$(".sres", out).forEach((n, i) => {
          $(".go", n).onclick = () => navigate(tab().id, resolveInput(results[i].url));
        });
        $("#sp-g2", out).onclick = () => window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, "_blank", "noopener");
      }).catch(() => {
        out.innerHTML = `<div class="center-note" style="padding:60px 0">Wikipedia results are unavailable right now. Use Search the web above or check your connection.</div>`;
      });
    } else {
      const grid = el("div");
      grid.className = "vgrid";
      out.appendChild(grid);
      skel(grid, 6);
      ytSearch(q).then((vids) => {
        if (t.id !== active || page().q !== q) return;
        grid.innerHTML = "";
        if (!vids || !vids.length) {
          out.innerHTML = `<div class="center-note" style="padding:50px 0">Couldn't load videos right now.
            <div class="extrow" style="justify-content:center"><button class="btn" id="sp-yt">Open YouTube results in a new window ↗</button></div></div>`;
          const b = $("#sp-yt", out);
          if (b) b.onclick = () => window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`, "_blank", "noopener");
          return;
        }
        for (const v of vids.slice(0, 18)) grid.appendChild(videoCard(v, () => navigate(tab().id, { kind: "youtube", v: v.id, q })));
      });
    }
  }

  function videoCard(v, onClick, compact) {
    const b = el("button", "vcard" + (compact ? " vrow" : ""));
    b.innerHTML = `
      <div class="th"><img src="${v.thumb}" alt="" loading="lazy"/>${v.duration ? `<span class="du">${esc(v.duration)}</span>` : ""}</div>
      <div style="${compact ? "min-width:0;flex:1" : ""}">
        <div class="vt">${esc(v.title)}</div>
        <div class="vc">${esc(v.channel)}</div>
        <div class="vm">${esc([v.views, v.published].filter(Boolean).join(" · "))}</div>
      </div>`;
    b.onclick = onClick;
    return b;
  }

  function paintYouTube(root, t, p) {
    const q = p.q || "";
    root.innerHTML = `
      <div class="yt-head">
        <button class="yt-brand"><span class="badge"><svg width="12" height="12" viewBox="0 0 12 12" fill="#fff"><path d="M2 1l9 5-9 5z"/></svg></span><span class="nm">YouTube</span></button>
        <form class="pill-search">
          <input placeholder="Search YouTube" value="${esc(q)}"/>
          <button type="submit" style="display:flex;opacity:.6">${icon("search", 15)}</button>
        </form>
      </div>
      <div class="yt-body" id="yt-body"></div>`;
    $("form", root).onsubmit = (e) => { e.preventDefault(); navigate(tab().id, { kind: "youtube", q: $("input", root).value.trim(), v: undefined }); };
    $(".yt-brand", root).onclick = () => navigate(tab().id, { kind: "youtube" });
    const out = $("#yt-body", root);

    if (p.v) {
      const canEmbed = location.protocol !== "file:";
      out.innerHTML = `<div class="yt-watch">
        <div class="yt-main">
          <div class="yt-player" id="yt-player">${canEmbed
            ? `<iframe src="https://www.youtube-nocookie.com/embed/${esc(p.v)}?autoplay=1&rel=0&playsinline=1&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen; clipboard-write; web-share" allowfullscreen title="YouTube player"></iframe>`
            : `<button id="yt-open-big" style="position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000" title="Watch on YouTube">
                 <img src="https://i.ytimg.com/vi/${esc(p.v)}/maxresdefault.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75" onerror="this.style.display='none'"/>
                 <span style="position:relative;display:flex;align-items:center;justify-content:center;width:72px;height:50px;border-radius:14px;background:#ff0033;box-shadow:0 10px 30px rgba(0,0,0,.5)"><svg width="24" height="24" viewBox="0 0 12 12" fill="#fff"><path d="M2 1l9 5-9 5z"/></svg></span>
               </button>`}
          </div>
          <div class="yt-meta"><span id="yt-t">Now playing</span>${canEmbed ? `<span style="opacity:.7">Video blocked? </span><a href="https://www.youtube.com/watch?v=${esc(p.v)}" target="_blank" rel="noreferrer">Watch on YouTube ↗</a>` : `<a href="https://www.youtube.com/watch?v=${esc(p.v)}" target="_blank" rel="noreferrer">Watch on YouTube ↗</a>`}</div>
        </div>
        <div class="yt-side"><div class="cap" id="yt-cap">${q ? `More for “${esc(q)}”` : "Up next"}</div><div id="yt-list"></div></div>
      </div>`;
      if (!canEmbed) {
        const big = $("#yt-open-big", out);
        if (big) big.onclick = () => window.open(`https://www.youtube.com/watch?v=${p.v}`, "_blank", "noopener");
      }
      const list = $("#yt-list", out);
      skel(list, 5);
      ytSearch(q).then((vids) => {
        if (t.id !== active) return;
        list.innerHTML = "";
        if (!vids) { list.innerHTML = `<div class="center-note">Search is unavailable, but playback works. Open a YouTube link or paste a URL above.</div>`; return; }
        const others = vids.filter((v) => v.id !== p.v).slice(0, 14);
        if (!others.length) { list.innerHTML = `<div class="center-note">No more results.</div>`; return; }
        for (const v of others) list.appendChild(videoCard(v, () => navigate(tab().id, { kind: "youtube", q, v: v.id }), true));
        const cur = vids.find((v) => v.id === p.v);
        if (cur) { const tt = $("#yt-t", out); if (tt) tt.textContent = cur.title; }
      });
    } else {
      out.innerHTML = `<div class="yt-grid-title">${q ? `Results for “${esc(q)}”` : "Trending"}</div><div class="vgrid" id="yt-grid"></div>`;
      const grid = $("#yt-grid", out);
      skel(grid, 8);
      if (!q) {
        // trending: try piped trending endpoint, else prompt
        let got = null;
        (async () => {
          for (const base of PIPED_APIS) {
            try {
              const j = await fetchJSON(`${base}/trending?region=US`, {}, 5000);
              const items = (j || []).filter((x) => x.url && x.url.includes("watch?v=")).slice(0, 24);
              if (items.length) {
                got = items.map((x) => ({
                  id: x.url.split("watch?v=")[1].split("&")[0],
                  title: x.title || "", channel: (x.uploaderName || "").replace(/^\//, ""),
                  duration: x.duration > 0 ? fmtYtDur(x.duration) : "",
                  views: x.views > 0 ? shortNum(x.views) + " views" : "",
                  published: x.uploadedDate || "",
                  thumb: `https://i.ytimg.com/vi/${x.url.split("watch?v=")[1].split("&")[0]}/hqdefault.jpg`,
                }));
                break;
              }
            } catch {}
          }
          if (t.id !== active) return;
          grid.innerHTML = "";
          if (!got) {
            out.innerHTML = `<div class="center-note" style="padding:60px 0">Couldn't load trending videos right now. Search above, or open YouTube in a new window.
              <div class="extrow" style="justify-content:center"><button class="btn" id="yt-open">Open YouTube ↗</button></div></div>`;
            $("#yt-open", out).onclick = () => window.open("https://www.youtube.com", "_blank", "noopener");
            return;
          }
          for (const v of got) grid.appendChild(videoCard(v, () => navigate(tab().id, { kind: "youtube", v: v.id })));
        })();
      } else {
        ytSearch(q).then((vids) => {
          if (t.id !== active || page().q !== q) return;
          grid.innerHTML = "";
          if (!vids || !vids.length) {
            out.innerHTML = `<div class="center-note" style="padding:60px 0">Couldn't load videos right now.
              <div class="extrow" style="justify-content:center"><button class="btn" id="yt-open2">Open YouTube results ↗</button></div></div>`;
            $("#yt-open2", out).onclick = () => window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(q)}`, "_blank", "noopener");
            return;
          }
          if (p.autoplay && vids[0]) { navigate(tab().id, { kind: "youtube", q, v: vids[0].id }, true); return; }
          for (const v of vids.slice(0, 24)) grid.appendChild(videoCard(v, () => navigate(tab().id, { kind: "youtube", q, v: v.id })));
        });
      }
    }
  }

  function paintWeb(root, t, p) {
    root.innerHTML = `<iframe class="brw-frame" src="${esc(p.url)}" referrerpolicy="no-referrer" title="${esc(t.title)}" allowfullscreen></iframe>`;
    const frame = $(".brw-frame", root);
    frame.onload = () => { t.loading = false; paintChrome(); };
    const note = el("div", "brw-frame-note glass glass-panel");
    note.innerHTML = `<span>Site not loading? Some sites refuse to appear inside another app.</span><button>Open in a new window ↗</button>`;
    $("button", note).onclick = () => window.open(p.url, "_blank", "noopener");
    root.appendChild(note);
    // Keep the escape hatch visible: cross-origin frame failures are not reliably detectable.
  }

  paintChrome();
  paintStage();
  if (initial) record(initial);

  return {
    update(props) {
      const p = props.url ? resolveInput(props.url) : props.q !== undefined && props.q !== null && props.q !== false ? { kind: "search", q: props.q } : props.yt !== undefined ? (props.yt ? { kind: "youtube", q: props.yt, autoplay: !!props.autoplay } : { kind: "youtube" }) : null;
      if (p) {
        if (props.newTab) newTab(p);
        else navigate(tab().id, p);
      } else if (props.newTab) newTab();
    },
    destroy() {},
  };
}

/* ── Launchpad and notification history ──────────────────────────── */
function toggleLauncher(force) {
  const root = $("#overlayroot"); if (!root) return;
  const open = !!$("#launcher", root);
  const want = force === undefined ? !open : force;
  root.innerHTML = "";
  if (!want) return;
  const panel = el("div"); panel.id = "launcher";
  panel.innerHTML = `<div class="launch-wrap"><div class="launch-head"><h1>Applications</h1><input class="field" placeholder="Search apps" aria-label="Search apps"><button class="btn" aria-label="Close Launchpad">Close</button></div><div class="launch-grid"></div></div>`;
  root.appendChild(panel);
  const input = $("input", panel), grid = $(".launch-grid", panel);
  $("button", panel).onclick = () => toggleLauncher(false);
  function paint() {
    grid.innerHTML = "";
    const apps = Object.keys(APPS).filter(id => APPS[id].name.toLowerCase().includes(input.value.toLowerCase().trim()));
    apps.forEach(id => {
      const b = el("button", "launch-app");
      b.innerHTML = `<span>${appIconSVG(id)}</span><span>${esc(APPS[id].name)}</span>`;
      b.onclick = () => { toggleLauncher(false); openApp(id); };
      grid.appendChild(b);
    });
    if (!apps.length) grid.innerHTML = `<p>No matching apps</p>`;
  }
  input.oninput = paint;
  input.onkeydown = e => { if (e.key === "Enter") { const first = $(".launch-app", grid); if (first) first.click(); } };
  paint(); input.focus();
}
function toggleNotifications(force) {
  const root = $("#overlayroot"); if (!root || !OS.user) return;
  const open = !!$("#notification-center", root), want = force === undefined ? !open : force;
  root.innerHTML = ""; if (!want) return;
  const panel = el("div", "glass glass-panel"); panel.id = "notification-center";
  root.appendChild(panel);
  function paint() {
    const items = store.get("notifications." + OS.user.id, []);
    panel.innerHTML = `<div class="nc-head"><strong>Notifications</strong><span><button class="btn" data-clear>Clear all</button> <button class="btn" data-close aria-label="Close notifications">×</button></span></div><div class="nc-list"></div>`;
    $("[data-clear]", panel).onclick = () => { store.set("notifications." + OS.user.id, []); paint(); };
    $("[data-close]", panel).onclick = () => toggleNotifications(false);
    const list = $(".nc-list", panel);
    if (!items.length) list.innerHTML = `<div class="center-note" style="padding:28px 0">No notifications</div>`;
    items.forEach(item => {
      const row = el("div", "nc-item");
      row.innerHTML = `<strong>${esc(item.title)}</strong><p>${esc(item.body || "")}</p><small>${esc(new Date(item.time).toLocaleString())}</small><div style="display:flex;gap:8px;margin-top:8px">${item.app && APPS[item.app] ? '<button class="btn" data-open>Open</button>' : ''}<button class="btn" data-remove>Dismiss</button></div>`;
      const go = $("[data-open]", row); if (go) go.onclick = () => { toggleNotifications(false); openApp(item.app); };
      $("[data-remove]", row).onclick = () => { store.set("notifications." + OS.user.id, items.filter(x => x.id !== item.id)); paint(); };
      list.appendChild(row);
    });
  }
  paint();
}

/* ── Reminders ──────────────────────────────────────────────────── */
function RemindersApp({ body }) {
  let filter = "all";
  const key = "reminders." + OS.user.id;
  const all = () => store.get(key, []);
  const save = items => { store.set(key, items); bus.emit("reminders"); };
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
  body.innerHTML = `<div class="reminder-layout"><aside class="reminder-sidebar" data-drag="1"><div class="side-head">Reminders</div><div class="reminder-filters"></div></aside><main class="reminder-main"><header class="reminder-head" data-drag="1">Reminders</header><div class="reminder-content thin-scroll"><h1></h1><div class="reminder-sub"></div><form class="reminder-form"><input class="field" type="text" placeholder="New reminder" aria-label="New reminder" required maxlength="200"><input class="field" type="date" aria-label="Due date"><button class="btn btn-primary" type="submit">Add</button></form><div class="reminder-list"></div></div></main></div>`;
  const filters = $(".reminder-filters", body), list = $(".reminder-list", body), form = $("form", body);
  form.onsubmit = e => {
    e.preventDefault(); const title = $("input[type=text]", form).value.trim(), date = $("input[type=date]", form).value;
    if (!title) return;
    save([{id:uid(), title, date, done:false, created:Date.now()}, ...all()]);
    form.reset(); $("input[type=text]", form).focus();
  };
  function paint() {
    const items = all();
    const choices = [["all", "All", items.filter(x => !x.done).length], ["today", "Today", items.filter(x => !x.done && x.date === today()).length], ["scheduled", "Scheduled", items.filter(x => !x.done && x.date).length], ["completed", "Completed", items.filter(x => x.done).length]];
    filters.innerHTML = "";
    choices.forEach(([id, label, count]) => { const b = el("button", "side-item" + (id === filter ? " on" : "")); b.innerHTML = `<span>${esc(label)}</span><span class="cnt">${count}</span>`; b.onclick = () => { filter = id; paint(); }; filters.appendChild(b); });
    $("h1", body).textContent = choices.find(x => x[0] === filter)[1];
    const visible = items.filter(x => filter === "completed" ? x.done : !x.done && (filter === "all" || (filter === "today" ? x.date === today() : !!x.date)));
    $(".reminder-sub", body).textContent = `${visible.length} reminder${visible.length === 1 ? "" : "s"} · stored on this device`;
    list.innerHTML = "";
    if (!visible.length) list.innerHTML = `<div class="center-note" style="padding:35px 0">Nothing here yet.</div>`;
    visible.forEach(item => {
      const row = el("div", "reminder-row" + (item.done ? " done" : ""));
      row.innerHTML = `<input type="checkbox" aria-label="Mark ${esc(item.title)} ${item.done ? 'incomplete' : 'complete'}" ${item.done ? 'checked' : ''}><div class="rt"><span>${esc(item.title)}</span>${item.date ? `<small>${item.date < today() && !item.done ? 'Overdue · ' : ''}${esc(new Date(item.date + 'T12:00:00').toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'}))}</small>` : ''}</div><button class="icon-btn" aria-label="Delete reminder" title="Delete reminder">${icon("trash", 16)}</button>`;
      $("input", row).onchange = e => save(all().map(x => x.id === item.id ? {...x, done:e.target.checked} : x));
      $("button", row).onclick = () => save(all().filter(x => x.id !== item.id));
      list.appendChild(row);
    });
  }
  const off = bus.on("reminders", paint); paint();
  return {update(){paint();}, destroy(){off();}};
}

/* ── Activity Monitor: browser-visible information only ─────────── */
function MonitorApp({ body }) {
  let alive = true, usage = null;
  body.innerHTML = `<div class="app-col"><div class="main-head" data-drag="1" style="padding-left:85px">Activity Monitor</div><div class="main-scroll thin-scroll" style="padding:24px"><h1 style="margin:0;font-size:25px">Your workspace</h1><p style="color:var(--fg2)">A view of this CanopyOS session and browser storage.</p><div class="monitor-grid"></div><div style="display:flex;align-items:center;justify-content:space-between"><h3>Open windows</h3><button class="btn" data-refresh>Refresh</button></div><div class="monitor-windows"></div><p style="color:var(--fg2);font-size:12px">System-wide CPU, memory and processes are not available to a web app.</p></div></div>`;
  const grid = $(".monitor-grid", body), list = $(".monitor-windows", body);
  function paint() {
    if (!alive) return;
    const wins = OS.windows.filter(w => !w.closing);
    const storage = usage ? `${(usage.usage / 1048576).toFixed(1)} MB` : "Unavailable";
    grid.innerHTML = [["Open windows", wins.length],["Connection", navigator.onLine ? "Online" : "Offline"],["Browser storage", storage]].map(([label,value]) => `<div class="monitor-card"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`).join("");
    list.innerHTML = "";
    wins.forEach(w => { const row = el("div", "monitor-row"); row.innerHTML = `<span style="width:32px;height:32px">${appIconSVG(w.app)}</span><span style="flex:1">${esc(w.title)}<small style="display:block;color:var(--fg2)">${w.minimized ? 'Minimized' : w.maximized ? 'Full screen' : 'Open'}</small></span><button class="btn">Show</button>`; $("button", row).onclick = () => restoreWindow(w.id); list.appendChild(row); });
  }
  async function refresh() { try { usage = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null; } catch { usage = null; } paint(); }
  $("[data-refresh]", body).onclick = refresh;
  const off = bus.on("windows", paint);
  window.addEventListener("online", paint); window.addEventListener("offline", paint);
  refresh();
  return { update(){refresh();}, destroy(){ alive=false; off(); window.removeEventListener("online", paint); window.removeEventListener("offline", paint); } };
}

/* ═══ App registry ═════════════════════════════════════════════════ */
const AppViews = {
  finder: FinderApp,
  fern: FernApp,
  browser: BrowserApp,
  photos: PhotosApp,
  notes: NotesApp,
  reminders: RemindersApp,
  monitor: MonitorApp,
  calendar: CalendarApp,
  calculator: CalculatorApp,
  clock: ClockApp,
  weather: WeatherApp,
  terminal: TerminalApp,
  settings: SettingsApp,
};

/* ═══ Boot ═════════════════════════════════════════════════════════ */
function initOS() {
  document.documentElement.dataset.theme = "dark";
  wireBus();
  // power-on button + off-screen logo
  const offBtn = document.getElementById("off-btn");
  if (offBtn) offBtn.onclick = () => { setPhase("boot"); startBoot(); };
  const offLogo = document.getElementById("off-logo");
  if (offLogo) offLogo.appendChild(makeLogo(26, true));
  setPhase("boot");
  startBoot();
  wireGlobal();
  setInterval(() => { if (OS.phase === "desktop" && OS.settings.wallpaper === "weather") refreshLiveWeather(); }, 15 * 60 * 1000);
}
window.addEventListener("error", (e) => {
  console.warn("Caught:", e.message);
});
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initOS);
else initOS();

</script>
