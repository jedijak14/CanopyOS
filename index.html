  snd.appendChild(vol);
  node.appendChild(snd);

  const acts = el("div", "cc-actions");
  const fern = el("button", "cc-act");
  fern.innerHTML = `<span class="aic">${makeOrb(32, "idle").outerHTML}</span>Ask Fern`;
  fern.onclick = () => { toggleCC(false); openFern(); };
  acts.appendChild(fern);
  const setb = el("button", "cc-act");
  setb.innerHTML = `<span class="aic" style="display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(128,128,128,.4);color:#fff">${icon("gear", 16)}</span>Settings`;
  setb.onclick = () => { toggleCC(false); openApp("settings"); };
  acts.appendChild(setb);
  node.appendChild(acts);

  function paintCC() {
    const want = OS.cc;
    toggleCC(false);
    if (want) { OS.cc = true; toggleCC(true); }
  }
  // simpler: rebuild once on toggle clicks
  node._paint = () => { root.innerHTML = ""; if (OS.cc) toggleCC(true); };

  root.appendChild(node);
  // patch tile toggles to repaint
  node.onclick = (e) => {
    const t = e.target.closest(".cc-tile");
    if (t) setTimeout(() => { root.innerHTML = ""; toggleCC(true); }, 0);
  };
}

/* ── widgets ─────────────────────────────────────────────────────── */
function renderWidgets() {
  const w = $("#wgts");
  if (!w) return;
  w.style.top = MENUBAR_H + 14 + "px";
  const now = new Date();
  const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
  const evs = OS.settings.events.filter((e) => e.date === today).slice(0, 2);
  w.innerHTML = `
    <button class="wgt glass glass-dark" id="wgt-cal">
      <div class="wd">${esc(now.toLocaleDateString([], { weekday: "long" }))}</div>
      <div class="dn">${now.getDate()}</div>
      <div class="ev">${evs.length ? esc(evs.map((e) => e.title).join(", ")) : "No events today"}</div>
    </button>
    <button class="wgt glass glass-dark" id="wgt-wx">
      <div class="wrow"><div><div class="wn">${esc(OS.settings.city.name.split(",")[0])}</div><div class="wt" id="wgt-temp">–</div></div><div class="wi" id="wgt-ico"></div></div>
      <div class="wl" id="wgt-sub">Loading…</div>
    </button>`;
  $("#wgt-cal").onclick = () => openApp("calendar");
  $("#wgt-wx").onclick = () => openApp("weather");
  const paint = (d) => {
    const t = $("#wgt-temp"), i = $("#wgt-ico"), s = $("#wgt-sub");
    if (!t || !d) return;
    const hi = Math.round(d.daily.temperature_2m_max[0]);
    const lo = Math.round(d.daily.temperature_2m_min[0]);
    const code = d.current.weather_code;
    t.textContent = Math.round(d.current.temperature_2m) + "°";
    i.innerHTML = weatherGlyph(code, 30);
    s.textContent = `${weatherTitle(code)} · H ${hi}° L ${lo}°`;
  };
  fetchWeather(OS.settings.city.lat, OS.settings.city.lon).then(paint).catch(() => {
    const s = $("#wgt-sub"); if (s) s.textContent = "Weather unavailable";
  });
}

/* ── toasts render ───────────────────────────────────────────────── */
function renderToasts() {
  const root = $("#toastroot");
  if (!root) return;
  root.innerHTML = "";
  const t = el("div");
  t.id = "toasts";
  t.style.top = MENUBAR_H + 10 + "px";
  for (const toast of OS.toasts) {
    const b = el("button", "toast glass glass-panel");
    const ic = el("div", "aic");
    if (toast.app && APPS[toast.app]) ic.innerHTML = appIconSVG(toast.app);
    else { ic.className = "aic plain"; }
    b.appendChild(ic);
    const bd = el("div");
    bd.style.minWidth = "0";
    bd.innerHTML = `<div class="t">${esc(toast.title)}</div>${toast.body ? `<div class="b">${esc(toast.body)}</div>` : ""}`;
    b.appendChild(bd);
    b.onclick = () => { dismissToast(toast.id); if (toast.app) openApp(toast.app); };
    t.appendChild(b);
  }
  root.appendChild(t);
}

/* ── desktop context menu ────────────────────────────────────────── */
function showContextMenu(x, y) {
  const old = $("#ctxmenu");
  if (old) old.remove();
  const nextWall = () => {
    const idx = WALLPAPERS.findIndex((w) => w.id === OS.settings.wallpaper);
    updateSettings({ wallpaper: WALLPAPERS[(idx + 1) % WALLPAPERS.length].id });
  };
  const items = [
    { label: "Launchpad", run: () => toggleLauncher(true) },
    { label: "New Reminder", run: () => openApp("reminders") },
    { label: "New Note", run: () => openApp("notes", { newNote: true }) },
    { label: "Open Terminal", run: () => openApp("terminal") },
    { label: "Ask Fern…", run: () => openFern() },
    { label: "Change Wallpaper…", run: () => openApp("settings", { section: "wallpaper" }) },
    { label: "Next Wallpaper", run: nextWall },
  ];
  const m = el("div", "glass glass-panel");
  m.id = "ctxmenu";
  m.style.left = Math.min(x, window.innerWidth - 220) + "px";
  m.style.top = Math.min(y, window.innerHeight - 200) + "px";
  m.style.animation = "popIn .15s both";
  for (const it of items) {
    const b = el("button", "menu-item", esc(it.label));
    b.onclick = () => { m.remove(); it.run(); };
    m.appendChild(b);
  }
  document.body.appendChild(m);
}

/* ── global keyboard + pointer wiring ────────────────────────────── */
function wireGlobal() {
  window.addEventListener("keydown", (e) => {
    if (OS.phase !== "desktop") return;
    // Fern summon: Alt+Space works anywhere
    if (e.altKey && e.code === "Space") {
      e.preventDefault();
      const w = OS.windows.find((x) => x.app === "fern" && !x.closing);
      if (w) closeFern();
      else openFern();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.code === "Space") {
      e.preventDefault();
      toggleSpotlight();
      return;
    }
    if (e.ctrlKey && e.shiftKey && e.code === "KeyF" && OS.activeId) { e.preventDefault(); toggleMaximize(OS.activeId); return; }
    if (e.ctrlKey && e.shiftKey && e.code === "KeyA") { e.preventDefault(); toggleLauncher(); return; }
    if (e.ctrlKey && e.altKey && (e.code === "ArrowLeft" || e.code === "ArrowRight") && OS.activeId) { e.preventDefault(); tileWindow(OS.activeId, e.code === "ArrowLeft" ? "left" : "right"); return; }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.code === "KeyM" && OS.activeId) { e.preventDefault(); minimizeWindow(OS.activeId); return; }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.code === "KeyW" && OS.activeId) { e.preventDefault(); closeWindow(OS.activeId); return; }
    if (e.ctrlKey && e.shiftKey && e.code === "KeyN") { e.preventDefault(); openApp("notes", {newNote:true}); return; }
    if (e.key === "Escape") {
      if ($("#launcher")) toggleLauncher(false);
      if ($("#notification-center")) toggleNotifications(false);
      if (OS.spotlight) { toggleSpotlight(false); }
      if (OS.cc) { toggleCC(false); }
      const cm = $("#ctxmenu"); if (cm) cm.remove();
    }
  });
  window.addEventListener("resize", fitWindowsToViewport);
  window.addEventListener("mousedown", (e) => {
    const cm = $("#ctxmenu");
    if (cm && !cm.contains(e.target)) cm.remove();
    if (OS.cc) {
      const ccn = $("#cc");
      if (ccn && !ccn.contains(e.target) && !e.target.closest('[aria-label="Control Center"]')) toggleCC(false);
    }
    if (menubarOpen) {
      const bar = $("#menubar");
      if (bar && !bar.contains(e.target)) closeMenus();
    }
  });
  // liquid glass specular tracking
  window.addEventListener("pointermove", (e) => {
    const g = e.target && e.target.closest ? e.target.closest(".glass") : null;
    if (!g) return;
    const r = g.getBoundingClientRect();
    g.style.setProperty("--mx", e.clientX - r.left + "px");
    g.style.setProperty("--my", e.clientY - r.top + "px");
  }, { passive: true });
  // desktop context menu + click-through (delegated — works regardless of mount order)
  document.addEventListener("contextmenu", (e) => {
    const hit = e.target && e.target.closest && e.target.closest("#desk-hit");
    if (!hit) return;
    e.preventDefault();
    showContextMenu(e.clientX, e.clientY);
  });
  document.addEventListener("click", (e) => {
    if (e.target && e.target.id === "desk-hit") {
      const cm = $("#ctxmenu"); if (cm) cm.remove();
    }
  });
  // dim overlay
  bus.on("settings", () => {
    const dim = $("#dim");
    if (dim) dim.style.opacity = Math.max(0, (100 - OS.settings.brightness) / 100) * 0.7;
  });
  const dim = $("#dim");
  if (dim) dim.style.opacity = Math.max(0, (100 - OS.settings.brightness) / 100) * 0.7;
}

/* ═══ P ═══ shell bootstrapping happens in boot.js ═══ */
/* global subscriptions (wired once from initOS in apps2.js) */
function wireBus() {
  bus.on("windows", () => rerenderWindows());
  bus.on("active", () => updateMenubarApp());
  bus.on("settings", (patch) => {
    if (!patch) return;
    if (patch.wallpaper || patch.city) {
      refreshWallpaper();
      if (OS.settings.wallpaper === "weather") refreshLiveWeather();
    }
    if (patch.wallpaper || patch.city || patch.events || patch.dockSize || patch.magnify || patch.magnifyAmount) {
      if (OS.phase === "desktop") { renderWidgets(); renderDock(); }
    }
  });
  bus.on("user", () => { if (OS.phase === "desktop") renderDesktop(); });
}

</script>
<script>
/* ════════════════════════════════════════════════════════════════════
   fern.js — Fern's brain (local command handling + LLM) and the Fern
   app window. The old floating overlay and screen-edge glow are gone;
   Fern lives in a proper app window now.
   ════════════════════════════════════════════════════════════════════ */

const SUGGESTIONS = [
  { label: "What's the weather?", run: "What's the weather?" },
  { label: "Play lofi on YouTube", run: "Play lofi hip hop on YouTube" },
  { label: "Take a photo", run: "Take a photo" },
  { label: "Timer for 5 minutes", run: "Set a timer for 5 minutes" },
  { label: "Tell me a joke", run: "Tell me a joke" },
];

const JOKES = [
  "Why did the developer go broke? He used up all his cache.",
  "I told my computer I needed a break, and now it won't stop sending me vacation ads.",
  "Why do programmers prefer dark mode? Light attracts bugs.",
  "There are 10 kinds of people: those who understand binary and those who don't.",
  "A SQL query walks into a bar, approaches two tables and asks: mind if I join you?",
  "Why was the leaf great at its job? It always knew when to branch out.",
  "I'd tell you a UDP joke, but you might not get it.",
];

const NUM_WORDS = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, fifteen: 15, twenty: 20, thirty: 30, forty: 40, sixty: 60, half: 0.5 };

const APP_ALIASES = [
  ["browser", /\b(browser|safari|chrome|web|internet|canopy browser)\b/],
  ["photos", /\b(photos?|camera|photo booth|pictures)\b/],
  ["notes", /\b(notes?|notepad)\b/],
  ["reminders", /\b(reminders?|tasks?|to.?do)\b/],
  ["monitor", /\b(activity monitor|system monitor)\b/],
  ["calendar", /\b(calendar|agenda|schedule)\b/],
  ["calculator", /\b(calculator|calc)\b/],
  ["clock", /\b(clock|stopwatch|timers?)\b/],
  ["weather", /\bweather( app)?\b/],
  ["terminal", /\b(terminal|console|shell|command line)\b/],
  ["settings", /\b(settings|system settings|preferences|system preferences)\b/],
  ["finder", /\b(finder|files|file manager)\b/],
];

function parseDuration(t) {
  const m = /(\d+(?:\.\d+)?|an?|one|two|three|four|five|six|seven|eight|nine|ten|fifteen|twenty|thirty|forty|sixty|half an?)\s*(seconds?|secs?|minutes?|mins?|hours?|hrs?)/.exec(t);
  if (!m) return null;
  const raw = m[1].replace(/^half an?$/, "half");
  const n = /^\d/.test(raw) ? parseFloat(raw) : NUM_WORDS[raw];
  if (!n) return null;
  const u = m[2][0];
  const seconds = Math.round(n * (u === "h" ? 3600 : u === "m" ? 60 : 1));
  return { seconds, rest: t.replace(m[0], "").replace(/\s+/g, " ").trim() };
}
function fmtDur(s) {
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  return [h ? `${h} hour${h > 1 ? "s" : ""}` : "", m ? `${m} minute${m > 1 ? "s" : ""}` : "", sec ? `${sec} second${sec > 1 ? "s" : ""}` : ""].filter(Boolean).join(" ");
}
function evalMath(raw) {
  let e = raw.toLowerCase();
  e = e
    .replace(/(\d+(?:\.\d+)?)\s*(?:percent|%)\s*of\s*(\d+(?:\.\d+)?)/g, "($1/100)*$2")
    .replace(/to the power of|\bpower\b/g, "**")
    .replace(/squared/g, "**2")
    .replace(/cubed/g, "**3")
    .replace(/plus/g, "+")
    .replace(/minus/g, "-")
    .replace(/multiplied by|times|\bx\b|×/g, "*")
    .replace(/divided by|over|÷/g, "/")
    .replace(/\^/g, "**")
    .replace(/,/g, "");
  if (!/^[\d\s+\-*/().%]+$/.test(e) || !/\d/.test(e) || !/[+\-*/%]/.test(e.replace(/^\s*-/, ""))) return null;
  try {
    const v = Function(`"use strict";return (${e})`)();
    return typeof v === "number" && isFinite(v) ? v : null;
  } catch { return null; }
}

function runFernAction(a, os) {
  switch (a.type) {
    case "open_app": openApp(a.app, a.props || {}); break;
    case "web_search": openApp("browser", { q: a.query, newTab: true }); break;
    case "open_url": openApp("browser", { url: a.url, newTab: true }); break;
    case "youtube": openApp("browser", { yt: a.query, autoplay: !!a.play, newTab: true }); break;
    case "new_note": {
      const n = Notes.create(OS.user.id, (a.title || "").slice(0, 60), a.body || "");
      openApp("notes", { refresh: true });
      break;
    }
    case "timer": setTimer(a.seconds, a.label); break;
    case "theme": updateSettings({ theme: a.value }); break;
    case "take_photo": openApp("photos", { capture: true }); break;
  }
}

/* ── local command handling (works offline) ──────────────────────── */
async function fernLocal(input) {
  const original = input.trim();
  let t = original.toLowerCase().replace(/[!?.]+$/g, "").trim();
  t = t.replace(/^(hey|ok|okay|hi)?,?\s*fern[,.]?\s*/, "").replace(/^(please|can you|could you|would you|will you|i want you to|i'd like to|i want to)\s+/, "").replace(/\s+please$/, "").trim();
  const name = (OS.user && OS.user.name ? OS.user.name.split(" ")[0] : "") || "there";

  if (!t) return { reply: `Hi ${name}. What can I do for you?` };
  if (/\b(battery|charge|charging)\b/.test(t)) {
    if (!navigator.getBattery) return { reply: "This browser doesn't share battery information with websites." };
    try { const battery = await navigator.getBattery(); return { reply: `Your battery is at ${Math.round(battery.level * 100)}%${battery.charging ? " and charging" : ""}.` }; }
    catch { return { reply: "I couldn't access battery information on this device." }; }
  }
  if (/\b(where am i|my location|current location|locate me)\b/.test(t)) {
    try { const city = await requestLocation(); updateSettings({ city }); return { reply: `Location access is on. I've updated Weather to your current location (${city.lat.toFixed(2)}, ${city.lon.toFixed(2)}).` }; }
    catch (e) { return { reply: `${e.message} You can also choose a city in Settings → Location.` }; }
  }

  let m = /^(?:open|go to|launch|show me)\s+youtube$/.exec(t);
  if (m) {
    runFernAction({ type: "youtube", query: "" });
    return { reply: "Opening YouTube." };
  }
  m = /^(?:play|watch|put on|stream)\s+(.+?)(?:\s+(?:on|in|from)\s+youtube)?$/.exec(t) || /^youtube\s+(.+)$/.exec(t) || /^(?:search|find)\s+(?:youtube\s+for|for)\s+(.+?)\s+on youtube$/.exec(t);
  if (m && !/^(a )?(timer|game)/.test(m[1])) {
    const q = m[1].trim();
    const play = /^(play|watch|put on|stream)/.test(t);
    runFernAction({ type: "youtube", query: q, play });
    return { reply: play ? `Playing “${q}” on YouTube.` : `Here's what I found on YouTube for “${q}”.`, card: { kind: "info", title: "YouTube", sub: q, icon: "play" } };
  }

  if (/\b(take|snap|capture|shoot)\b.*\b(photo|picture|selfie|pic|photograph)\b/.test(t)) {
    runFernAction({ type: "take_photo" });
    return { reply: "Okay, smile. Taking a photo in 3, 2, 1…", card: { kind: "info", title: "Photos", sub: "Camera ready", icon: "camera" } };
  }

  if (/\b(timer|remind me|wake me|alarm)\b/.test(t) || /^(set|start)\b.*\b(minutes?|seconds?|hours?)\b/.test(t)) {
    const d = parseDuration(t);
    if (d) {
      const rm = /remind me (?:to |about )?(.+?)(?:\s+in\s+.*)?$/.exec(t);
      const label = rm ? rm[1].replace(/\s+(in|after)$/, "") : undefined;
      runFernAction({ type: "timer", seconds: d.seconds, label });
      return {
        reply: label ? `Got it. I'll remind you to ${label} in ${fmtDur(d.seconds)}.` : `Timer set for ${fmtDur(d.seconds)}.`,
        card: { kind: "timer", title: label ? "Reminder" : "Timer", big: fmtDur(d.seconds), sub: label, icon: "timer" },
      };
    }
    if (/\bremind me\b/.test(t)) return { reply: "Sure. When should I remind you? Try “remind me to stretch in 20 minutes”." };
    return { reply: "For how long? Try “set a timer for 10 minutes”." };
  }

  m = /^(?:take a note|make a note|create a note|new note|write down|jot down|note\b(?: to self)?|add a note)(?:\s+(?:that|to|saying|about))?[:,]?\s*(.*)$/.exec(original.toLowerCase().replace(/^(hey |ok |okay )?fern[,.]?\s*/, "").replace(/^(please|can you|could you)\s+/, ""));
  if (m) {
    const body = original.slice(original.toLowerCase().indexOf(m[1].toLowerCase()), original.length).trim() || "";
    if (!m[1].trim()) {
      runFernAction({ type: "open_app", app: "notes", props: { newNote: true } });
      return { reply: "Opened a fresh note for you." };
    }
    runFernAction({ type: "new_note", title: body.slice(0, 40), body });
    return { reply: "Saved to Notes.", card: { kind: "info", title: "Note saved", sub: body, icon: "note" } };
  }

  if (/\b(dark mode|night mode)\b/.test(t) || /\b(switch|change|turn)\b.*\bdark\b/.test(t)) {
    runFernAction({ type: "theme", value: "dark" });
    return { reply: "Dark mode is on." };
  }
  if (/\b(light mode|day mode)\b/.test(t) || /\b(switch|change|turn)\b.*\blight\b/.test(t)) {
    runFernAction({ type: "theme", value: "light" });
    return { reply: "Switched to light mode." };
  }

  if (/\b(wallpaper|background)\b/.test(t) && /\b(change|set|switch|new|random|use)\b/.test(t)) {
    const named = WALLPAPERS.find((w) => t.includes(w.name.toLowerCase().split(" ")[0]));
    const pick = named || WALLPAPERS[(WALLPAPERS.findIndex((w) => w.id === OS.settings.wallpaper) + 1) % WALLPAPERS.length];
    updateSettings({ wallpaper: pick.id });
    return { reply: `Wallpaper changed to ${pick.name}.` };
  }

  if (/\b(volume|louder|quieter)\b/.test(t)) {
    const up = /\b(up|raise|increase|louder|max)\b/.test(t);
    const mute = /\b(mute|off|silent)\b/.test(t);
    const v = mute ? 0 : clamp(OS.settings.volume + (up ? 20 : -20), 0, 100);
    updateSettings({ volume: v });
    return { reply: mute ? "Muted." : `Volume ${up ? "up" : "down"}, now at ${v}%.` };
  }
  if (/\bbright(ness)?\b/.test(t)) {
    const up = /\b(up|raise|increase|brighter|max)\b/.test(t);
    const v = clamp(OS.settings.brightness + (up ? 20 : -20), 30, 100);
    updateSettings({ brightness: v });
    return { reply: `Brightness at ${v}%.` };
  }

  if (/\bwhat('?s| is)?\s*(the )?(current )?time\b|\bwhat time is it\b|^time$/.test(t)) {
    const d = new Date();
    const tm = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    return { reply: `It's ${tm}.`, card: { kind: "info", title: "Time", big: tm, sub: d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" }), icon: "clock" } };
  }
  if (/\b(what('?s| is)?\s*(the |today'?s )?date|what day is it|today'?s date|what is today)\b/.test(t)) {
    const d = new Date();
    return { reply: `Today is ${d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" })}.` };
  }

  if (/\b(my )?(calendar|events|agenda|schedule)\b/.test(t) && /\b(what|show|any|upcoming|next|do i have)\b/.test(t)) {
    const today = new Date().toISOString().slice(0, 10);
    const up = OS.settings.events.filter((e) => e.date >= today).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 4);
    if (!up.length) return { reply: "Your calendar is clear. Want to add something?", chips: [{ label: "Open Calendar", run: "Open Calendar" }] };
    return { reply: `You have ${up.length} upcoming: ${up.map((e) => `${e.title} on ${new Date(e.date + "T12:00").toLocaleDateString([], { month: "short", day: "numeric" })}`).join("; ")}.` };
  }

  if (/\b(weather|temperature|forecast|how (hot|cold|warm) is it|is it (raining|sunny|cold|hot))\b/.test(t) && !/\bopen\b/.test(t)) {
    try {
      const cm = /\b(?:in|for|at)\s+([a-z][a-z\s,.'-]+)$/.exec(t);
      let city = OS.settings.city;
      if (cm) {
        const g = await geocode(cm[1].trim()).catch(() => []);
        if (g[0]) city = g[0];
      }
      const w = await fetchWeather(city.lat, city.lon);
      const hi = Math.round(w.daily.temperature_2m_max[0]);
      const lo = Math.round(w.daily.temperature_2m_min[0]);
      const desc = weatherTitle(w.current.weather_code);
      return {
        reply: `It's ${Math.round(w.current.temperature_2m)}° and ${desc.toLowerCase()} in ${city.name.split(",")[0]}. Today's high is ${hi}°, low ${lo}°.`,
        card: { kind: "weather", title: city.name.split(",")[0], big: `${Math.round(w.current.temperature_2m)}°`, sub: `${desc} · H ${hi}° L ${lo}°`, glyph: w.current.weather_code },
        chips: [{ label: "Open Weather", run: "Open the weather app" }],
      };
    } catch {
      return { reply: "I couldn't reach the weather service just now." };
    }
  }

  const mm = /^(?:what(?:'s| is)|calculate|compute|how much is|solve|eval(?:uate)?)?\s*(.+)$/.exec(t);
  if (mm) {
    const v = evalMath(mm[1]);
    if (v !== null) {
      const out = Number.isInteger(v) ? String(v) : String(Math.round(v * 1e8) / 1e8);
      return { reply: `${mm[1].trim()} equals ${out}.`, card: { kind: "math", title: mm[1].trim(), big: out, icon: "calc" } };
    }
  }

  m = /^(?:search(?:\s+(?:the web|google|online|bing))?(?:\s+for)?|google|look up|lookup|bing|find (?:info|information) (?:on|about))\s+(.+)$/.exec(t);
  if (m) {
    runFernAction({ type: "web_search", query: m[1] });
    return { reply: `Searching the web for “${m[1]}”.`, card: { kind: "info", title: "Web Search", sub: m[1], icon: "search" } };
  }
  m = /^(?:go to|open|visit|navigate to|take me to)\s+((?:https?:\/\/)?(?:[\w-]+\.)+[a-z]{2,}(?:\/\S*)?)$/.exec(t);
  if (m) {
    runFernAction({ type: "open_url", url: /^https?:/.test(m[1]) ? m[1] : `https://${m[1]}` });
    return { reply: `Opening ${m[1]}.` };
  }

  if (/^(close|quit)\s+(all|every)\s+(the\s+)?(windows|apps)$/.test(t)) {
    closeAll();
    return { reply: "All windows closed." };
  }
  if (/^(log ?out|sign out|lock( the)?( screen| computer| mac)?)$/.test(t)) {
    setTimeout(() => logout(), 900);
    return { reply: "Locking the screen. See you soon." };
  }
  if (/^restart( the)?( computer| system| mac)?$/.test(t)) {
    setTimeout(() => restart(), 1000);
    return { reply: "Restarting CanopyOS…" };
  }
  if (/^(shut ?down|power off|turn off)( the)?( computer| system| mac)?$/.test(t)) {
    setTimeout(() => shutdown(), 1000);
    return { reply: "Shutting down. Goodbye." };
  }

  m = /^(?:open|launch|start|show|go to|run|bring up|switch to)\s+(?:me\s+)?(?:the\s+|my\s+)?(.+?)(?:\s+app)?$/.exec(t);
  if (m) {
    for (const [id, re] of APP_ALIASES) {
      if (re.test(m[1])) {
        runFernAction({ type: "open_app", app: id });
        return { reply: `Opening ${APPS[id].name}.` };
      }
    }
  }

  // open calendar via chip
  if (/^open (the )?calendar$/.test(t)) { openApp("calendar"); return { reply: "Opening Calendar." }; }
  if (/^open (the )?weather( app)?$/.test(t)) { openApp("weather"); return { reply: "Opening Weather." }; }

  if (/\bjoke\b/.test(t)) return { reply: JOKES[Math.floor(Math.random() * JOKES.length)] };
  if (/^(hi|hello|hey|yo|hola|sup|good (morning|afternoon|evening))\b/.test(t)) {
    const h = new Date().getHours();
    return { reply: `${h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening"}, ${name}. What can I do for you?`, chips: SUGGESTIONS.slice(0, 3) };
  }
  if (/\b(who are you|what('?s| is) your name|what are you|are you siri)\b/.test(t))
    return { reply: "I'm Fern, the assistant built into CanopyOS Aurora. I can open apps, search the web, play videos, set timers, take photos and answer questions." };
  if (/\b(thank(s| you)|cheers)\b/.test(t)) return { reply: "Anytime." };
  if (/\b(what can you do|help me|what do you do|^help$)\b/.test(t))
    return { reply: "I can open apps, search the web, play YouTube, take photos, set timers and reminders, write notes, check the weather, do math, and change your wallpaper or theme. Or we can just talk.", chips: SUGGESTIONS };
  if (/\b(how are you|how's it going)\b/.test(t)) return { reply: "Doing well, thanks. How about you?" };
  return null;
}

/* ── LLM (Pollinations, free & keyless, CORS open) ───────────────── */
/* Streaming first (SSE) so replies appear word-by-word, with a
   non-streaming POST and a plain GET as fallbacks. The model answers
   in plain text; OS actions ride on a trailing [[action:{...}]] line
   that is stripped from the visible text. */
function fernSystemPrompt() {
  const now = new Date();
  const wins = OS.windows.filter((w) => !w.closing).map((w) => APPS[w.app].name);
  const active = OS.windows.find((w) => w.id === OS.activeId);
  const page = active && active.app === "browser" ? ` The browser is currently showing: ${active.title}.` : "";
  return `You are Fern, the built-in assistant of CanopyOS Aurora, a desktop operating system. Write like a real person: warm, brief, direct. Never use emoji. Never use markdown, bullet points or code fences. Keep replies under 60 words unless detail is requested. Avoid clichés like "As an AI" and never mention being a language model or a model of any kind.
Context: the user's name is ${OS.user ? OS.user.name : "unknown"}. Local time is ${now.toLocaleString()}. Frontmost app: ${OS.activeApp ? APPS[OS.activeApp].name : "Finder"}. Open windows: ${wins.join(", ") || "none"}.${page}
You can trigger OS actions. If — and only if — the user asks the OS to do something, end your reply with ONE final line of the exact form [[action:{"type":"…","app":"…"}]] where the JSON has a "type" from: open_app (app: finder|browser|photos|notes|calendar|calculator|clock|weather|terminal|settings), web_search (query), open_url (url), youtube (query, play), new_note (title, body), timer (seconds, label), theme (value: dark|light), take_photo. Never wrap the JSON in backticks. For ordinary questions just answer in plain text with no action line.`;
}

function fernStripAction(text) {
  const m = /\[\[action:\s*(\{[\s\S]*?\})\s*\]\]\s*$/.exec(text);
  if (!m) return { reply: text.trim(), action: null };
  let action = null;
  try { action = JSON.parse(m[1]); } catch {}
  return { reply: text.slice(0, m.index).trim(), action: action && action.type ? action : null };
}

function fernCleanDisplay(text) {
  let t = text.replace(/```[a-z]*\n?/gi, "");
  const ai = t.indexOf("[[action:");
  if (ai >= 0) t = t.slice(0, ai);
  const trimmed = t.trim();
  if (/^\{"?(reply|action)"?\s*:/.test(trimmed)) return ""; // legacy JSON mode — hide until parsed
  return t.replace(/^\s*(f|F)ern\s*[:：]\s*/, "").trimStart();
}

async function fernStream(url, body, onChunk, timeoutMs) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "text/event-stream" },
      body: JSON.stringify(body),
      signal: ctl.signal,
    });
    if (!r.ok || !r.body) throw new Error("http " + r.status);
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "", full = "", lastLen = -1;
    const feed = (force) => {
      const shown = fernCleanDisplay(full);
      if (onChunk && shown && (force || shown.length !== lastLen)) { lastLen = shown.length; onChunk(shown); }
    };
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        try {
          const j = JSON.parse(payload);
          const d = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
          if (d) { full += d; feed(); }
        } catch {}
      }
    }
    feed(true);
    return full;
  } finally { clearTimeout(timer); }
}

async function fernAskLLM(history, onChunk) {
  const system = fernSystemPrompt();
  const msgs = [{ role: "system", content: system }, ...history.slice(-8)];
  const body = { model: "openai", messages: msgs, private: true, referrer: "canopyos-aurora" };
  const url = "https://text.pollinations.ai/openai";

  let text = "";
  // 1) streaming — smooth, word-by-word
  try {
    text = (await fernStream(url, { ...body, stream: true }, onChunk, 26000)).trim();
  } catch {} // on failure we still keep whatever partial text arrived
  // 2) plain POST (same endpoint, different path)
  if (!text) {
    try {
      const r = await fetchT(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      }, 26000);
      if (r.ok) {
        const j = await r.json();
        text = ((j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "").trim();
      }
    } catch {}
  }
  // 3) simple GET endpoint (separate rate-limit bucket)
  if (!text) {
    try {
      const convo = history.slice(-4).map((m) => (m.role === "user" ? "User: " : "Fern: ") + m.content).join("\n");
      const sys = encodeURIComponent(system);
      const r = await fetchT(`https://text.pollinations.ai/${encodeURIComponent(convo + "\nFern:")}?model=openai&system=${sys}&private=true&referrer=canopyos-aurora`, {}, 20000);
      if (r.ok) text = (await r.text()).trim();
      if (/^\s*\{/.test(text)) text = ""; // GET returned junk/error json
    } catch {}
  }
  if (!text) throw new Error("AI unavailable");

  // tolerate the legacy JSON-wrapped protocol
  const raw = text.replace(/```[a-z]*\n?/gi, "").trim();
  if (/^\{"?(reply|action)"?\s*:/.test(raw)) {
    const jm = /\{[\s\S]*\}/.exec(raw);
    if (jm) {
      try {
        const o = JSON.parse(jm[0]);
        if (o.reply) {
          if (o.action && typeof o.action === "object" && "type" in o.action) runFernAction(o.action);
          return { reply: o.reply };
        }
      } catch {}
    }
  }
  const { reply, action } = fernStripAction(raw);
  if (action) runFernAction(action);
  if (!reply) throw new Error("empty");
  return { reply };
}

/* ═══ Fern app window ══════════════════════════════════════════════ */
const FernStatus = { current: "idle", listeners: new Set() };
function setFernStatus(s) {
  FernStatus.current = s;
  FernStatus.listeners.forEach((fn) => { try { fn(s); } catch {} });
}

function FernApp({ win, body }) {
  body.innerHTML = "";
  const root = el("div", "fern-app");
  root.innerHTML = `
    <div class="fern-drag" data-drag="1"></div>
    <div class="fern-title"><span class="nm">Fern</span></div>
    <button class="fern-expand" type="button" aria-label="Expand or restore Fern" title="Expand or restore">${icon("ext", 16)}</button>
    <div class="fern-scroll thin-scroll"></div>
    <form class="fern-inputbar glass glass-dark glass-sheen">
      <span class="orb-slot"></span>
      <input placeholder="Ask Fern anything…" aria-label="Ask Fern"/>
      <span class="vu-slot"></span>
      <span class="mic-slot"></span>
      <span class="send-slot"></span>
    </form>
    <div class="fern-foot">Fern · press ⌥Space anywhere to summon</div>`;
  body.appendChild(root);
  $(".fern-expand", root).onclick = () => toggleMaximize(win.id);

  const scroll = $(".fern-scroll", root);
  const orbSlot = $(".orb-slot", root);
  const orb = makeOrb(36, "idle");
  orbSlot.replaceWith(orb);
  const input = $("input", root);
  const vuSlot = $(".vu-slot", root);
  const micSlot = $(".mic-slot", root);
  const sendSlot = $(".send-slot", root);
  const form = $("form", root);

  let status = "idle";
  let msgs = []; // {id, role, text, card, chips}
  let hist = []; // LLM history
  let alive = true;
  let rec = null;
  let heard = "";
  let busy = false;
  let queued = null;

  const hasSpeech = !!((window.SpeechRecognition || window.webkitSpeechRecognition));

  function setStatus(s) {
    status = s;
    orb.dataset.state = { listening: "listening", thinking: "thinking", streaming: "thinking", speaking: "speaking" }[s] || "idle";
    paintBars();
    input.placeholder = s === "listening" ? "Listening…" : "Ask Fern anything…";
  }

  function paintBars() {
    if (status === "listening") {
      vuSlot.innerHTML = `<span class="vubar">${[0,1,2,3,4].map((i) => `<span style="animation-delay:${i * 0.1}s"></span>`).join("")}</span>`;
    } else vuSlot.innerHTML = "";
    if (hasSpeech) {
      micSlot.innerHTML = `<button type="button" class="fern-round mic ${status === "listening" ? "live" : ""}" aria-label="Speak">${icon("mic", 18)}</button>`;
      $(".fern-round", micSlot).onclick = listen;
    } else micSlot.innerHTML = "";
    sendSlot.innerHTML = input.value.trim() ? `<button type="submit" class="fern-round send" aria-label="Send">${icon("send", 18)}</button>` : "";
  }
  input.oninput = paintBars;

  function cardHTML(card) {
    if (!card) return "";
    const ic = card.glyph !== undefined
      ? weatherGlyph(card.glyph, 34)
      : icon(card.icon || "info", 30);
    return `<div class="fern-card glass glass-dark"><span class="ce">${ic}</span><span><span class="ct">${esc(card.title)}</span>${card.big ? `<span class="cb" style="display:block">${esc(card.big)}</span>` : ""}${card.sub ? `<span class="cs" style="display:block">${esc(card.sub)}</span>` : ""}</span></div>`;
  }
  function wordsHTML(text) {
    return text.split(/(\s+)/).map((w, i) => (w.trim() ? `<span class="fern-word" style="animation-delay:${Math.min(i, 60) * 22}ms">${esc(w)}</span>` : w)).join("");
  }

  function paint() {
    const last = msgs[msgs.length - 1];
    scroll.innerHTML = msgs.slice(-8).map((m, i, arr) => {
      if (m.role === "user") return `<div class="fern-user selectable">${esc(m.text)}</div>`;
      // only the newest assistant message gets the word-cascade animation,
      // so older replies don't re-animate on every repaint
      const fresh = m === last && status !== "streaming";
      const bodyHTML = fresh ? wordsHTML(m.text) : esc(m.text);
      const chips = m.chips && m === last
        ? `<div class="fern-chips">${m.chips.map((c, ci) => `<button type="button" class="fern-chip glass glass-dark" data-run="${esc(c.run)}" style="animation-delay:${0.2 + ci * 0.07}s">${esc(c.label)}</button>`).join("")}</div>`
        : "";
      return `<div class="fern-bot selectable" id="m-${m.id}"><div class="txt">${bodyHTML}</div>${cardHTML(m.card)}${chips}</div>`;
    }).join("") + (status === "thinking"
      ? `<div class="fern-status">${[0,1,2].map((i) => `<span class="dot" style="animation-delay:${i * 0.15}s"></span>`).join("")}</div>`
      : "") + (status === "listening"
      ? `<div class="fern-heard selectable">${esc(heard || "Listening…")}</div>`
      : "");
    $$(".fern-chip", scroll).forEach((b) => { b.onclick = () => submit(b.dataset.run); });
    scroll.scrollTop = scroll.scrollHeight + 400;
  }

  // cheap live update while streaming: touch only the growing message
  function paintLive() {
    const last = msgs[msgs.length - 1];
    if (!last || last.role !== "assistant") { paint(); return; }
    let node = $("#m-" + last.id, scroll);
    if (!node) { paint(); return; }
    const txt = $(".txt", node);
    if (txt) txt.textContent = last.text;
    const nearBottom = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 160;
    if (nearBottom) scroll.scrollTop = scroll.scrollHeight + 400;
  }

  function speak(text) {
    try {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.03; u.pitch = 1.05;
      const voices = window.speechSynthesis.getVoices();
      const v = voices.find((x) => /samantha|google us english|jenny|aria|zira/i.test(x.name)) || voices.find((x) => x.lang && x.lang.startsWith("en"));
      if (v) u.voice = v;
      u.onstart = () => setStatus("speaking");
      u.onend = () => setStatus("idle");
      window.speechSynthesis.speak(u);
    } catch {}
  }

  async function submit(text, byVoice) {
    const q = String(text || "").trim();
    if (!q || !alive) return;
    if (busy) { queued = q; return; }
    busy = true;
    input.value = "";
    heard = "";
    paintBars();
    msgs = [...msgs.slice(-7), { id: uid(), role: "user", text: q }];
    hist.push({ role: "user", content: q });
    setStatus("thinking");
    paint();
    let streamMsg = null;
    let lastPaint = 0;
    const onChunk = (partial) => {
      if (!alive) return;
      const now = performance.now();
      if (now - lastPaint < 40 && partial.length < 400) return; // throttle repaints
      lastPaint = now;
      if (!streamMsg) {
        streamMsg = { id: uid(), role: "assistant", text: partial };
        msgs = [...msgs, streamMsg];
      } else streamMsg.text = partial;
      setStatus("streaming");
      paintLive();
    };
    let res = null;
    try {
      res = await fernLocal(q);
      if (!res) res = await fernAskLLM(hist, onChunk);
    } catch {
      res = { reply: "I'm having trouble reaching my thinking cap right now. I can still open apps, search the web, play videos and set timers, so try me on one of those.", chips: SUGGESTIONS.slice(0, 3) };
    }
    if (!alive) return;
    if (streamMsg) msgs = msgs.filter((m) => m !== streamMsg);
    hist.push({ role: "assistant", content: res.reply });
    msgs = [...msgs.slice(-7), { id: uid(), role: "assistant", text: res.reply, card: res.card, chips: res.chips }];
    busy = false;
    setStatus("idle");
    paint();
    if (byVoice && OS.settings.voiceReplies) speak(res.reply);
    if (queued) { const n = queued; queued = null; setTimeout(() => submit(n, byVoice), 120); }
  }

  function listen() {
    if (status === "listening") { try { rec && rec.stop(); } catch {} return; }
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!R) return;
    try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch {}
    const r = new R();
    r.lang = (navigator.language || "en-US");
    r.interimResults = true;
    r.continuous = false;
    let final = "";
    r.onresult = (e) => {
      let txt = "";
      for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
      heard = txt;
      if (e.results[e.results.length - 1].isFinal) final = txt;
      paint();
    };
    r.onerror = (e) => {
      setStatus("idle");
      if (e.error === "not-allowed") {
        msgs = [...msgs.slice(-7), { id: uid(), role: "assistant", text: "I need microphone access to hear you. You can allow it in your browser, or just type to me." }];
        paint();
      }
    };
    r.onend = () => {
      if (final) submit(final, true);
      else if (status === "listening") setStatus("idle");
    };
    rec = r;
    heard = "";
    setStatus("listening");
    try { r.start(); } catch { setStatus("idle"); }
  }

  form.onsubmit = (e) => { e.preventDefault(); submit(input.value); };
  input.onkeydown = (e) => { if (e.key === "Escape") { e.stopPropagation(); closeWindow(win.id); } };
  paintBars(); // render mic/send chrome immediately on mount

  // greeting + seeds
  function greet() {
    const h = new Date().getHours();
    const g = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    const name = (OS.user && OS.user.name ? OS.user.name.split(" ")[0] : "") || "there";
    msgs = [{ id: uid(), role: "assistant", text: `${g}, ${name}. What can I do for you?`, chips: SUGGESTIONS }];
    paint();
    setTimeout(() => input.focus(), 120);
  }
  if (win.props.text) submit(win.props.text);
  else greet();

  // update when re-summoned with a seed
  win._fernUpdate = (props) => {
    if (props && props.text) submit(props.text);
    else setTimeout(() => input.focus(), 80);
  };

  const offStatus = () => {}; // placeholder kept for symmetry

  return {
    update(props) { win._fernUpdate(props); },
    destroy() {
      alive = false;
      try { rec && rec.abort(); } catch {}
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch {}
    },
  };
}

/* ── shared: city search dropdown ────────────────────────────────── */
function citySearch(placeholder, onPick) {
  const wrap = el("div", "city-anchor");
  const input = el("input", "field");
  input.style.width = "210px";
  input.placeholder = placeholder;
  wrap.appendChild(input);
  let pop = null;
  let t = null;
  input.oninput = () => {
    clearTimeout(t);
    const q = input.value.trim();
    if (q.length < 2) { if (pop) { pop.remove(); pop = null; } return; }
    t = setTimeout(async () => {
      try {
        const res = await geocode(q);
        if (pop) pop.remove();
        if (!res.length) { pop = null; return; }
        pop = el("div", "pop glass glass-panel");
        for (const c of res) {
          const b = el("button", "menu-item", esc(c.name));
          b.onclick = () => { onPick(c); input.value = ""; pop.remove(); pop = null; };
          pop.appendChild(b);
        }
        wrap.appendChild(pop);
      } catch {}
    }, 250);
  };
  return wrap;
}

/* ═══ Finder ═══════════════════════════════════════════════════════ */
function FinderApp({ win, body }) {
  const PLACES = [
    { id: "apps", icon: "grid", label: "Applications" },
    { id: "documents", icon: "doc", label: "Documents" },
    { id: "pictures", icon: "image", label: "Pictures" },
    { id: "wallpapers", icon: "palette", label: "Desktop Pictures" },
    { id: "trash", icon: "trash", label: "Trash" },
  ];
  let place = win.props.path === "trash" ? "trash" : "apps";
  let selected = null;
  let notesList = [];
  let photosList = [];

  body.innerHTML = `<div class="app-flex">
    <div class="side" data-drag="1">
      <div class="side-head">Favorites</div>
      <div class="side-list" style="padding:0 10px"></div>
    </div>
    <div class="main">
      <div class="main-head" data-drag="1"><span id="f-title"></span></div>
      <div class="main-scroll thin-scroll"><div class="finder-grid" id="f-grid"></div></div>
      <div class="finder-status" id="f-status"></div>
    </div>
  </div>`;
  const sideList = $(".side-list", body);
  const grid = $("#f-grid", body);
  const titleEl = $("#f-title", body);
  const statusEl = $("#f-status", body);

  async function load() {
    if (place === "documents") {
      notesList = OS.user ? Notes.all(OS.user.id) : [];
    } else if (place === "pictures") {
      photosList = OS.user ? await PhotoStore.all(OS.user.id).catch(() => []) : [];
    }
    paint();
  }

  function item(k, iconHTML, label, open, imgSrc) {
    const b = el("button", "fitem" + (selected === k ? " sel" : ""));
    const ic = el("div", "ic");
    if (imgSrc) ic.innerHTML = `<img class="fthumb" src="${imgSrc}" alt=""/>`;
    else ic.innerHTML = iconHTML;
    b.appendChild(ic);
    b.appendChild(el("span", "lb", esc(label)));
    b.onclick = () => { selected = k; $$(".fitem", grid).forEach(node => node.classList.remove("sel")); b.classList.add("sel"); };
    b.ondblclick = () => open && open();
    return b;
  }

  function paint() {
    sideList.innerHTML = "";
    for (const p of PLACES) {
      const b = el("button", "side-item" + (place === p.id ? " on" : ""));
      b.innerHTML = `<span class="ic">${icon(p.icon, 16)}</span>${esc(p.label)}`;
      b.onclick = () => { place = p.id; selected = null; load(); };
      sideList.appendChild(b);
    }
    titleEl.textContent = PLACES.find((p) => p.id === place).label;
    grid.innerHTML = "";
    const apps = Object.keys(APPS);
    if (place === "apps") {
      for (const a of apps) grid.appendChild(item(a, appIconSVG(a), APPS[a].name, () => openApp(a)));
      statusEl.textContent = `${apps.length} items`;
    } else if (place === "documents") {
      for (const n of notesList) grid.appendChild(item("n" + n.id, icon("note", 34), n.title || "New Note", () => openApp("notes", { noteId: n.id })));
      statusEl.textContent = `Macintosh HD ▸ Documents`;
      if (!notesList.length) grid.appendChild(emptyBlock("doc", "Nothing here yet"));
    } else if (place === "pictures") {
      for (const p of photosList) grid.appendChild(item("p" + p.id, "", `Photo`, () => openApp("photos"), p.data));
      statusEl.textContent = `Macintosh HD ▸ Pictures`;
      if (!photosList.length) grid.appendChild(emptyBlock("image", "Nothing here yet"));
    } else if (place === "wallpapers") {
      for (const wp of WALLPAPERS) {
        const b = item(wp.id, "", wp.name, () => updateSettings({ wallpaper: wp.id }));
        $(".ic", b).style.cssText = wallpaperCSS(wp.id) + ";background-size:cover;background-position:center";
        grid.appendChild(b);
      }
      statusEl.textContent = `${WALLPAPERS.length} items — double-click to set`;
    } else if (place === "trash") {
      statusEl.textContent = "Trash is empty";
      grid.appendChild(emptyBlock("trash", "Trash is empty"));
    }
  }
  function emptyBlock(icName, msg) {
    const d = el("div", "empty-state");
    d.style.cssText = "width:100%;height:280px";
    d.innerHTML = `<span class="ic">${icon(icName, 44)}</span><div>${esc(msg)}</div>`;
    return d;
  }
  load();
  return { update(props) { if (props && props.path) { place = props.path === "trash" ? "trash" : "apps"; selected = null; load(); } }, destroy() {} };
}

/* ═══ Notes ════════════════════════════════════════════════════════ */
function NotesApp({ win, body }) {
  let notes = OS.user ? Notes.all(OS.user.id) : [];
  let sel = null;
  let q = "";
  let saved = true;
  let saveTimer = null;

  body.innerHTML = `<div class="app-flex">
    <div class="notes-side">
      <div class="notes-top" data-drag="1"><button class="notes-new icon-btn" title="New Note" aria-label="New Note">${icon("plus", 17)}</button></div>
      <div style="padding:0 12px 8px"><input class="field" placeholder="Search" aria-label="Search notes"/></div>
      <div class="thin-scroll" style="flex:1;min-height:0;overflow:auto;padding:0 8px 8px" id="n-list"></div>
      <div class="notes-count" id="n-count"></div>
    </div>
    <div class="note-editor">
      <div class="note-meta" data-drag="1"><span id="n-meta"></span><span class="mbtns" id="n-btns"></span></div>
      <div id="n-paper"></div>
    </div>
  </div>`;

  const listEl = $("#n-list", body);
  const countEl = $("#n-count", body);
  const metaEl = $("#n-meta", body);
  const btnsEl = $("#n-btns", body);
  const paperEl = $("#n-paper", body);
  const searchEl = $("input.field", body);

  function create() {
    const n = Notes.create(OS.user.id, "", "");
    notes = Notes.all(OS.user.id);
    sel = n.id;
    paint();
    setTimeout(() => { const t = $(".note-title", paperEl); t && t.focus(); }, 40);
  }
  $(".notes-new", body).onclick = create;
  searchEl.oninput = () => { q = searchEl.value; paint(); };

  function note() { return notes.find((n) => n.id === sel) || null; }

  function update(patch) {
    const n = note();
    if (!n) return;
    Notes.update(OS.user.id, n.id, patch);
    notes = Notes.all(OS.user.id);
    saved = false;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { saved = true; paintMeta(); }, 450);
    paintMeta();
    paintList();
  }
  function remove() {
    if (!note()) return;
    Notes.remove(OS.user.id, sel);
    notes = Notes.all(OS.user.id);
    sel = notes[0] ? notes[0].id : null;
    paint();
  }

  function paintList() {
    const filtered = notes.filter((n) => (n.title + n.body).toLowerCase().includes(q.toLowerCase()));
    listEl.innerHTML = "";
    for (const n of filtered) {
      const b = el("button", "note-item" + (sel === n.id ? " on" : ""));
      const d = new Date(n.updatedAt);
      b.innerHTML = `<div class="t1">${n.pinned ? "📌 " : ""}${esc(n.title || "New Note")}</div>
        <div class="t2">${esc(d.toLocaleDateString([], { month: "short", day: "numeric" }))} · ${esc(n.body.replace(/\n/g, " ").slice(0, 40) || "No additional text")}</div>`;
      b.onclick = () => { sel = n.id; paint(); };
      listEl.appendChild(b);
    }
    if (!filtered.length) listEl.appendChild(el("div", "center-note", notes.length ? "No matches" : "No notes yet")).style.padding = "24px 0";
    countEl.textContent = `${notes.length} Notes`;
  }

  function paintMeta() {
    const n = note();
    metaEl.textContent = n ? `${saved ? "Saved" : "Saving…"} · ${new Date(n.updatedAt).toLocaleString()}` : "";
    btnsEl.innerHTML = "";
    if (n) {
      const pin = el("button", "", n.pinned ? "📌" : "📍");
      pin.title = "Pin";
      pin.onclick = () => update({ pinned: !n.pinned });
      const del = el("button", "", icon("trash", 15));
      del.title = "Delete";
      del.onclick = remove;
      btnsEl.appendChild(pin);
      btnsEl.appendChild(del);
    }
  }

  function paintPaper() {
    const n = note();
    paperEl.innerHTML = "";
    if (!n) {
      const d = el("div", "empty-state");
      d.style.height = "calc(100% - 48px)";
      d.innerHTML = `<span class="ic">${icon("note", 44)}</span>`;
      const b = el("button", "btn btn-primary", "New Note");
      b.onclick = create;
      d.appendChild(b);
      paperEl.appendChild(d);
      return;
    }
    const paper = el("div", "note-paper selectable");
    const title = el("input", "note-title");
    title.placeholder = "Title";
    title.value = n.title;
    title.oninput = () => update({ title: title.value });
    const ta = el("textarea", "note-body");
    ta.placeholder = "Start writing…";
    ta.value = n.body;
    ta.oninput = () => update({ body: ta.value });
    paper.appendChild(title);
    paper.appendChild(ta);
    paperEl.appendChild(paper);
  }

  function paint() { paintList(); paintMeta(); paintPaper(); }
  paint();

  if (win.props.noteId && notes.some(n => n.id === win.props.noteId)) { sel = win.props.noteId; paint(); }
  if (win.props.newNote) create();
  return {
    update(props) {
      notes = OS.user ? Notes.all(OS.user.id) : [];
      if (props && props.newNote) { create(); return; }
      if (props && props.noteId && notes.some(n => n.id === props.noteId)) sel = props.noteId;
      if (!notes.find((n) => n.id === sel)) sel = notes[0] ? notes[0].id : null;
      paint();
    },
    destroy() { clearTimeout(saveTimer); },
  };
}

/* ═══ Calculator ═══════════════════════════════════════════════════ */
function CalculatorApp({ body }) {
  let disp = "0", acc = null, op = null, fresh = true, hot = null;
  const calc = (a, b, o) => (o === "+" ? a + b : o === "−" ? a - b : o === "×" ? a * b : o === "÷" ? (b === 0 ? NaN : a / b) : b);
  const fmt = (n) => (isNaN(n) ? "Error" : String(Math.round(n * 1e10) / 1e10));

  body.innerHTML = `<div class="calc" tabindex="0">
    <div data-drag="1" style="height:44px;flex:none"></div>
    <div class="calc-disp">0</div>
    <div class="calc-grid"></div>
  </div>`;
  const dispEl = $(".calc-disp", body);
  const gridEl = $(".calc-grid", body);
  const keys = ["AC", "±", "%", "÷", "7", "8", "9", "×", "4", "5", "6", "−", "1", "2", "3", "+", "0", ".", "="];
  const keyEls = {};

  function paint() {
    dispEl.textContent = disp;
    dispEl.style.fontSize = (disp.length > 9 ? 36 : disp.length > 6 ? 52 : 68) + "px";
    for (const k of keys) {
      const isOp = ["÷", "×", "−", "+", "="].includes(k);
      keyEls[k].className = `calc-key ${k === "0" ? "zero" : isOp ? "op" + (op === k && fresh ? " active" : "") : ["AC", "±", "%"].includes(k) ? "top" : "num"}`;
      keyEls[k].textContent = k === "AC" && !fresh ? "C" : k;
    }
  }
  function press(k) {
    hot = k;
    if (/^\d$/.test(k)) { disp = (fresh || disp === "0") ? k : (disp.length > 12 ? disp : disp + k); fresh = false; }
    else if (k === ".") { disp = fresh ? "0." : (disp.includes(".") ? disp : disp + "."); fresh = false; }
    else if (k === "AC") { disp = "0"; acc = null; op = null; fresh = true; }
    else if (k === "±") disp = disp.startsWith("-") ? disp.slice(1) : disp === "0" ? disp : "-" + disp;
    else if (k === "%") disp = fmt(parseFloat(disp) / 100);
    else if (k === "=") {
      if (op !== null && acc !== null) { disp = fmt(calc(acc, parseFloat(disp), op)); acc = null; op = null; fresh = true; }
    } else {
      const cur = parseFloat(disp);
      if (op !== null && acc !== null && !fresh) { acc = calc(acc, cur, op); disp = fmt(acc); }
      else acc = cur;
      op = k;
      fresh = true;
    }
    paint();
    setTimeout(() => { if (keyEls[hot]) keyEls[hot].style.filter = ""; }, 130);
  }
  for (const k of keys) {
    const b = el("button", "calc-key");
    b.onclick = () => { b.style.filter = "brightness(1.4)"; press(k); };
    gridEl.appendChild(b);
    keyEls[k] = b;
  }
  paint();
  const root = $(".calc", body);
  setTimeout(() => root.focus(), 50);
  const onKey = (e) => {
    const map = { "*": "×", "/": "÷", "-": "−", Enter: "=", Escape: "AC", Backspace: "AC", c: "AC" };
    const k = map[e.key] || e.key;
    if (keys.includes(k)) { e.preventDefault(); press(k); }
  };
  root.onkeydown = onKey;
  return { update() {}, destroy() {} };
}

/* ═══ Calendar ═════════════════════════════════════════════════════ */
function CalendarApp({ body }) {
  const COLORS = ["#ff453a", "#ff9f0a", "#30d158", "#0a84ff", "#bf5af2"];
  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const now0 = new Date();
  let cursor = new Date(now0.getFullYear(), now0.getMonth(), 1);
  let selected = ymd(new Date());
  let title = "";
  let color = COLORS[3];

  body.innerHTML = `<div class="app-flex">
    <div class="main">
      <div class="cal-head" data-drag="1">
        <div class="cal-title" id="c-title"></div>
        <div class="cal-nav">
          <button class="btn" id="c-prev">‹</button>
          <button class="btn" id="c-today">Today</button>
          <button class="btn" id="c-next">›</button>
        </div>
      </div>
      <div class="cal-dow">${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d) => `<div>${d}</div>`).join("")}</div>
      <div class="cal-grid" id="c-grid"></div>
    </div>
    <div class="cal-side" data-drag="1">
      <div class="cap" id="cs-cap"></div>
      <div class="sel-date" id="cs-date"></div>
      <div class="holiday-settings"><label for="holiday-country">Holiday calendars</label><select class="field" id="holiday-country" aria-label="Add holiday calendar"><option value="">Add a country…</option></select><div class="holiday-selected" id="holiday-selected"></div></div>
      <div class="cal-ev-list" id="cs-list"></div>
      <form class="cal-add">
        <input class="field" placeholder="New event" aria-label="New event"/>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div class="cal-colors"></div>
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </form>
    </div>
  </div>`;
  const titleEl = $("#c-title", body);
  const gridEl = $("#c-grid", body);
  const capEl = $("#cs-cap", body);
  const dateEl = $("#cs-date", body);
  const listEl = $("#cs-list", body);
  const formEl = $("form", body);
  const inputEl = $("input", formEl);
  const colorsEl = $(".cal-colors", body);

  const countrySelect = $("#holiday-country", body);
  const holidaySelected = $("#holiday-selected", body);
  const HolidayCalendar = window.Holidays && (window.Holidays.default || window.Holidays);
  const holidayEngine = HolidayCalendar ? new HolidayCalendar() : null;
  const countries = holidayEngine ? holidayEngine.getCountries("en") : {};
  Object.entries(countries).sort((a,b) => a[1].localeCompare(b[1])).forEach(([code, name]) => { const o = document.createElement("option"); o.value = code; o.textContent = name; countrySelect.appendChild(o); });
  if (!holidayEngine) countrySelect.disabled = true;
  const holidayCache = new Map();
  const chosen = () => Array.isArray(OS.settings.holidayCountries) ? OS.settings.holidayCountries : ["US"];
  function holidaysFor(year) {
    return chosen().flatMap(code => {
      const key = code + year;
      if (!holidayCache.has(key)) {
        try { const hd = new HolidayCalendar(code, { languages: ["en"] }); holidayCache.set(key, hd.getHolidays(year).filter(h => h.type === "public").map(h => ({ id: key + h.date + h.name, date: h.date.slice(0,10), title: h.name, color: "#b17bdb", holiday: true, country: countries[code] || code }))); }
        catch { holidayCache.set(key, []); }
      }
      return holidayCache.get(key);
    });
  }
  countrySelect.onchange = () => { const code = countrySelect.value; if (code && !chosen().includes(code)) updateSettings({ holidayCountries: [...chosen(), code] }); countrySelect.value = ""; paint(); };
  function paintCountries() {
    holidaySelected.innerHTML = "";
    if (!chosen().length) holidaySelected.textContent = "No holiday calendars selected";
    chosen().forEach(code => { const b = el("button", "", `${esc(countries[code] || code)} ×`); b.title = "Remove " + (countries[code] || code); b.onclick = () => { updateSettings({ holidayCountries: chosen().filter(c => c !== code) }); paint(); }; holidaySelected.appendChild(b); });
  }
  const events = () => OS.settings.events;
  const todayStr = ymd(new Date());

  for (const c of COLORS) {
    const b = el("button");
    b.style.background = c;
    if (c === color) b.classList.add("on");
    b.onclick = () => { color = c; $$(".cal-colors button", body).forEach((x) => x.classList.remove("on")); b.classList.add("on"); };
    colorsEl.appendChild(b);
  }

  $("#c-prev", body).onclick = () => { cursor = new Date(cursor.getFullYear(), cursor.getMonth() - 1, 1); paint(); };
  $("#c-next", body).onclick = () => { cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1); paint(); };
  $("#c-today", body).onclick = () => { const d = new Date(); cursor = new Date(d.getFullYear(), d.getMonth(), 1); selected = todayStr; paint(); };
  formEl.onsubmit = (e) => {
    e.preventDefault();
    const t = inputEl.value.trim();
    if (!t) return;
    const ev = { id: uid(), date: selected, title: t, color };
    updateSettings({ events: [...events(), ev] });
    inputEl.value = "";
    paint();
  };

  function paint() {
    titleEl.innerHTML = `${cursor.toLocaleDateString([], { month: "long" })} <span class="yr">${cursor.getFullYear()}</span>`;
    const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
    const start = new Date(first);
    start.setDate(1 - first.getDay());
    gridEl.innerHTML = "";
    paintCountries();
    const holidays = [cursor.getFullYear()-1, cursor.getFullYear(), cursor.getFullYear()+1].flatMap(holidaysFor);
    for (let i = 0; i < 42; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const s = ymd(d);
      const evs = [...events(), ...holidays].filter((e) => e.date === s);
      const other = d.getMonth() !== cursor.getMonth();
      const cell = el("button", "cal-cell" + (selected === s ? " sel" : ""));
      let cls = "dnum" + (s === todayStr ? " today" : "") + (other ? " other" : "");
      cell.innerHTML = `<span class="${cls}">${d.getDate()}</span>`;
      for (const ev of evs.slice(0, 2)) cell.innerHTML += `<span class="cal-ev" style="background:${ev.color}">${esc(ev.title)}</span>`;
      if (evs.length > 2) cell.innerHTML += `<span class="cal-more">+${evs.length - 2} more</span>`;
      cell.onclick = () => { selected = s; paint(); };
      gridEl.appendChild(cell);
    }
    capEl.textContent = selected === todayStr ? "Today" : "Selected";
    dateEl.textContent = new Date(selected + "T12:00").toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
    const selEvs = [...events(), ...holidays].filter((e) => e.date === selected);
    listEl.innerHTML = selEvs.length ? "" : `<div class="center-note" style="font-size:13px">No events</div>`;
    for (const ev of selEvs) {
      const row = el("div", "cal-ev-item");
      row.style.animation = "popIn .25s both";
      row.innerHTML = `<span class="bar" style="background:${ev.color}"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ev.title)}</span>`;
      if (ev.holiday) { row.title = ev.country + " public holiday"; }
      else { const x = el("button", "x", "✕"); x.setAttribute("aria-label", "Delete " + ev.title); x.onclick = () => { updateSettings({ events: events().filter((e2) => e2.id !== ev.id) }); paint(); }; row.appendChild(x); }
      listEl.appendChild(row);
    }
  }
  paint();
  const off = bus.on("settings", (p) => { if (p && p.events) paint(); });
  return { update() {}, destroy() { off(); } };
}

/* ═══ Clock ════════════════════════════════════════════════════════ */
function ClockApp({ body }) {
  let tab = "world";
  let now = new Date();
  let sw = { running: false, base: 0, start: 0 };
  let swNow = 0;
  let laps = [];
  let tm = { h: 0, m: 5, s: 0 };
  let tmState = null;
  let tmLeft = 0;
  let fired = false;

  body.innerHTML = `<div class="app-col">
    <div class="clock-tabs-wrap" data-drag="1">
      <div class="clock-tabs">
        <button data-t="world">World Clock</button>
        <button data-t="stopwatch">Stopwatch</button>
        <button data-t="timer">Timer</button>
      </div>
    </div>
    <div class="main-scroll thin-scroll" style="padding:0 24px 24px" id="ck-body"></div>
  </div>`;

  const bodyEl = $("#ck-body", body);
  const tabs = $$(".clock-tabs button", body);
  for (const b of tabs) b.onclick = () => { tab = b.dataset.t; paint(); };

  const fmtTime = (d, tz, seconds) => {
    try {
      return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: seconds ? "2-digit" : undefined, timeZone: tz });
    } catch { return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
  };
  const fmtSw = (ms) => {
    const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000), c = Math.floor((ms % 1000) / 10);
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}.${String(c).padStart(2, "0")}`;
  };

  function paint() {
    for (const b of tabs) b.classList.toggle("on", b.dataset.t === tab);
    if (tab === "world") {
      const here = Intl.DateTimeFormat().resolvedOptions().timeZone;
      const dayDiff = (tz) => {
        try {
          const a = new Date(now.toLocaleString("en-US", { timeZone: tz }));
          const b = new Date(now.toLocaleString("en-US", { timeZone: here }));
          const d = Math.round((a.getTime() - b.getTime()) / 3600000);
          return `${a.getDate() === b.getDate() ? "Today" : a > b ? "Tomorrow" : "Yesterday"}, ${d >= 0 ? "+" : ""}${d}HRS`;
        } catch { return ""; }
      };
      const clocks = OS.settings.worldClocks;
      bodyEl.innerHTML = `
        <div style="display:flex;justify-content:flex-end;margin-bottom:12px" id="ck-city"></div>
        <div class="world-hero">
          <div><div class="cap">Local</div><div class="dt">${esc(now.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" }))}</div></div>
          <div class="tm">${esc(fmtTime(now, undefined, true))}</div>
        </div>
        <div id="ck-list"></div>`;
      $("#ck-city", bodyEl).appendChild(citySearch("Add city…", (c) => {
        updateSettings({ worldClocks: [...clocks.filter((x) => x.name !== c.name), c] });
        paint();
      }));
      const list = $("#ck-list", bodyEl);
      for (const c of clocks) {
        const row = el("div", "world-row");
        row.innerHTML = `<div><div class="nm">${esc(c.name.split(",")[0])}</div><div class="dd">${esc(dayDiff(c.tz))}</div></div>
          <div style="display:flex;align-items:center;gap:16px"><div class="tm">${esc(fmtTime(now, c.tz))}</div></div>`;
        const x = el("button", "x", "✕");
        x.onclick = () => { updateSettings({ worldClocks: clocks.filter((x2) => x2.name !== c.name) }); paint(); };
        row.lastChild.appendChild(x);
        list.appendChild(row);
      }
    } else if (tab === "stopwatch") {
      bodyEl.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;padding-top:16px">
          <div class="sw-disp">${fmtSw(swNow)}</div>
          <div style="display:flex;gap:16px;margin-top:16px">
            <button class="clock-round" id="ck-lap">${sw.running ? "Lap" : "Reset"}</button>
            <button class="clock-round ${sw.running ? "stop" : "go"}" id="ck-go">${sw.running ? "Stop" : "Start"}</button>
          </div>
          <div style="margin-top:24px;width:100%;max-width:420px" id="ck-laps"></div>
        </div>`;
      $("#ck-lap", bodyEl).onclick = () => {
        if (sw.running) laps = [swNow, ...laps];
        else { swNow = 0; sw = { running: false, base: 0, start: 0 }; laps = []; }
        paint();
      };
      $("#ck-go", bodyEl).onclick = () => {
        if (sw.running) sw = { running: false, base: swNow, start: 0 };
        else sw = { running: true, base: sw.base, start: performance.now() };
        paint();
      };
      const lp = $("#ck-laps", bodyEl);
      laps.forEach((l, i) => {
        const r = el("div", "lap-row");
        r.innerHTML = `<span style="color:var(--fg2)">Lap ${laps.length - i}</span><span>${fmtSw(l - (laps[i + 1] || 0))}</span>`;
        lp.appendChild(r);
      });
    } else {
      const left = tmState ? tmLeft : 0;
      const frac = tmState ? left / tmState.total : 1;
      const C = 2 * Math.PI * 46;
      bodyEl.innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;padding-top:8px">
          <div class="tm-wrap">
            <svg viewBox="0 0 100 100" style="position:absolute;inset:0;transform:rotate(-90deg)">
              <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(128,128,128,.2)" stroke-width="3.5"/>
              <circle cx="50" cy="50" r="46" fill="none" stroke="#ff9f0a" stroke-width="3.5" stroke-linecap="round"
                stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}" style="transition:stroke-dashoffset .1s linear"/>
            </svg>
            <div id="ck-tmcenter"></div>
          </div>
          <div style="margin-top:24px" id="ck-tmbtn"></div>
        </div>`;
      const center = $("#ck-tmcenter", bodyEl);
      if (tmState) {
        center.className = "tm-disp";
        center.textContent = `${String(Math.floor(left / 3600000)).padStart(2, "0")}:${String(Math.floor((left % 3600000) / 60000)).padStart(2, "0")}:${String(Math.ceil((left % 60000) / 1000) % 60).padStart(2, "0")}`;
        $("#ck-tmbtn", bodyEl).innerHTML = `<button class="tm-cancel">Cancel</button>`;
        $("#ck-tmbtn button", bodyEl).onclick = () => { tmState = null; paint(); };
      } else {
        center.className = "tm-inputs";
        center.innerHTML = `<input data-k="h" type="number" min="0" max="23" value="${String(tm.h).padStart(2, "0")}"/><span>:</span><input data-k="m" type="number" min="0" max="59" value="${String(tm.m).padStart(2, "0")}"/><span>:</span><input data-k="s" type="number" min="0" max="59" value="${String(tm.s).padStart(2, "0")}"/>`;
        $$("input", center).forEach((inp) => {
          inp.oninput = () => { tm[inp.dataset.k] = clamp(Number(inp.value) || 0, 0, inp.dataset.k === "h" ? 23 : 59); };
        });
        $("#ck-tmbtn", bodyEl).innerHTML = `<button class="tm-start">Start</button>`;
        $("#ck-tmbtn button", bodyEl).onclick = () => {
          const total = (tm.h * 3600 + tm.m * 60 + tm.s) * 1000;
          if (total > 0) { tmLeft = total; tmState = { end: Date.now() + total, total }; fired = false; paint(); }
        };
      }
    }
  }

  const iv = setInterval(() => {
    now = new Date();
    if (sw.running) {
      swNow = sw.base + performance.now() - sw.start;
      if (tab === "stopwatch") {
        const d = $(".sw-disp", bodyEl);
        if (d) d.textContent = fmtSw(swNow);
      }
    }
    if (tmState) {
      tmLeft = Math.max(0, tmState.end - Date.now());
      if (tmLeft === 0 && !fired) {
        fired = true;
        playSound("notify");
        notify({ title: "Timer finished", body: "Your Clock timer is done.", app: "clock" });
        tmState = null;
        paint();
      } else if (tab === "timer") {
        const d = $(".tm-disp", bodyEl);
        if (d) d.textContent = `${String(Math.floor(tmLeft / 3600000)).padStart(2, "0")}:${String(Math.floor((tmLeft % 3600000) / 60000)).padStart(2, "0")}:${String(Math.ceil((tmLeft % 60000) / 1000) % 60).padStart(2, "0")}`;
        const ring = $$("circle", bodyEl)[1];
        if (ring) ring.style.strokeDashoffset = 2 * Math.PI * 46 * (1 - tmLeft / tmState.total);
      } else if (tab === "world") {
        // update times only
        const rows = $$(".world-row", bodyEl);
        const here = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const heroTm = $(".world-hero .tm", bodyEl);
        if (heroTm) heroTm.textContent = fmtTime(now, undefined, true);
        OS.settings.worldClocks.forEach((c, i) => {
          const t = rows[i] && $(".tm", rows[i]);
          if (t) t.textContent = fmtTime(now, c.tz);
        });
      }
    }
  }, 500);

  paint();
  return { update() {}, destroy() { clearInterval(iv); } };
}

/* ═══ Weather ══════════════════════════════════════════════════════ */
function WeatherApp({ body }) {
  let w = null;
  let err = false;
  let alive = true;
  let loadVersion = 0;

  body.innerHTML = `<div class="weather">
    <div class="weather-head" data-drag="1" id="wx-head"></div>
    <div class="weather-scroll thin-scroll" id="wx-body"></div>
  </div>`;
  const headEl = $("#wx-head", body);
  const bodyEl = $("#wx-body", body);
  headEl.appendChild(citySearch("Search city…", (c) => { updateSettings({ city: c }); }));
  const locate = el("button", "btn", "Use my location");
  locate.onclick = async () => { try { updateSettings({ city: await requestLocation() }); } catch (e) { notify({ title: "Location unavailable", body: e.message }); } };
  headEl.appendChild(locate);

  function bg(code, isDay) {
    if (!isDay) return "linear-gradient(180deg,#0f172a,#1e1b4b 60%,#312e81)";
    if (isRain(code)) return "linear-gradient(180deg,#475569,#64748b 60%,#94a3b8)";
    if (code >= 2) return "linear-gradient(180deg,#5b8ecb,#8fb4de 60%,#c4d8ee)";
    return "linear-gradient(180deg,#2f80ed,#56ccf2 70%,#a8e6ff)";
  }

  function paintLoading() {
    $(".weather", body).style.background = "linear-gradient(180deg,#334155,#475569)";
    bodyEl.innerHTML = `<div style="display:flex;justify-content:center;padding:96px 0"><div class="spin"></div></div>`;
  }
  function paintErr() {
    bodyEl.innerHTML = `<div class="center-note" style="padding:80px 0;color:rgba(255,255,255,.85)">Couldn't load the forecast. Check your connection.</div>`;
  }

  function paint() {
    if (!w) return;
    const city = OS.settings.city;
    const code = w.current.weather_code;
    const day = w.current.is_day === 1;
    $(".weather", body).style.background = bg(code, day);
    $(".weather", body).classList.toggle("rainy", isRain(code));
    const hrIdx = Math.max(0, w.hourly.time.findIndex((t) => new Date(t) >= new Date()));
    const lo = Math.min(...w.daily.temperature_2m_min);
    const hi = Math.max(...w.daily.temperature_2m_max);
    bodyEl.innerHTML = `
      <div style="animation:slideUp .5s both">
        <div class="hero">
          <div class="cn">${esc(city.name.split(",")[0])}</div>
          <div class="tp">${Math.round(w.current.temperature_2m)}°</div>
          <div class="ds">${weatherGlyph(code, 22)} ${weatherTitle(code)}</div>
          <div class="hl">H:${Math.round(w.daily.temperature_2m_max[0])}° L:${Math.round(w.daily.temperature_2m_min[0])}°</div>
        </div>
        <div class="wcard glass glass-dark">
          <div class="cap">Hourly forecast</div>
          <div class="hourly no-scroll">${w.hourly.time.slice(hrIdx, hrIdx + 24).map((t, i) => `
            <div class="hcell"><span class="h">${i === 0 ? "Now" : esc(new Date(t).toLocaleTimeString([], { hour: "numeric" }))}</span>
            <span class="ic">${weatherGlyph(w.hourly.weather_code[hrIdx + i], 22)}</span>
            <span class="tp">${Math.round(w.hourly.temperature_2m[hrIdx + i])}°</span></div>`).join("")}</div>
        </div>
        <div class="wcard glass glass-dark">
          <div class="cap">7-day forecast</div>
          ${w.daily.time.map((t, i) => {
            const a = w.daily.temperature_2m_min[i], b = w.daily.temperature_2m_max[i];
            return `<div class="wday">
              <span class="nm">${i === 0 ? "Today" : esc(new Date(t + "T12:00").toLocaleDateString([], { weekday: "short" }))}</span>
              <span class="ic">${weatherGlyph(w.daily.weather_code[i], 22)}</span>
              <span class="lo">${Math.round(a)}°</span>
              <div class="bar"><i style="left:${((a - lo) / (hi - lo || 1)) * 100}%;right:${100 - ((b - lo) / (hi - lo || 1)) * 100}%"></i></div>
              <span class="hi">${Math.round(b)}°</span></div>`;
          }).join("")}
        </div>
        <div class="wstats">
          ${[["Feels like", `${Math.round(w.current.apparent_temperature)}°`], ["Humidity", `${w.current.relative_humidity_2m}%`], ["Wind", `${Math.round(w.current.wind_speed_10m)} mph`]].map(([k, v]) => `
            <div class="wstat glass glass-dark"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}
        </div>
      </div>`;
  }

  async function load() {
    const version = ++loadVersion;
    paintLoading();
    err = false;
    w = null;
    try {
      const d = await fetchWeather(OS.settings.city.lat, OS.settings.city.lon);
      if (!alive || version !== loadVersion) return;
      w = d;
      paint();
    } catch {
      if (!alive || version !== loadVersion) return;
      err = true;
      paintErr();
    }
  }
  load();
  const offWeather = bus.on("settings", p => { if (p && p.city) load(); });
  return { update() {}, destroy() { alive = false; offWeather(); } };
}

/* ═══ Terminal ═════════════════════════════════════════════════════ */
function TerminalApp({ win, body }) {
  const FS = {
    "/": ["home", "Applications", "System"],
    "/home": ["guest"],
    "/home/guest": ["Documents", "Pictures", "Desktop", "welcome.txt"],
    "/home/guest/Documents": ["notes.md"],
    "/home/guest/Pictures": [],
    "/home/guest/Desktop": [],
    "/home/guest/welcome.txt": "Welcome to CanopyOS Aurora.\nType `help` to see what you can do.",
    "/home/guest/Documents/notes.md": "# Notes\nThe canopy is the upper layer of a forest.",
    "/Applications": Object.values(APPS).map((a) => a.name + ".app"),
    "/System": ["Library", "Kernel"],
  };
  const start = Date.now();
  const user = (OS.user && OS.user.name ? OS.user.name : "guest").toLowerCase().replace(/\s+/g, "");
  let lines = [
    { t: "CanopyOS Aurora 1.0 — Last login: " + new Date().toLocaleString() },
    { t: "Type `help` for a list of commands." },
  ];
  let input = "";
  let cwd = "/home/guest";
  let hist = [];
  let hi = -1;

  body.innerHTML = `<div class="term">
    <div class="term-scroll thin-scroll selectable" id="t-scroll"></div>
  </div>`;
  const scroller = $("#t-scroll", body);
  let promptSpan = null;
  let inputEl = null;

  const resolve = (p) => {
    const parts = (p.startsWith("/") ? p : `${cwd}/${p}`).split("/").filter(Boolean);
    const out = [];
    for (const x of parts) { if (x === "..") out.pop(); else if (x !== ".") out.push(x); }
    return "/" + out.join("/");
  };

  function run(raw) {
    const [cmd, ...args] = raw.trim().split(/\s+/);
    const arg = args.join(" ");
    switch (cmd) {
      case "": return [];
      case "help":
        return ["Commands:", "  ls [dir]   cd <dir>   pwd   cat <file>   echo <text>   clear", "  date   whoami   uname   uptime   neofetch   history", "  open <app>   fern <question>   theme <dark|light>   cowsay <text>", "  apps   exit"];
      case "ls": {
        const e = FS[resolve(arg || ".")];
        return Array.isArray(e) ? [e.join("   ") || "(empty)"] : e ? [arg] : [`ls: ${arg}: No such file or directory`];
      }
      case "cd": {
        const p = resolve(arg || "/home/guest");
        if (Array.isArray(FS[p])) { cwd = p; return []; }
        return [`cd: ${arg}: No such directory`];
      }
      case "pwd": return [cwd];
      case "cat": {
        const f = FS[resolve(arg)];
        return typeof f === "string" ? f.split("\n") : [`cat: ${arg}: No such file`];
      }
      case "echo": return [arg];
      case "date": return [new Date().toString()];
      case "whoami": return [user];
      case "uname": return ["CanopyOS Aurora 1.0 (canopy-kernel) web/"];
      case "uptime": {
        const s = Math.floor((Date.now() - start) / 1000);
        return [`up ${Math.floor(s / 60)} min, ${s % 60} sec, 1 user`];
      }
      case "history": return hist.map((h, i) => `${String(i + 1).padStart(3)}  ${h}`);
      case "apps": return Object.values(APPS).map((a) => a.name);
      case "neofetch":
        return [
          "        ,▄▄▓▓▄▄,         " + user + "@canopy",
          "     ▄▓▓▓▓▓▓▓▓▓▓▄        -----------",
          "    ▓▓▓▓▓▓▓▓▓▓▓▓▓▓       OS: CanopyOS Aurora 1.0",
          "   ▐▓▓▓▓▓▓▓▓▓▓▓▓▓▓▌      Kernel: canopy-web",
          "    ▀▓▓▓▓▓▓▓▓▓▓▓▓▀       Shell: csh 1.0",
          "      ▀▀▓▓▓▓▓▓▀▀         Assistant: Fern",
          `         ▐▓▓▌            CPU: ${navigator.hardwareConcurrency || 8} cores`,
          `         ▐▓▓▌            Theme: Liquid Glass (${OS.theme()})`,
          `                         Resolution: ${window.innerWidth}x${window.innerHeight}`,
        ];
      case "open": {
        const id = Object.keys(APPS).find((a) => a === arg.toLowerCase() || APPS[a].name.toLowerCase() === arg.toLowerCase());
        if (!id) return [`open: no application named '${arg}'`];
        openApp(id);
        return [`Opening ${APPS[id].name}…`];
      }
      case "fern":
        openFern(arg || undefined);
        return ["Fern is listening."];
      case "theme":
        if (arg === "dark" || arg === "light") { updateSettings({ theme: arg }); return [`Theme set to ${arg}.`]; }
        return ["usage: theme <dark|light>"];
      case "cowsay":
        return [" " + "_".repeat(arg.length + 2), `< ${arg || "moo"} >`, " " + "-".repeat(arg.length + 2), "        \\   ^__^", "         \\  (oo)\\_______", "            (__)\\       )\\/\\", "                ||----w |", "                ||     ||"];
      case "exit":
        setTimeout(() => closeWindow(win.id), 200);
        return ["logout"];
      case "sudo":
        return ["Nice try."];
      default:
        return [`csh: command not found: ${cmd}`];
    }
  }

  function submit() {
    const c = input;
    if (c.trim() === "clear") lines = [];
    else lines = [...lines, { t: `${user}@canopy ${cwd.split("/").pop() || "/"} % ${c}`, cmd: true }, ...run(c).map((t) => ({ t }))];
    if (c.trim()) { hist.push(c); }
    input = "";
    hi = -1;
    paint();
  }

  function paint() {
    scroller.innerHTML = lines.map((l) => `<pre class="${l.cmd ? "term-cmd" : ""}">${esc(l.t)}</pre>`).join("");
    const row = el("div");
    row.style.display = "flex";
    promptSpan = el("span", "term-prompt", `${user}@canopy ${cwd.split("/").pop() || "/"} % `);
    inputEl = el("input", "term-in selectable");
    inputEl.value = input;
    inputEl.spellcheck = false;
    inputEl.oninput = () => { input = inputEl.value; };
    inputEl.onkeydown = (e) => {
      if (e.key === "Enter") submit();
      else if (e.key === "ArrowUp") {
